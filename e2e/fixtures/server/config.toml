# Server configuration for E2E tests.
# The server reads the config path from argv[1]; playwright.config.ts passes
# this file's absolute path, so the path below is resolved correctly regardless
# of the process CWD.

listen_address = "127.0.0.1:19090"
tls_cert_path = ""
tls_key_path = ""
auth_token = ""

# Isolated database — must NOT touch ~/.nession.
db_path = "/tmp/nession-e2e/nession.db"

# Heartbeat timeout — increased from default (30s) to 120s for CI stability.
# CI runners can be slow, and we want to avoid false "agent disconnected" errors.
heartbeat_timeout_secs = 120

# #2645: the runtime harness renders the P2P lease per profile. The acceptance
# profile uses a short lease so the expiry → physical-loss → renewal path is
# exercised without a five-minute sleep; the E2E regression profile keeps the
# production 300s lease so unrelated reconnect/restart scenarios are not
# perturbed by a reissue on every dial. Production keeps the 300s default; the
# browser renews before any dial whose lease is spent, and a healthy socket is
# never closed by expiry alone.
p2p_token_expiry_secs = _P2P_TOKEN_EXPIRY_SECS_

# Logging — set to info for debugging CI issues.
[logging]
level = "info"
