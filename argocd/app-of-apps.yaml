# Root Application — the only resource that needs manual `kubectl apply`.
# It discovers child Applications under argocd/apps/ and manages them.
#
# Bootstrap: kubectl apply -f argocd/app-of-apps.yaml
# After that, all changes to child Apps or k8s/ are auto-synced by ArgoCD.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nession-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nession.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
