# Root Application — the only resource that needs manual `kubectl apply`.
# It discovers child Applications under argocd/apps/ and manages them.
#
# Cutover bootstrap: kubectl apply -f argocd/app-of-apps.yaml  (from gitops branch)
# After that, all changes to child Apps or environments/ are auto-synced by ArgoCD.
# This file lives on the `gitops` branch — main no longer carries k8s/ or argocd/.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nession-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nession.git
    targetRevision: gitops
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
