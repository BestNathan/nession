# preprod — deploys environments/preprod/nession into its own namespace.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nession-preprod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nession.git
    targetRevision: gitops
    path: environments/preprod/nession
  destination:
    server: https://kubernetes.default.svc
    namespace: nession-preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
