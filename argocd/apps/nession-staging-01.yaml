# staging-01 — deploys environments/staging-01/nession into its own namespace.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nession-staging-01
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nession.git
    targetRevision: gitops
    path: environments/staging-01/nession
  destination:
    server: https://kubernetes.default.svc
    namespace: nession-staging-01
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
