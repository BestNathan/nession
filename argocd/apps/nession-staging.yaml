# staging — the retained legacy staging environment (owner decision 2026-09-05).
# Target of the staging-branch auto-deploy flow. Deliberately replicates the
# old overlay byte-for-byte (namespace nession, nameSuffix -staging, subPath
# storage, shared claude-home); only its source moves from main to gitops.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nession-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nession.git
    targetRevision: gitops
    path: environments/staging/nession
  destination:
    server: https://kubernetes.default.svc
    namespace: nession
  # The staging data claim is bound to the out-of-band PV
  # `nession-nfs-staging-server` — never declared in any overlay, see the
  # "Storage leftovers" note in this branch's README. The binding controller
  # writes that name into the live PVC's `spec.volumeName`, which the API
  # treats as immutable on a bound claim, so a Replace carrying an absent
  # `volumeName` is rejected and *every* sync fails on this object (#693).
  #
  # Copy the live value into the payload at sync time rather than declaring it:
  # `volumeName` is set by the binding controller, not by operations.
  # `RespectIgnoreDifferences=true` is what performs that copy — on its own
  # `ignoreDifferences` only affects diffing, the app reports Synced, and the
  # next sync still dies on the replace. (Sync option since Argo CD 2.3.)
  #
  # Scoped to this one claim so that a manifest/live storage mismatch on any
  # other PVC still fails loudly instead of being silently papered over.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: nession-server-data-staging
      jsonPointers:
        - /spec/volumeName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - RespectIgnoreDifferences=true
