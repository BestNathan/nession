# Staging — deploys k8s/overlays/staging into namespace nession (nameSuffix: -staging).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nession-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BestNathan/nession.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: nession
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
