# Nession Docker Compose
#
# Usage:
#   Agent 直连模式:    docker compose --profile agent up
#   Server 分布式模式: docker compose --profile server up
#   完整演示 (server + agent): docker compose --profile full up
#
# Build:
#   docker compose build

services:
  # ─── Scenario 1: Agent + WebUI (standalone) ───
  agent:
    image: nession-agent:latest
    build:
      context: ..
      dockerfile: Dockerfile.agent
      args:
        VITE_NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
        VITE_NESSION_TERMINAL_WEB_FONT_SIZE: "${NESSION_TERMINAL_WEB_FONT_SIZE:-14}"
        NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
    profiles: ["agent", "full"]
    ports:
      - "${AGENT_HTTP_PORT:-13000}:10080"
    environment:
      AGENT_ID: agent-docker
      AGENT_LISTEN: "0.0.0.0:19090"
      AGENT_SERVER_URL: ""   # standalone, no server
      # Required by the line above: with no Server there is nothing to mint a
      # credential, so the agent refuses to start without one rather than
      # binding a socket that refuses every connection (#1013).
      AGENT_TOKEN: "change-me-standalone"
      # Fixed terminal columns (#2487). The same value the Web image was
      # built with; the Agent validates it and uses it for new Sessions.
      NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
      LISTEN_PORT: "10080"
      SERVER_BACKEND: "127.0.0.1:19090"
      # Durable Agent state and EROFS cache (#3179). /data is the named
      # volume below; the cache is an explicit durable declaration, so the
      # Agent fails closed instead of silently using the container layer.
      NESSION_HOME: "/data"
      AGENT_EROFS_STORAGE_DIR: "${AGENT_EROFS_STORAGE_DIR:-/data/erofs}"
    volumes:
      - agent-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── Scenario 2: Server + WebUI ───
  server:
    image: nession-server:latest
    build:
      context: ..
      dockerfile: Dockerfile.server
      args:
        VITE_NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
        VITE_NESSION_TERMINAL_WEB_FONT_SIZE: "${NESSION_TERMINAL_WEB_FONT_SIZE:-14}"
        NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
        NESSION_TERMINAL_WEB_FONT_SIZE: "${NESSION_TERMINAL_WEB_FONT_SIZE:-14}"
    profiles: ["server", "full"]
    ports:
      - "${SERVER_HTTP_PORT:-18080}:10080"
    environment:
      SERVER_LISTEN: "0.0.0.0:18080"
      LISTEN_PORT: "10080"
      SERVER_BACKEND: "127.0.0.1:18080"
      SERVER_AUTH_TOKEN: "${SERVER_AUTH_TOKEN:-}"
      # The canonical Server data root (#3179). `server-data` is mounted at
      # this exact path below, so the metadata DB, image blobs and build
      # workspace all resolve under the named volume. `SERVER_DB_PATH` is
      # not a supported override: the Server resolves db_path from
      # NESSION_HOME.
      NESSION_HOME: "/data"
      # Fixed terminal columns and the Web max font (#2487). Derived from the
      # same release parameters as the Web build; the entrypoint writes them
      # into config.toml and the Server validates them at startup.
      NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
      NESSION_TERMINAL_WEB_FONT_SIZE: "${NESSION_TERMINAL_WEB_FONT_SIZE:-14}"
    volumes:
      - server-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── Agent that connects to server (full demo) ───
  agent-remote:
    image: nession-agent:latest
    build:
      context: ..
      dockerfile: Dockerfile.agent
      args:
        VITE_NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
        VITE_NESSION_TERMINAL_WEB_FONT_SIZE: "${NESSION_TERMINAL_WEB_FONT_SIZE:-14}"
        NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
    profiles: ["full"]
    environment:
      AGENT_ID: agent-remote
      AGENT_LISTEN: "0.0.0.0:19090"
      AGENT_SERVER_URL: "ws://server:18080"
      NESSION_TERMINAL_COLS: "${NESSION_TERMINAL_COLS:-96}"
      # Distinct durable Agent state and EROFS cache (#3179).
      NESSION_HOME: "/data"
      AGENT_EROFS_STORAGE_DIR: "${AGENT_EROFS_STORAGE_DIR:-/data/erofs}"
    volumes:
      - agent-remote-data:/data
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-data:
  agent-remote-data:
  server-data:
