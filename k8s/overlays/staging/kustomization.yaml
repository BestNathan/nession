apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nession

nameSuffix: -staging

commonLabels:
  env: staging

resources:
- ../../base

images:
- name: ghcr.io/bestnathan/nession-agent
  newName: ghcr.io/bestnathan/nession
  newTag: agent-b9a7426
- name: ghcr.io/bestnathan/nession-server
  newName: ghcr.io/bestnathan/nession
  newTag: server-b9a7426
- name: ghcr.io/bestnathan/nession-ui
  newName: ghcr.io/bestnathan/nession
  newTag: ui-b9a7426

patches:
- path: patch-ingress.yaml
- path: patch-agent-env.yaml
# Isolate staging data on shared PVC via subPath.
- target:
    kind: Deployment
    name: nession-server
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/0/subPath
      value: staging
- target:
    kind: Deployment
    name: nession-agent
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/1/subPath
      value: staging
