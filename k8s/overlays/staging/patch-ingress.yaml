# Patch ingress hosts for staging environment.
# nameSuffix handles the -staging rename; these patches change the host values.
# The http/paths/backend are included because rules use "replace" merge strategy.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-server
  annotations:
    higress.io/domain: "staging.nession.nhome.local"
spec:
  rules:
    - host: staging.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-server
                port:
                  number: 10080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-agent
  annotations:
    higress.io/domain: "staging.agent.nession.nhome.local"
spec:
  rules:
    - host: staging.agent.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-agent
                port:
                  number: 10080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-ui
  annotations:
    higress.io/domain: "staging.ui.nession.nhome.local"
spec:
  rules:
    - host: staging.ui.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-ui
                port:
                  number: 80
