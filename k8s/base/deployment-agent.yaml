apiVersion: apps/v1
kind: Deployment
metadata:
  name: nession-agent
  labels:
    app: nession
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nession
      component: agent
  template:
    metadata:
      labels:
        app: nession
        component: agent
    spec:
      containers:
        - name: nession-agent
          image: ghcr.io/bestnathan/nession-agent:main
          imagePullPolicy: Always
          ports:
            - containerPort: 10080
              name: http
            - containerPort: 19090
              name: agent-ws
          env:
            - name: LISTEN_PORT
              value: "10080"
            - name: AGENT_ID
              value: "k8s-agent"
            - name: AGENT_LISTEN
              value: "0.0.0.0:19090"
            - name: AGENT_SERVER_URL
              value: "ws://nession-server:18080"
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nession-secret
                  key: auth-token
            - name: AGENT_CONNECT_URL
              value: "ws://agent.nession.nhome.local/ws"
            - name: SERVER_BACKEND
              value: "127.0.0.1:19090"
          livenessProbe:
            httpGet:
              path: /health
              port: 10080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 10080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      # imagePullSecrets not needed — ghcr.io/bestnathan/nession is public
