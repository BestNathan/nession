apiVersion: apps/v1
kind: Deployment
metadata:
  name: nession-agent
  labels:
    app: nession
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nession
      component: agent
  template:
    metadata:
      labels:
        app: nession
        component: agent
    spec:
      initContainers:
        - name: install-claude-code
          image: ghcr.io/bestnathan/nession-agent:main
          command:
            - sh
            - -c
            - |
              set -e

              # If already installed on the persistent volume, skip.
              if [ -x /shared/bin/node ] && [ -x /shared/bin/claude ]; then
                echo "=== Claude Code already installed, skipping ==="
                /shared/bin/node --version
                /shared/bin/claude --version
                exit 0
              fi

              echo "=== Installing Node.js + Claude Code ==="

              # --- APT: switch to Aliyun mirror ---
              cat > /etc/apt/sources.list << APTEOF
              deb http://mirrors.aliyun.com/debian bullseye main
              deb http://mirrors.aliyun.com/debian-security bullseye-security main
              deb http://mirrors.aliyun.com/debian bullseye-updates main
              APTEOF

              apt-get update -qq
              apt-get install -y -qq curl ca-certificates 2>&1 | tail -2

              # --- Node.js 22 via NodeSource (bullseye-compatible) ---
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash - 2>&1 | tail -1
              apt-get install -y -qq nodejs 2>&1 | tail -1

              # --- npm: Aliyun mirror ---
              npm config set registry https://registry.npmmirror.com

              # --- Install Claude Code ---
              npm install -g @anthropic-ai/claude-code 2>&1 | tail -3

              # --- Copy to shared volume ---
              mkdir -p /shared/bin /shared/lib
              cp /usr/bin/node /shared/bin/
              cp /usr/bin/claude /shared/bin/
              cp -a /usr/lib/node_modules /shared/lib/

              echo "=== Init done ==="
              /shared/bin/node --version
              /shared/bin/claude --version
          volumeMounts:
            - name: claude-tools
              mountPath: /shared
              subPath: nession/claude-tools
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      containers:
        - name: nession-agent
          image: ghcr.io/bestnathan/nession-agent:main
          imagePullPolicy: Always
          ports:
            - containerPort: 10080
              name: http
            - containerPort: 19090
              name: agent-ws
          env:
            - name: LISTEN_PORT
              value: "10080"
            - name: AGENT_ID
              value: "k8s-agent"
            - name: AGENT_LISTEN
              value: "0.0.0.0:19090"
            - name: AGENT_SERVER_URL
              value: "ws://nession-server:18080"
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nession-secret
                  key: auth-token
            - name: AGENT_CONNECT_URL
              value: "ws://agent.nession.nhome.local/ws"
            - name: SERVER_BACKEND
              value: "127.0.0.1:19090"
            # Claude Code tools from init container
            - name: PATH
              value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/claude-tools/bin"
            - name: NODE_PATH
              value: "/opt/claude-tools/lib/node_modules"
          volumeMounts:
            - name: claude-tools
              mountPath: /opt/claude-tools
              subPath: nession/claude-tools
          livenessProbe:
            httpGet:
              path: /health
              port: 10080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 10080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      # imagePullSecrets not needed — ghcr.io/bestnathan/nession is public
      volumes:
        - name: claude-tools
          persistentVolumeClaim:
            claimName: claude-tools
