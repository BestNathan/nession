apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nession

images:
- name: ghcr.io/bestnathan/nession-agent
  newName: ghcr.io/bestnathan/nession
  newTag: agent-main
- name: ghcr.io/bestnathan/nession-server
  newName: ghcr.io/bestnathan/nession
  newTag: server-main

  # ── 共用 ──
  # ── Server 套件 ──
  # ── Agent 套件 ──
resources:
- namespace.yaml
- secret.yaml
- deployment-server.yaml
- service-server.yaml
- ingress-server.yaml
- deployment-agent.yaml
- service-agent.yaml
- ingress-agent.yaml
