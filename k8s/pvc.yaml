apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nession-data-pvc
  namespace: nession
  labels:
    app: nession
    component: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Uncomment and set your cluster's default StorageClass:
  # storageClassName: standard
