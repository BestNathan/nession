# #4588: agent-nession.bestnathan.top is the canonical single-label host. The
# nested agent.nession.bestnathan.top name is retained as LAN compatibility
# during migration and retired only after cutover readback; nhome.local is
# preserved verbatim. TLS for bestnathan.top terminates at the nitops-owned SLB
# (cert-manager wildcard), not here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-agent
  annotations:
    higress.io/domain: "agent.nession.nhome.local agent.nession.bestnathan.top agent-nession.bestnathan.top"
    higress.io/upstream-read-timeout: "86400"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: higress
  rules:
    - host: agent.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-agent
                port:
                  number: 10080
    - host: agent.nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-agent
                port:
                  number: 10080
    - host: agent-nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-agent
                port:
                  number: 10080
