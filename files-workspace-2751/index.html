function isValidName(name){return !!name&&name!=="."&&name!==".."&&name.indexOf("/")<0&&name.indexOf("\\")<0&&name.indexOf("\0")<0;}

function row(n,depth){var isFolder=n.kind==="dir",expanded=!!state.expanded[n.path],chosen=state.selected===n.path;

function mobileRoot(){return state.stack[state.stack.length-1]||"";}
function mobileBrowser(){var dir=mobileRoot();var list=children(dir);return '<div class="mobile-mock"><div class="phone-top"><div><div class="title">'+esc(dir?base(dir):"Files")+'</div><div class="phone-sub">'+esc(sourceShort())+' · '+esc(slash(dir))+'</div></div><div style="display:flex;gap:5px">'+(state.stack.length>1?button("up","‹","iconbtn",'aria-label="Back to parent"'):"")+button("mobile-add","+","iconbtn",'aria-label="New file or folder"')+'</div></div><div class="phone-content">'+(list.length?list.map(function(n){return '<div style="display:flex;align-items:center"><button class="phone-row" data-action="'+(n.kind==="dir"?"enter":"mobile-open")+'" data-path="'+esc(n.path)+'"><span class="file-icon'+(n.kind==="dir"?" folder-icon":"")+'">'+icon(n)+'</span><span class="fill"><div class="name">'+esc(base(n.path))+'</div><div class="desc">'+(n.kind==="dir"?"Folder":"Text file · v"+n.version)+'</div></span><span style="color:#81909f">'+(n.kind==="dir"?"›":"")+'</span></button><button class="more" style="opacity:1;width:30px" data-action="mobile-menu" data-path="'+esc(n.path)+'" aria-label="Actions for '+esc(base(n.path))+'">···</button></div>';}).join(""):'<div class="empty" style="min-height:270px"><div><div class="symbol">◇</div><strong>Empty folder</strong>Create a file here using +.</div></div>')+'</div><div class="phone-footer">Current folder: '+esc(slash(dir))+' · Tap a folder to enter</div>'+(state.sheet?mobileSheet():"")+'</div>';}
function mobileViewer(){var n=node(state.open),d=n?doc(n.path):null;if(!n)return mobileBrowser();return '<div class="mobile-mock"><div class="phone-top"><div><div class="title">'+esc(base(n.path))+(dirty(n.path)?" ●":"")+'</div><div class="phone-sub">'+esc(n.path)+'</div></div><div style="display:flex;gap:5px">'+button("mobile-back","‹","iconbtn",'aria-label="Back to Files"')+(state.editing?button("save","Save","btn primary"):button("edit","Edit","btn"))+'</div></div><div class="phone-content" style="padding:0">'+(state.editing?'<textarea class="editarea" id="editor" spellcheck="false" aria-label="Mobile file editor" style="min-height:100%">'+esc(d.draft)+'</textarea>':'<pre class="lines" style="font-size:11px;padding-left:53px">'+codeLines(d.draft)+'</pre>')+'</div><div class="phone-footer">'+(state.editing?"Editable draft · Back prompts if unsaved":"Read first · Edit explicitly")+' · '+esc(sourceShort())+'</div>'+'</div>';}
function mobileSheet(){var path=state.sheet.path,kind=state.sheet.kind;return '<div class="sheet" role="dialog" aria-label="Folder actions"><div class="eyebrow">Actions · '+esc(slash(path))+'</div><strong>'+(kind==="folder"?"Folder":"Current directory")+'</strong>'+button("sheet-file","+ New file here","sheetbtn")+button("sheet-dir","+ New folder here","sheetbtn")+button("sheet-upload","↑ Upload here (mock)","sheetbtn")+button("sheet-close","Cancel","sheetbtn")+'</div>';}
function mobile(){return '<div class="mobile-wrap">'+(state.offline?offlineView():'<div class="phone">'+(state.mobileView==="viewer"?mobileViewer():mobileBrowser())+'</div>')+'</div>';}
function menu(){if(!state.context)return "";var c=state.context,n=node(c.path);if(!n)return "";var dir=n.kind==="dir"?n.path:parent(n.path);return '<div class="context-menu" role="menu" style="left:'+Math.max(6,Math.min(window.innerWidth-214,c.x))+'px;top:'+Math.max(6,Math.min(window.innerHeight-190,c.y))+'px"><small>'+esc(c.path)+'</small>'+button("context-file","＋ New file here","")+button("context-dir","＋ New folder here","")+button("context-browse","Browse this folder","") +button("context-cancel","Close","")+'</div>';}
function form(){if(!state.form)return "";var f=state.form;return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="form-title"><h2 id="form-title">New '+(f.kind==="file"?"file":"folder")+'</h2><p>The destination is captured when you open this form. Another selection cannot redirect it.</p><div class="destination"><small>Destination · '+esc(f.source==="host"?"Beijing Agent / Host":"dev-session / Sandbox mock")+'</small><code>'+esc(slash(f.target))+'</code></div><label class="field-label" for="filename">Name</label><input class="field" id="filename" autocomplete="off" value="'+esc(f.name)+'" placeholder="'+(f.kind==="file"?"Button.tsx":"new-folder")+'"><div class="errorline" id="form-error" role="alert">'+esc(f.error||"")+'</div><div class="dialog-foot">'+button("close-form","Cancel","btn")+button("submit-form","Create "+(f.kind==="file"?"file":"folder"),"btn primary")+'</div></div></div>';}
function dialog(){if(!state.dialog)return "";var d=state.dialog;var title=d.type==="unsaved"?"Unsaved changes":d.type==="conflict"?"The file changed elsewhere":d.type==="overwrite"?"Confirm overwriting remote changes":"Notice";
var desc=d.type==="unsaved"?"You have unsaved edits in "+state.open+". Choose whether to keep editing or discard the draft before leaving.":d.type==="conflict"?"An Agent or another editor updated this file after your local draft was opened. Saving will not silently overwrite it.":d.type==="overwrite"?"This explicit action replaces the latest remote version with your local draft. Use only after reviewing the conflict.":"";
var buttons=d.type==="unsaved"?button("guard-stay","Keep editing","btn")+button("guard-discard","Discard and continue","btn primary"):d.type==="conflict"?button("conflict-cancel","Continue editing","btn")+button("conflict-reload","Reload remote","btn")+button("conflict-overwrite","Review overwrite…","btn primary"):button("overwrite-back","Cancel","btn")+button("overwrite-confirm","Overwrite remote","btn primary");
return '<div class="overlay"><div class="dialog" role="alertdialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p><div class="dialog-foot">'+buttons+'</div></div></div>';}
function render(){document.getElementById("app").innerHTML=header()+'<div class="frame"><main class="workspace">'+workspaceHeader()+(state.mode==="web"?desktop():mobile())+'</main></div><div class="hint"><span>Design mock · No filesystem writes, real agent permissions, or sandbox enforcement.</span><span><a id="source-link" href="https://github.com/BestNathan/nession/tree/prototype/files-workspace-2751" target="_blank" rel="noopener">View source ↗</a> · <a href="https://github.com/BestNathan/nession/issues/2751" target="_blank" rel="noopener">Requirement #2751</a></span></div>'+menu()+form()+dialog();if(state.form){var inp=document.getElementById("filename");if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}if(state.editing){var ed=document.getElementById("editor");if(ed){ed.focus();}}}
function notify(msg,error){state.notice=msg;state.noticeError=!!error;}
function getDraft(){var el=document.getElementById("editor");if(el&&state.open){var d=doc(state.open);if(d)d.draft=el.value;}}
function guard(callback){getDraft();if(isAnyDirty()){state.dialog={type:"unsaved"};state.pending=callback;render();return;}callback();}
function select(path){var n=node(path);if(!n)return;state.selected=path;state.context=null;if(n.kind==="file"){guard(function(){state.open=path;state.editing=false;render();});}else{render();}}
function toggle(path){state.expanded[path]=!state.expanded[path];render();}
function openForm(kind,explicit){var target=explicit===undefined?state.mode==="app"?mobileRoot():selectionTarget():explicit;state.form={kind:kind,target:target,source:state.source,name:"",error:""};state.sheet=null;state.context=null;render();}
function submitForm(){var f=state.form;if(!f)return;var nm=(document.getElementById("filename")||{}).value||f.name;f.name=nm;var name=nm.trim();if(!isValidName(name)){f.error="Use a single filename, not a path. '/' , '\\' , '.' and '..' are not valid.";render();return;}if(f.source!==state.source||state.offline){f.error="The selected source is unavailable or has changed. Cancel and try again.";render();return;}var path=f.target?f.target+"/"+name:name;if(node(path)){f.error="Already exists: "+path+". Nothing was overwritten.";render();return;}if(f.target&&(!node(f.target)||node(f.target).kind!=="dir")){f.error="Destination no longer exists.";render();return;}repo()[path]={path:path,kind:f.kind==="file"?"file":"dir",content:"",version:1};state.form=null;state.selected=path;var p=f.target;while(p){state.expanded[p]=true;p=parent(p);}if(f.kind==="file"){state.open=path;state.editing=false;doc(path);if(state.mode==="app")state.mobileView="viewer";}else if(state.mode==="app"){state.stack.push(path);}notify("Created "+path+" in "+sourceShort()+" · no overwrite");render();}
function save(){getDraft();if(!state.open)return;var n=node(state.open),d=doc(state.open);if(!n||!d)return;if(n.version!==d.version){state.dialog={type:"conflict"};render();return;}n.content=d.draft;n.version++;d.baseline=d.draft;d.version=n.version;state.editing=false;notify("Saved "+n.path+" at version "+n.version);render();}
function externalUpdate(){getDraft();var n=node(state.open);if(!n)return;n.content=n.content+"\n// Simulated external Agent edit (version "+(n.version+1)+")\n";n.version++;notify("Remote file advanced to v"+n.version+". Try Save to inspect conflict.");render();}
function reset(){state.stores=initialStores();state.source="host";state.offline=false;state.selected=null;state.currentDir="src";state.expanded={"src":true};state.open="src/App.tsx";state.docs={};state.editing=false;state.stack=[""];state.mobileView="browser";state.form=null;state.dialog=null;state.pending=null;state.context=null;state.sheet=null;notify("Mock fixture reset to initial state");render();}
function click(action,path,el,event){switch(action){
case "reset":reset();break;
case "web":getDraft();state.mode="web";state.sheet=null;render();break;
case "app-mode":getDraft();state.mode="app";state.sheet=null;render();break;
case "offline":state.offline=!state.offline;state.form=null;state.sheet=null;notify(state.offline?"Source unreachable. No host fallback.":"Mock source restored.");render();break;
case "unselect":state.selected=null;notify("Selection cleared · default destination is "+slash(state.currentDir));render();break;
case "new-file":openForm("file");break;case "new-dir":openForm("dir");break;
case "upload":notify("Upload is not connected in this design mock. Its target would be "+slash(selectionTarget())+".");render();break;
case "toggle":toggle(path);break;case "pick":select(path);break;
case "menu":case "mobile-menu":{var r=el.getBoundingClientRect();if(action==="mobile-menu"){state.sheet={path:node(path).kind==="dir"?path:parent(path),kind:"folder"};render();}else{state.context={path:path,x:r.right-10,y:r.bottom+4};render();}break;}
case "context-file":openForm("file",node(state.context.path).kind==="dir"?state.context.path:parent(state.context.path));break;
case "context-dir":openForm("dir",node(state.context.path).kind==="dir"?state.context.path:parent(state.context.path));break;
case "context-browse":{var x=node(state.context.path);state.currentDir=x.kind==="dir"?x.path:parent(x.path);state.context=null;notify("Browsing "+slash(state.currentDir)+"; selection stays independent.");render();break;}
case "context-cancel":state.context=null;render();break;
case "submit-form":submitForm();break;case "close-form":state.form=null;render();break;
case "edit":state.editing=true;render();break;
case "cancel-edit":guard(function(){state.editing=false;render();});break;
case "save":save();break;
case "remote-update":externalUpdate();break;
case "guard-stay":state.dialog=null;state.pending=null;render();break;
case "guard-discard":{var d=doc(state.open);if(d)d.draft=d.baseline;state.editing=false;state.dialog=null;var p=state.pending;state.pending=null;if(p)p();else render();break;}
case "conflict-cancel":state.dialog=null;render();break;
case "conflict-reload":{var remote=node(state.open),d1=doc(state.open);d1.draft=remote.content;d1.baseline=remote.content;d1.version=remote.version;state.dialog=null;state.editing=false;notify("Reloaded remote version v"+remote.version+"; previous local draft discarded.");render();break;}
case "conflict-overwrite":state.dialog={type:"overwrite"};render();break;
case "overwrite-back":state.dialog={type:"conflict"};render();break;
case "overwrite-confirm":{var n2=node(state.open),d2=doc(state.open);n2.content=d2.draft;n2.version++;d2.baseline=d2.draft;d2.version=n2.version;state.editing=false;state.dialog=null;notify("Explicit overwrite completed at v"+n2.version);render();break;}
case "enter":state.stack.push(path);state.sheet=null;render();break;
case "up":state.stack.pop();render();break;
case "mobile-open":guard(function(){state.open=path;state.editing=false;state.mobileView="viewer";render();});break;
case "mobile-back":guard(function(){state.mobileView="browser";state.editing=false;render();});break;
case "mobile-add":state.sheet={path:mobileRoot(),kind:"directory"};render();break;
case "sheet-file":openForm("file",state.sheet.path);break;
case "sheet-dir":openForm("dir",state.sheet.path);break;
case "sheet-upload":notify("Upload is unavailable in mock. Destination: "+slash(state.sheet.path));state.sheet=null;render();break;
case "sheet-close":state.sheet=null;render();break;
}}
document.getElementById("app").addEventListener("click",function(e){var b=e.target.closest("[data-action]");if(!b)return;click(b.dataset.action,b.dataset.path,b,e);});
document.getElementById("app").addEventListener("contextmenu",function(e){var row=e.target.closest(".tree-row");if(row&&state.mode==="web"){e.preventDefault();state.context={path:row.dataset.path,x:e.clientX,y:e.clientY};render();}});
document.getElementById("app").addEventListener("input",function(e){if(e.target.id==="editor"){var d=doc(state.open);if(d)d.draft=e.target.value;var tag=document.querySelector(".detail .tag");if(tag){tag.textContent=dirty(state.open)?"Unsaved":"v"+node(state.open).version;tag.classList.toggle("dirty",dirty(state.open));}}if(e.target.id==="filename"&&state.form){state.form.name=e.target.value;state.form.error="";var er=document.getElementById("form-error");if(er)er.textContent="";}});
document.getElementById("app").addEventListener("change",function(e){if(e.target.id==="source-picker"){getDraft();state.source=e.target.value;state.selected=null;state.currentDir="src";state.open=null;state.expanded={"src":true};state.stack=[""];state.mobileView="browser";state.editing=false;state.form=null;state.sheet=null;state.context=null;state.offline=false;notify("Switched source. FileRefs and selection were not retargeted.");render();}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(state.dialog){state.dialog=null;state.pending=null;render();}else if(state.form){state.form=null;render();}else if(state.context){state.context=null;render();}else if(state.sheet){state.sheet=null;render();}}if(e.key==="Enter"&&e.target&&e.target.id==="filename"){e.preventDefault();submitForm();}});
render();
var link=document.getElementById("source-link");
fetch("../manifest.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("no manifest");return r.json();}).then(function(m){var sha=m.source_sha||m.prototype_sha||m.sha||m.commit_sha;if(/^[0-9a-f]{40}$/.test(sha)){var a=document.getElementById("source-link");if(a)a.href="https://github.com/BestNathan/nession/blob/"+sha+"/files-workspace-2751/index.html";}}).catch(function(){});
})();
</script>
