name: Test / SC09 Clean Branch Dispatch Sender
# Disposable sender on a separate ref, not a production writer.
# Target is a read-only feature-ref Metrics / Replay Request workflow.
on:
  push:
    branches: [test/1690-clean-dispatch-sender]
    paths: [.github/workflows/sc09-clean-dispatch-probe.yml]
permissions:
  contents: read
  actions: write
jobs:
  send:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/test/1690-clean-dispatch-sender' && github.actor == 'BestNathan'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch only the unprivileged Metrics replay request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run metrics-replay-request.yml --repo BestNathan/nession --ref test/1690-untrusted-replay-ref
          echo 'Only actions:write API dispatch, no Store/App write credential.' >> "$GITHUB_STEP_SUMMARY"
