name: Deploy / Seal GitOps Secret
# Encrypted GitOps desired state from a protected GitHub Environment (#3912).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Allowlisted Kubernetes Secret target
        required: true
        type: choice
        options:
          - staging-mcp
concurrency:
  group: gitops-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/ci/seal-gitops-secret.test.mjs
  seal:
    needs: verify
    runs-on: ubuntu-24.04
    environment: staging-mcp
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SEAL_TARGET: ${{ inputs.target }}
      SEALED_SECRETS_CERT_B64: ${{ vars.SEALED_SECRETS_CERT_B64 }}
      K8S_SECRET_DATA_JSON: ${{ secrets.K8S_SECRET_DATA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gitops
          path: gitops
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned kubeseal with upstream checksum validation
        shell: bash
        run: |
          set -euo pipefail
          version=0.27.1
          tarball="kubeseal-$version-linux-amd64.tar.gz"
          base="https://github.com/bitnami/sealed-secrets/releases/download/v$version"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/sealed-secrets_$version""_checksums.txt"
          expected="$(grep -F "$tarball" "$RUNNER_TEMP/checksums.txt" | grep -Eo '[0-9a-f]{64}' | head -n1)"
          test -n "$expected" || { echo "::error::missing upstream checksum"; exit 1; }
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" kubeseal
          chmod +x "$RUNNER_TEMP/kubeseal"
      - name: Encrypt offline with public certificate and strict resource scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/nession-seal"' EXIT
          node source/scripts/ci/seal-gitops-secret.mjs prepare "$SEAL_TARGET"
          openssl x509 -in "$RUNNER_TEMP/nession-seal/cert.pem" -noout -checkend 86400
          "$RUNNER_TEMP/kubeseal" --cert "$RUNNER_TEMP/nession-seal/cert.pem" \
            --scope strict --format json \
            < "$RUNNER_TEMP/nession-seal/secret.json" \
            > "$RUNNER_TEMP/nession-seal/sealed.json"
          node source/scripts/ci/seal-gitops-secret.mjs stage "$SEAL_TARGET" "$GITHUB_WORKSPACE/gitops"
      - name: Commit only encrypted GitOps resources
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git add -- environments/staging/mcp/sealed-secret.json environments/staging/mcp/kustomization.yaml
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "secrets(staging-mcp): publish encrypted config (#3912)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin gitops && git push origin HEAD:gitops; then
              echo "Encrypted GitOps resource published"
              exit 0
            fi
            if [[ -d .git/rebase-apply || -d .git/rebase-merge ]]; then
              git rebase --abort || true
              echo "::error::GitOps conflict; refusing to publish"
              exit 1
            fi
            sleep "$((i * 2))"
          done
          echo "::error::GitOps write failed"
          exit 1
