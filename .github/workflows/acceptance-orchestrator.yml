name: Acceptance / Orchestrator

on:
  pull_request_target:
    branches: [staging, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  repository_dispatch:
    types: [nession-issue-e2e-projected, nession-agent-telemetry-ingested]
  workflow_run:
    workflows: ["CI / Quality Gate", "E2E / Tests"]
    # PR-only source reconciliation. Main push completion belongs to the
    # separate Acceptance / Post-Run Waker, not this PR retry workflow.
    # Filter at event delivery, not with a no-op job after run creation.
    branches-ignore: [main]
    types: [completed]
  issues:
    types: [closed]
  push:
    branches: [staging, main]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  # New PR edits may cancel stale PR review but must never cancel the sole
  # verified-evidence waker for the same PR.
  group: requirement-acceptance-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pr_number || github.event.issue.number || github.run_id }}-${{ github.event_name == 'pull_request_target' && 'pr' || 'waker' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  prepare-pre-merge:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue_numbers: ${{ steps.discover.outputs.issue_numbers }}
      has_requirements: ${{ steps.discover.outputs.has_requirements }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      quality_run_id: ${{ steps.quality.outputs.run_id }}
      e2e_run_id: ${{ steps.e2e.outputs.run_id }}
    steps:
      # pull_request_target is credentialed. Always execute trusted main tooling;
      # never checkout or execute PR-head code in this orchestration job.
      - name: Checkout trusted acceptance tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Self-test acceptance tooling
        run: |
          ./gates/run --suite acceptance-tooling

      - name: Pin PR head
        id: context
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Discover implemented requirements
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          issue_numbers="$(node scripts/requirement-acceptance.mjs discover-pre-merge)"
          echo "issue_numbers=${issue_numbers}" >> "${GITHUB_OUTPUT}"
          if [[ "$(jq 'length' <<<"${issue_numbers}")" -gt 0 ]]; then
            echo "has_requirements=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_requirements=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check completed Quality Gate on exact PR head
        id: quality
        if: steps.discover.outputs.has_requirements == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # One bounded snapshot check only: workflow_run events later replay
          # failed Acceptance jobs when source workflows finish.
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-quality.yml \
            --commit "$HEAD_SHA" --event pull_request --limit 20 \
            --json databaseId,status,conclusion)"
          run="$(jq -c '.[0] // empty' <<< "$runs")"
          [[ -n "$run" ]] || { echo "::error::Quality Gate has not completed; awaiting workflow_run reconciliation"; exit 1; }
          status="$(jq -r .status <<< "$run")"
          result="$(jq -r '.conclusion // ""' <<< "$run")"
          [[ "$status" == completed && "$result" == success ]] || {
            echo "::error::Quality Gate not yet verified success for $HEAD_SHA (state=$status, result=$result)"; exit 1;
          }
          run_id="$(jq -r .databaseId <<< "$run")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Check completed E2E Tests on exact PR head
        id: e2e
        if: steps.discover.outputs.has_requirements == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # One bounded snapshot check only: workflow_run events later replay
          # failed Acceptance jobs when source workflows finish.
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e-tests.yml \
            --commit "$HEAD_SHA" --event pull_request --limit 20 \
            --json databaseId,status,conclusion)"
          run="$(jq -c '.[0] // empty' <<< "$runs")"
          [[ -n "$run" ]] || { echo "::error::E2E Tests has not completed; awaiting workflow_run reconciliation"; exit 1; }
          status="$(jq -r .status <<< "$run")"
          result="$(jq -r '.conclusion // ""' <<< "$run")"
          [[ "$status" == completed && "$result" == success ]] || {
            echo "::error::E2E Tests not yet verified success for $HEAD_SHA (state=$status, result=$result)"; exit 1;
          }
          run_id="$(jq -r .databaseId <<< "$run")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"


      # Verify only the Issues actually implemented by this PR. A workflow
      # dependency PR must not claim another PR's selected-E2E verdicts.
      # Require exact-head Issue projection before invoking an Acceptance Agent.
      - name: Verify exact-head Issue E2E obligations before Agent review
        if: steps.discover.outputs.has_requirements == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/issue-e2e-gate.mjs ]]; then
            echo "::error::Trusted Issue E2E gate owner is missing from main; exact-head selected evidence cannot be verified"
            exit 1
          fi
          issue_numbers='${{ steps.discover.outputs.issue_numbers }}'
          for issue in $(jq -r '.[]' <<< "$issue_numbers"); do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > "$RUNNER_TEMP/e2e-preflight-$issue.json"
            if jq -e '.body | contains("## E2E Verification")' "$RUNNER_TEMP/e2e-preflight-$issue.json" > /dev/null; then
              node scripts/issue-e2e-gate.mjs verify "$RUNNER_TEMP/e2e-preflight-$issue.json" "$TARGET_SHA"
            else
              echo "Legacy Issue #$issue retains existing full-E2E eligibility"
            fi
          done
  pre-merge-acceptance:
    needs: prepare-pre-merge
    if: needs.prepare-pre-merge.outputs.has_requirements == 'true'
    strategy:
      fail-fast: false
      matrix:
        issue_number: ${{ fromJSON(needs.prepare-pre-merge.outputs.issue_numbers) }}
    uses: ./.github/workflows/agent-sc-acceptance.yml
    with:
      issue_number: ${{ matrix.issue_number }}
      stage: pre-merge
      provider: cursor
      target_ref: ${{ needs.prepare-pre-merge.outputs.head_sha }}
      deployment: ''
    secrets: inherit

  pre-merge-gate:
    needs: [prepare-pre-merge, pre-merge-acceptance]
    if: >-
      always() &&
      needs.prepare-pre-merge.result == 'success' &&
      (needs.pre-merge-acceptance.result == 'success' || needs.pre-merge-acceptance.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enforce pre-merge requirement acceptance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gates/run requirement-acceptance-pre-merge

      - name: Enforce Issue New and Regression E2E evidence on PR head
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/issue-e2e-gate.mjs ]]; then
            echo "Pre-activation compatibility: Issue E2E Gate not deployed on main"
            exit 0
          fi
          issue_numbers="$(node scripts/requirement-acceptance.mjs discover-pre-merge)"
          for number in $(jq -r '.[]' <<< "$issue_numbers"); do
            gh api "repos/$GITHUB_REPOSITORY/issues/$number" > "$RUNNER_TEMP/e2e-issue-$number.json"
            if jq -e '.body | contains("## E2E Verification")' "$RUNNER_TEMP/e2e-issue-$number.json" >/dev/null; then
              node scripts/issue-e2e-gate.mjs verify "$RUNNER_TEMP/e2e-issue-$number.json" "$TARGET_SHA"
            else
              echo "Legacy Issue #$number: retaining full-suite E2E compatibility"
            fi
          done

  acceptance-pr-gate:
    needs: pre-merge-gate
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && needs.pre-merge-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate closing requirement issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gates/run requirement-acceptance-pr

  acceptance-close-guard:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Guard completed requirement closure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gates/run requirement-acceptance-close

  # The push target is already merged; only explicit method=agent SCs may
  # invoke a model. The Case runner remains an independently authenticated
  # evidence producer and uses the same trusted SC plan in acceptance-executor.
  prepare-merged-agent:
    if: github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      stage: ${{ steps.select.outputs.stage }}
      agent_issues: ${{ steps.select.outputs.agent_issues }}
      has_agents: ${{ steps.select.outputs.has_agents }}
    steps:
      - name: Checkout trusted main Acceptance planner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select merged-stage Agent SCs at exact source SHA
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${BRANCH_NAME}" in
            staging) stage=staging ;;
            main) stage=post-merge ;;
            *) echo "unsupported merged Agent branch" >&2; exit 1 ;;
          esac
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          issue_numbers="$(node scripts/requirement-acceptance.mjs discover-ref "${TARGET_SHA}")"
          echo "ISSUE_NUMBERS=${issue_numbers}" >> "${GITHUB_ENV}"
          echo "ACCEPTANCE_STAGE=${stage}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/agent-issue-contracts"
          jq -r '.[]' <<< "${issue_numbers}" | while read -r issue; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" > "${RUNNER_TEMP}/agent-issue-contracts/${issue}.json"
          done
          agent_issues="$(ISSUE_NUMBERS="${issue_numbers}" ACCEPTANCE_STAGE="${stage}" \
            node scripts/select-merged-agents.mjs select "${RUNNER_TEMP}/agent-issue-contracts")"
          echo "agent_issues=${agent_issues}" >> "${GITHUB_OUTPUT}"
          if [[ "$(jq 'length' <<< "${agent_issues}")" -gt 0 ]]; then
            echo 'has_agents=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'has_agents=false' >> "${GITHUB_OUTPUT}"
          fi
          echo "Merged Agent SC Issue selection: ${agent_issues} at ${TARGET_SHA} (${stage})"

  merged-agent-acceptance:
    needs: prepare-merged-agent
    if: needs.prepare-merged-agent.outputs.has_agents == 'true'
    strategy:
      fail-fast: false
      matrix:
        issue_number: ${{ fromJSON(needs.prepare-merged-agent.outputs.agent_issues) }}
    # Use main-owned reusable workflow even for a staging push: staging content
    # must not redefine a write-capable trusted Issue projector.
    uses: BestNathan/nession/.github/workflows/agent-sc-acceptance.yml@main
    with:
      issue_number: ${{ matrix.issue_number }}
      stage: ${{ needs.prepare-merged-agent.outputs.stage }}
      provider: cursor
      target_ref: ${{ github.sha }}
      deployment: ''
    secrets: inherit


  # Metrics emits this event ONLY after committing trusted main Provider
  # Smoke telemetry. Independently verify the GitHub run and durable record.
  # This wakes the existing Agent SC evaluator; it never projects a verdict.
  prepare-post-merge-provider-evidence:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'nession-agent-telemetry-ingested'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      target_sha: ${{ steps.select.outputs.target_sha }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
      source_run_attempt: ${{ steps.select.outputs.source_run_attempt }}
      agent_issues: ${{ steps.select.outputs.agent_issues }}
      has_agents: ${{ steps.select.outputs.has_agents }}
    steps:
      - name: Checkout trusted Acceptance planner
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout immutable Agent Metrics evidence
        uses: actions/checkout@v4
        with:
          ref: metrics
          path: metrics-store
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify main Provider run, exact SHA and persisted evidence
        id: select
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.source_run_attempt }}
          SOURCE_SHA: ${{ github.event.client_payload.target_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/provider-source.json"
          jq -n --argjson id "$SOURCE_RUN_ID" --argjson attempt "$SOURCE_RUN_ATTEMPT" \
            --arg sha "$SOURCE_SHA" \
            '{source_run_id:$id,source_run_attempt:$attempt,target_sha:$sha}' \
            > "$RUNNER_TEMP/telemetry-wake.json"
          node scripts/agent-evidence-waker.mjs verify \
            "$RUNNER_TEMP/telemetry-wake.json" "$RUNNER_TEMP/provider-source.json" \
            "$GITHUB_WORKSPACE/metrics-store"
          echo "target_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_run_attempt=$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

          # Reuse the canonical merged-stage association/method selector.
          issue_numbers="$(node scripts/requirement-acceptance.mjs discover-ref "$SOURCE_SHA")"
          mkdir -p "$RUNNER_TEMP/agent-issue-contracts"
          jq -r '.[]' <<< "$issue_numbers" | while read -r issue; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue" \
              > "$RUNNER_TEMP/agent-issue-contracts/$issue.json"
          done
          agent_issues="$(ISSUE_NUMBERS="$issue_numbers" ACCEPTANCE_STAGE=post-merge TARGET_SHA="$SOURCE_SHA" \
            node scripts/select-merged-agents.mjs select "$RUNNER_TEMP/agent-issue-contracts")"
          echo "agent_issues=$agent_issues" >> "$GITHUB_OUTPUT"
          if [[ "$(jq length <<< "$agent_issues")" -gt 0 ]]; then
            echo "has_agents=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_agents=false" >> "$GITHUB_OUTPUT"
          fi

  post-merge-provider-evidence-acceptance:
    needs: prepare-post-merge-provider-evidence
    if: needs.prepare-post-merge-provider-evidence.outputs.has_agents == 'true'
    strategy:
      fail-fast: false
      matrix:
        issue_number: ${{ fromJSON(needs.prepare-post-merge-provider-evidence.outputs.agent_issues) }}
    uses: BestNathan/nession/.github/workflows/agent-sc-acceptance.yml@main
    with:
      issue_number: ${{ matrix.issue_number }}
      stage: post-merge
      provider: cursor
      target_ref: ${{ needs.prepare-post-merge-provider-evidence.outputs.target_sha }}
      provider_source_run_id: ${{ needs.prepare-post-merge-provider-evidence.outputs.source_run_id }}
      provider_source_run_attempt: ${{ needs.prepare-post-merge-provider-evidence.outputs.source_run_attempt }}
      deployment: ''
    secrets: inherit

  # The privileged E2E ingest has already authenticated and projected the
  # completed run. A dispatch, unlike GITHUB_TOKEN PR edits, can wake Actions.
  # Rerun only the failed Acceptance jobs; no polling or fabricated Pass.
  reconcile-issue-e2e:
    concurrency:
      group: acceptance-pr-reconcile
      cancel-in-progress: false
    if: github.event_name == 'repository_dispatch' && github.event.action == 'nession-issue-e2e-projected'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate E2E result and reconcile exact-head Acceptance run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          TARGET_SHA: ${{ github.event.client_payload.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          PLAN_DIGEST: ${{ github.event.client_payload.plan_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          if [[ ! -f scripts/issue-e2e-gate.mjs ]]; then
            echo 'Issue E2E trusted source not on main yet; no reconciliation'
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -e --arg sha "$TARGET_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo' \
            "$RUNNER_TEMP/pr.json" > /dev/null || exit 0
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/e2e-run.json"
          jq -e --arg sha "$TARGET_SHA" --argjson pr "$PR_NUMBER" \
            '.head_sha == $sha and .path == ".github/workflows/e2e-tests.yml" and
             .event == "pull_request" and .status == "completed" and
             (.conclusion == "success" or .conclusion == "failure") and
             ([.pull_requests[].number] | index($pr) != null)' \
            "$RUNNER_TEMP/e2e-run.json" > /dev/null
          node --input-type=module -e '
            import fs from "node:fs";
            import { parsePreMergeIssueNumbers } from "./scripts/requirement-acceptance.mjs";
            const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write(JSON.stringify(parsePreMergeIssueNumbers(
              p.body, "BestNathan", "nession", p.title)));
          ' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/issue-refs.json"
          verified=0
          while IFS= read -r issue_number; do
            [[ "$issue_number" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" > "$RUNNER_TEMP/issue-$issue_number.json"
            if jq -e '.body | contains("## E2E Verification")' "$RUNNER_TEMP/issue-$issue_number.json" > /dev/null; then
              # The canonical Gate distinguishes selected IDs from a valid
              # explicit-none Issue. The latter has no per-ID E2E Report and
              # MUST NOT pretend to contain the source Plan digest.
              verdict="$(node scripts/issue-e2e-gate.mjs verify-json \
                "$RUNNER_TEMP/issue-$issue_number.json" "$TARGET_SHA")"
              case "$(jq -r .reason <<< "$verdict")" in
                selected)
                  [[ "$(jq -r .required <<< "$verdict")" =~ ^[1-9][0-9]*$ ]] || exit 1
                  jq -e --arg digest "$PLAN_DIGEST" \
                    '.body | contains("plan " + $digest + ",")' \
                    "$RUNNER_TEMP/issue-$issue_number.json" > /dev/null
                  verified=$((verified + 1))
                  ;;
                explicit-none)
                  [[ "$(jq -r .required <<< "$verdict")" == 0 ]] || exit 1
                  echo "Issue #$issue_number declares no browser E2E IDs; no Plan receipt required"
                  ;;
                *) echo "::error::Unclassified Issue E2E Gate verdict"; exit 1 ;;
              esac
            fi
          done < <(jq -r '.[]' "$RUNNER_TEMP/issue-refs.json")
          (( verified > 0 )) || { echo 'No verified Issue E2E requirements'; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/acceptance-orchestrator.yml/runs?event=pull_request_target&per_page=100" \
            > "$RUNNER_TEMP/acceptance-runs.json"
          jq -er --arg sha "$TARGET_SHA" --argjson pr "$PR_NUMBER" '
            [.workflow_runs[] | select(.head_sha == $sha and .event == "pull_request_target" and
             ([.pull_requests[].number] | index($pr) != null))] |
            sort_by(.created_at) | last // empty |
            [.id, .status, .conclusion] | @tsv' \
            "$RUNNER_TEMP/acceptance-runs.json" > "$RUNNER_TEMP/acceptance-target.tsv"
          IFS=$'\t' read -r accept_id accept_status accept_conclusion < "$RUNNER_TEMP/acceptance-target.tsv"
          [[ "$accept_id" =~ ^[1-9][0-9]*$ ]] || exit 1
          if [[ "$accept_status" != completed || "$accept_conclusion" == success ]]; then
            echo "Acceptance already running or successful; no rerun"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$accept_id/rerun-failed-jobs"
          echo "Reconciled E2E proof by rerunning failed Acceptance jobs for PR #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"

  # Source Quality/E2E workflow_run completion is the waker for a previously
  # failed (not yet ready) Acceptance run. A single SHA check replaces polling.
  reconcile-completed-quality-e2e:
    concurrency:
      group: acceptance-pr-reconcile
      cancel-in-progress: false
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Converge only when both source workflows and Issue evidence are current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg sha "$TARGET_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .repository.full_name == $repo and
            .head_repository.full_name == $repo and
            .event == "pull_request" and .status == "completed" and
            .conclusion == "success" and
            (.path == ".github/workflows/ci-quality.yml" or
             .path == ".github/workflows/e2e-tests.yml")' \
            "$RUNNER_TEMP/source-run.json" > /dev/null
          pr="$(jq -r '.pull_requests[0].number // empty' "$RUNNER_TEMP/source-run.json")"
          [[ "$pr" =~ ^[1-9][0-9]*$ ]] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pr.json"
          jq -e --arg sha "$TARGET_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .head.sha == $sha and .head.repo.full_name == $repo' \
            "$RUNNER_TEMP/pr.json" > /dev/null || exit 0
          for workflow in ci-quality.yml e2e-tests.yml; do
            list="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$TARGET_SHA" --event pull_request --limit 20 \
              --json status,conclusion)"
            jq -e '.[0].status == "completed" and .[0].conclusion == "success"' \
              <<< "$list" > /dev/null || { echo "Waiting for $workflow completion"; exit 0; }
          done
          node --input-type=module -e '
            import fs from "node:fs";
            import { parsePreMergeIssueNumbers } from "./scripts/requirement-acceptance.mjs";
            const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write(JSON.stringify(parsePreMergeIssueNumbers(
              p.body, "BestNathan", "nession", p.title)));
          ' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/issue-refs.json"
          [[ "$(jq length "$RUNNER_TEMP/issue-refs.json")" -gt 0 ]] || exit 0
          for number in $(jq -r '.[]' "$RUNNER_TEMP/issue-refs.json"); do
            [[ "$number" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/issues/$number" > "$RUNNER_TEMP/issue-$number.json"
            if [[ -f scripts/issue-e2e-gate.mjs ]] &&
               jq -e '.body | contains("## E2E Verification")' "$RUNNER_TEMP/issue-$number.json" > /dev/null; then
              if ! node scripts/issue-e2e-gate.mjs verify "$RUNNER_TEMP/issue-$number.json" "$TARGET_SHA"; then
                echo "Awaiting authenticated E2E Report for Issue #$number"
                exit 0
              fi
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/acceptance-orchestrator.yml/runs?event=pull_request_target&per_page=100" \
            > "$RUNNER_TEMP/acceptance-runs.json"
          id="$(jq -er --arg sha "$TARGET_SHA" --argjson pr "$pr" '
            [.workflow_runs[] | select(.head_sha == $sha and
             ([.pull_requests[].number] | index($pr) != null))] |
            sort_by(.created_at) | last | .id // empty' "$RUNNER_TEMP/acceptance-runs.json")" || exit 0
          [[ "$id" =~ ^[1-9][0-9]*$ ]] || exit 0
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")"
          status="$(jq -r .status <<< "$run_json")"
          conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
          if [[ "$status" == completed && "$conclusion" == failure ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/rerun-failed-jobs"
            echo "Replayed failed Acceptance after both Quality/E2E completion events" >> "$GITHUB_STEP_SUMMARY"
          fi
