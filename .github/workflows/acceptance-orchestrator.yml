name: Acceptance / Orchestrator

on:
  pull_request_target:
    branches: [staging, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  repository_dispatch:
    types: [nession-agent-telemetry-ingested]
  issues:
    types: [closed]
  push:
    branches: [staging, main]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

concurrency:
  # PR events supersede earlier PR observations; post-merge/Issue events stay independent.
  group: requirement-acceptance-${{ github.event.pull_request.number || github.event.client_payload.pr_number || github.event.issue.number || github.run_id }}-${{ github.event_name == 'pull_request_target' && 'pr' || 'waker' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  prepare-pre-merge:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue_numbers: ${{ steps.discover.outputs.issue_numbers }}
      has_requirements: ${{ steps.discover.outputs.has_requirements }}
      head_sha: ${{ steps.context.outputs.head_sha }}
    steps:
      # pull_request_target is credentialed. Always execute trusted main tooling;
      # never checkout or execute PR-head code in this orchestration job.
      - name: Checkout trusted acceptance tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Self-test acceptance tooling
        run: |
          ./gates/run --suite acceptance-tooling

      - name: Pin PR head
        id: context
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Discover implemented requirements
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          issue_numbers="$(node scripts/requirement-acceptance.mjs discover-pre-merge)"
          echo "issue_numbers=${issue_numbers}" >> "${GITHUB_OUTPUT}"
          if [[ "$(jq 'length' <<<"${issue_numbers}")" -gt 0 ]]; then
            echo "has_requirements=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_requirements=false" >> "${GITHUB_OUTPUT}"
          fi

  pre-merge-acceptance:
    needs: prepare-pre-merge
    if: needs.prepare-pre-merge.outputs.has_requirements == 'true'
    strategy:
      fail-fast: false
      matrix:
        issue_number: ${{ fromJSON(needs.prepare-pre-merge.outputs.issue_numbers) }}
    uses: ./.github/workflows/agent-sc-acceptance.yml
    with:
      issue_number: ${{ matrix.issue_number }}
      stage: pre-merge
      provider: ${{ vars.AGENT_DEFAULT_ACCEPTOR || vars.ACCEPTANCE_PROVIDER || '' }}
      target_ref: ${{ needs.prepare-pre-merge.outputs.head_sha }}
      deployment: ''
    secrets: inherit

  background:
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'nession-agent-telemetry-ingested')
    uses: BestNathan/nession/.github/workflows/acceptance-orchestrator-background.yml@main
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    secrets: inherit

