name: Test / SC09 Disposable Replay Dispatch Probe
# Disposable feature-ref only. Sends one workflow_dispatch request to the
# unprivileged, unchanged Metrics / Replay Request on another feature ref.
# The App Store writer key/Store push token is NEVER injected into this job.
on:
  push:
    branches: [test/1690-replay-untrusted-ref]
    paths: [.github/workflows/sc09-disposable-dispatch-probe.yml]
permissions:
  contents: read
  # GitHub API requires actions:write to request workflow_dispatch.
  # This one-shot sender never receives contents:write or any Store App key.
  actions: write
jobs:
  send:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/test/1690-replay-untrusted-ref' && github.actor == 'BestNathan'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch unprivileged Replay Request on exact non-main ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run metrics-replay-request.yml \
            --repo BestNathan/nession \
            --ref test/1690-untrusted-replay-ref
          echo 'Read-only feature-ref request dispatched; no Store credentials used.' >> "$GITHUB_STEP_SUMMARY"
