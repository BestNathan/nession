name: Deploy / Seal GitOps Secret
# #3914: manual-only environment batch. All required Secrets are mandatory and
# sealed together in a single GitOps commit; partial publication is forbidden.
# Non-secret MCP configuration is checked into gitops; this workflow never
# reads a TOML Environment Variable or the legacy whole-config Secret.
# Staging retains its independent backend credential; production references its existing canonical Kubernetes Server Secret.
# TLS remains exclusively owned by Deploy / Configure Site.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Exact GitOps environment (no arbitrary target)
        required: true
        type: choice
        options:
          - staging
          - production
concurrency:
  group: gitops-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required environment Secret registry and producer tests
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node scripts/ci/seal-gitops-secret.mjs verify-all "$TARGET_ENVIRONMENT"
          node --test scripts/ci/seal-gitops-secret.test.mjs
  seal:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gitops
          path: gitops
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned kubeseal with upstream checksum validation
        shell: bash
        run: |
          set -euo pipefail
          version=0.27.1
          tarball="kubeseal-$version-linux-amd64.tar.gz"
          base="https://github.com/bitnami/sealed-secrets/releases/download/v$version"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/sealed-secrets_${version}_checksums.txt"
          expected="$(grep -F "$tarball" "$RUNNER_TEMP/checksums.txt" | grep -Eo '[0-9a-f]{64}' | head -n1)"
          test -n "$expected" || { echo "::error::missing upstream checksum"; exit 1; }
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" kubeseal
          chmod +x "$RUNNER_TEMP/kubeseal"
      - name: Verify current production MCP release before sealing
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail
          overlay=gitops/environments/production/mcp/kustomization.yaml
          test -f "$overlay"
          version="$(sed -nE 's/^  newTag: mcp-([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' "$overlay")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'production MCP requires a released version'; exit 1; }
          for role in server agent ui; do
            grep -Fxq "  newTag: $role-$version" gitops/environments/production/nession/kustomization.yaml
          done
          docker buildx imagetools inspect --raw "ghcr.io/bestnathan/nession:mcp-$version" |
            jq -e '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | index("amd64") != null and index("arm64") != null' >/dev/null
          kubectl kustomize gitops/environments/production/mcp >/dev/null
          echo 'Production MCP release manifest and aligned overlay verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require, validate and seal ALL registered environment credentials
        env:
          SEALED_SECRETS_CERT_PEM: ${{ vars.SEALED_SECRETS_CERT_PEM }}
          NESSION_MCP_INBOUND_TOKEN: ${{ secrets.NESSION_MCP_INBOUND_TOKEN }}
          NESSION_MCP_BACKEND_SERVER_TOKEN: ${{ secrets.NESSION_MCP_BACKEND_SERVER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/nession-seal"' EXIT
          # Validate ALL registered Secret values and the cert before creating any
          # ciphertext, and never emit values or write them into GitOps.
          node source/scripts/ci/seal-gitops-secret.mjs prepare-all "$TARGET_ENVIRONMENT"
          unset NESSION_MCP_INBOUND_TOKEN NESSION_MCP_BACKEND_SERVER_TOKEN
          openssl x509 -in "$RUNNER_TEMP/nession-seal/cert.pem" -noout -checkend 86400
          required="$(node source/scripts/ci/seal-gitops-secret.mjs required "$TARGET_ENVIRONMENT")"
          test -n "$required" || { echo '::error::empty required Secret set'; exit 1; }
          while IFS= read -r secret; do
            test -n "$secret" || { echo '::error::invalid required Secret name'; exit 1; }
            "$RUNNER_TEMP/kubeseal" --cert "$RUNNER_TEMP/nession-seal/cert.pem" \
              --scope strict --format json \
              < "$RUNNER_TEMP/nession-seal/$secret.secret.json" \
              > "$RUNNER_TEMP/nession-seal/$secret.sealed.json"
          done <<< "$required"
          # Validate ALL sealed outputs before touching the GitOps checkout.
          node source/scripts/ci/seal-gitops-secret.mjs stage-all "$TARGET_ENVIRONMENT" "$GITHUB_WORKSPACE/gitops"
      - name: Render production overlay after strict ciphertext enrollment
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize gitops/environments/production/mcp >/dev/null
      - name: Publish complete required Secret batch in ONE GitOps commit
        shell: bash
        run: |
          set -euo pipefail
          node source/scripts/ci/seal-gitops-secret.mjs publish-all "$TARGET_ENVIRONMENT" "$GITHUB_WORKSPACE/gitops"
