name: Deploy / Seal GitOps Secret
# #3914: manual-only, strictly scoped MCP inbound credential publisher.
# Non-secret MCP configuration is checked into gitops; this workflow never
# reads a TOML Environment Variable or the legacy whole-config Secret.
# TLS remains exclusively owned by Deploy / Configure Site.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Exact GitOps environment (no arbitrary target)
        required: true
        type: choice
        options:
          - staging
concurrency:
  group: gitops-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact inbound Secret target and producer tests
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node scripts/ci/seal-gitops-secret.mjs verify "$TARGET_ENVIRONMENT" MCP_INBOUND_TOKEN
          node --test scripts/ci/seal-gitops-secret.test.mjs
  seal:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      TARGET_SECRET: MCP_INBOUND_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gitops
          path: gitops
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned kubeseal with upstream checksum validation
        shell: bash
        run: |
          set -euo pipefail
          version=0.27.1
          tarball="kubeseal-$version-linux-amd64.tar.gz"
          base="https://github.com/bitnami/sealed-secrets/releases/download/v$version"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/sealed-secrets_${version}_checksums.txt"
          expected="$(grep -F "$tarball" "$RUNNER_TEMP/checksums.txt" | grep -Eo '[0-9a-f]{64}' | head -n1)"
          test -n "$expected" || { echo "::error::missing upstream checksum"; exit 1; }
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" kubeseal
          chmod +x "$RUNNER_TEMP/kubeseal"
      - name: Seal only the inbound token using controller public certificate
        env:
          SEALED_SECRETS_CERT_PEM: ${{ vars.SEALED_SECRETS_CERT_PEM }}
          SEAL_RAW_VALUE: ${{ secrets.MCP_INBOUND_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/nession-seal"' EXIT
          node source/scripts/ci/seal-gitops-secret.mjs prepare "$TARGET_ENVIRONMENT" "$TARGET_SECRET"
          openssl x509 -in "$RUNNER_TEMP/nession-seal/cert.pem" -noout -checkend 86400
          "$RUNNER_TEMP/kubeseal" --cert "$RUNNER_TEMP/nession-seal/cert.pem" \
            --scope strict --format json \
            < "$RUNNER_TEMP/nession-seal/secret.json" \
            > "$RUNNER_TEMP/nession-seal/sealed.json"
          node source/scripts/ci/seal-gitops-secret.mjs stage "$TARGET_ENVIRONMENT" "$TARGET_SECRET" "$GITHUB_WORKSPACE/gitops"
      - name: Publish bounded encrypted inbound Secret to GitOps
        shell: bash
        run: |
          set -euo pipefail
          node source/scripts/ci/seal-gitops-secret.mjs publish "$TARGET_ENVIRONMENT" "$TARGET_SECRET" "$GITHUB_WORKSPACE/gitops"
