name: Deploy / Seal GitOps Secret
# One raw GitHub Environment Secret -> one SealedSecret in a matching GitOps env (#3912).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Exact gitops/environments/<environment> directory name
        required: true
        type: choice
        options:
          - staging
      secret:
        description: Registered GitHub Environment Secret (raw content, not JSON)
        required: true
        type: choice
        options:
          - MCP_CONFIG_TOML
concurrency:
  group: gitops-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact registered environment and Secret
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_SECRET: ${{ inputs.secret }}
        run: |
          node scripts/ci/seal-gitops-secret.mjs verify "$TARGET_ENVIRONMENT" "$TARGET_SECRET"
          node --test scripts/ci/seal-gitops-secret.test.mjs
  seal:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      TARGET_SECRET: ${{ inputs.secret }}
      # X.509 RSA public sealing certificate, not the Argo CD SSH key.
      SEALED_SECRETS_CERT_PEM: ${{ vars.SEALED_SECRETS_CERT_PEM }}
      # A single, unwrapped, raw GitHub Environment Secret.
      SEAL_RAW_VALUE: ${{ secrets[inputs.secret] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gitops
          path: gitops
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned kubeseal with upstream checksum validation
        shell: bash
        run: |
          set -euo pipefail
          version=0.27.1
          tarball="kubeseal-$version-linux-amd64.tar.gz"
          base="https://github.com/bitnami/sealed-secrets/releases/download/v$version"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/sealed-secrets_${version}_checksums.txt"
          expected="$(grep -F "$tarball" "$RUNNER_TEMP/checksums.txt" | grep -Eo '[0-9a-f]{64}' | head -n1)"
          test -n "$expected" || { echo "::error::missing upstream checksum"; exit 1; }
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" kubeseal
          chmod +x "$RUNNER_TEMP/kubeseal"
      - name: Encrypt offline with public certificate and strict resource scope
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf "$RUNNER_TEMP/nession-seal"' EXIT
          node source/scripts/ci/seal-gitops-secret.mjs prepare "$TARGET_ENVIRONMENT" "$TARGET_SECRET"
          openssl x509 -in "$RUNNER_TEMP/nession-seal/cert.pem" -noout -checkend 86400
          "$RUNNER_TEMP/kubeseal" --cert "$RUNNER_TEMP/nession-seal/cert.pem" \
            --scope strict --format json \
            < "$RUNNER_TEMP/nession-seal/secret.json" \
            > "$RUNNER_TEMP/nession-seal/sealed.json"
          node source/scripts/ci/seal-gitops-secret.mjs stage "$TARGET_ENVIRONMENT" "$TARGET_SECRET" "$GITHUB_WORKSPACE/gitops"
      - name: Commit only encrypted GitOps resources
        shell: bash
        run: |
          set -euo pipefail
          cd gitops
          git add -A -- "environments/$TARGET_ENVIRONMENT"
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "secrets($TARGET_ENVIRONMENT): seal $TARGET_SECRET (#3912)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin gitops && git push origin HEAD:gitops; then
              echo "Encrypted GitOps resource published"
              exit 0
            fi
            if [[ -d .git/rebase-apply || -d .git/rebase-merge ]]; then
              git rebase --abort || true
              echo "::error::GitOps conflict; refusing to publish"
              exit 1
            fi
            sleep "$((i * 2))"
          done
          echo "::error::GitOps write failed"
          exit 1
