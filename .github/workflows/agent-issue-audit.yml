name: Agent / Issue Audit

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to audit
        required: true
        type: string
      provider:
        description: Issue Audit Agent provider
        required: false
        default: ''
        type: string
      simulate_missing_provider_config:
        description: 'Negative-path smoke test: blank selected provider config before preflight'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NSESSION_AGENT_WORKFLOW_ID: issue-audit

concurrency:
  group: issue-audit-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      issue_number: ${{ steps.target.outputs.issue_number }}
      needs_agent: ${{ steps.tier.outputs.needs_agent }}
      allow_agent: ${{ steps.target.outputs.allow_agent }}
      provider: ${{ steps.target.outputs.provider }}
      environment: ${{ steps.target.outputs.environment }}
      mode: ${{ steps.target.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve issue, trust boundary, and provider
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_ASSOCIATION: ${{ github.event.issue.author_association }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_SENDER_LOGIN: ${{ github.event.sender.login }}
          EVENT_SENDER_TYPE: ${{ github.event.sender.type }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          DEFAULT_AUDITOR: ${{ vars.AGENT_DEFAULT_AUDITOR }}
        run: |
          set -euo pipefail
          # Resolve the default from trusted main and the registered role.
          # No ambient PR/Issue text may select a model or credential Environment.
          routing="$(node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {resolveAgentDefault} from "./scripts/lib/agent/default-routing.mjs";
            const registry=JSON.parse(readFileSync("automation/agents/registry.json","utf8"));
            const override=process.env.EVENT_NAME==="workflow_dispatch"
              ? process.env.INPUT_PROVIDER : "";
            const aliases={cursor:"audit-cursor-01",deepseek:"audit-deepseek-01",
              qwen:"audit-qwen-01"};
            const identity=resolveAgentDefault(registry,"auditor",{
              configured:process.env.DEFAULT_AUDITOR,
              override:aliases[override] || override,
              legacy:"audit-cursor-01"
            });
            const backend=identity.provider==="cursor"?"cursor":
              identity.environment==="dev-claude-qwen"?"qwen":
              identity.environment==="deepseek"?"deepseek":null;
            if(!backend)throw Error("No verified Auditor backend for selected Environment");
            const environment=backend==="cursor" && !process.env.DEFAULT_AUDITOR &&
              (!override || override==="cursor") ? "cursor" : identity.environment;
            console.log(JSON.stringify({provider:backend,environment}));
          ')"
          provider="$(jq -er .provider <<< "$routing")"
          environment="$(jq -er .environment <<< "$routing")"
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            # The trusted main-owned command parser validates exact body,
            # author association, sender identity and non-PR, open Issue.
            # Rejected comments are a no-op with no Agent credentials.
            ISSUE_AUDIT_PROVIDER_SELECTION="$provider" \
              ISSUE_AUDIT_ENVIRONMENT_SELECTION="$environment" \
              node scripts/issue-audit-command.mjs resolve \
                "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY" "$GITHUB_ACTOR"
            exit 0
          fi
          echo "mode=single" >> "$GITHUB_OUTPUT"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            issue_number="${INPUT_ISSUE}"
            allow_agent=true
            : # registered routing was resolved above
          else
            issue_number="${EVENT_ISSUE}"
            # Never trust issue.author_association as the editor identity.
            # A collaborator opening their *own* Issue retains the normal
            # automatic path; editors other than the Owner use /audit comment.
            allow_agent=false
            if [[ "${EVENT_SENDER_LOGIN}" == "${EVENT_ACTOR}" &&
                  "${EVENT_SENDER_TYPE}" == User ]]; then
              if [[ "${EVENT_ACTOR}" == "${REPO_OWNER}" ]]; then
                allow_agent=true
              elif [[ "${EVENT_ACTION}" == opened &&
                      "${EVENT_ISSUE_AUTHOR}" == "${EVENT_ACTOR}" ]]; then
                case "${EVENT_ASSOCIATION}" in
                  OWNER|MEMBER|COLLABORATOR) allow_agent=true ;;
                esac
              fi
            fi
          fi

          if ! [[ "${issue_number}" =~ ^[0-9]+$ ]] || [[ "${issue_number}" -le 0 ]]; then
            echo "Invalid issue number: ${issue_number}" >&2
            exit 1
          fi
          case "${provider}" in
            cursor|deepseek|qwen) ;;
            *) echo "Unsupported Issue Audit provider: ${provider}" >&2; exit 1 ;;
          esac

          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"
          echo "allow_agent=${allow_agent}" >> "${GITHUB_OUTPUT}"
          echo "provider=${provider}" >> "${GITHUB_OUTPUT}"
          echo "environment=${environment}" >> "${GITHUB_OUTPUT}"

      - name: Self-test Issue Contract
        if: github.event_name != 'issue_comment' || steps.target.outputs.authorized == 'true'
        run: ./gates/run issue-contract-selftest

      - name: Audit deterministic Issue Contract
        if: github.event_name != 'issue_comment' || steps.target.outputs.authorized == 'true'
        id: contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          ALLOW_AGENT: ${{ steps.target.outputs.allow_agent }}
          PROVIDER: ${{ steps.target.outputs.provider }}
        run: |
          set +e
          node scripts/issue-contract.mjs github "${ISSUE_NUMBER}" "${RUNNER_TEMP}/issue-contract.json"
          code=$?
          set -e

          case "${code}" in
            0)
              echo "needs_agent=false" >> "${GITHUB_OUTPUT}"
              {
                echo "## Issue Audit"
                echo
                echo "- Issue: #${ISSUE_NUMBER}"
                echo "- Provider: ${PROVIDER}"
                echo "- Deterministic contract: **pass**"
                echo "- Agent invoked: no"
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
            2)
              echo "needs_agent=true" >> "${GITHUB_OUTPUT}"
              {
                echo "## Issue Audit"
                echo
                echo "- Issue: #${ISSUE_NUMBER}"
                echo "- Provider: ${PROVIDER}"
                echo "- Deterministic contract: **needs repair**"
                echo "- Automatic Agent authorized: ${ALLOW_AGENT}"
                if [[ "${ALLOW_AGENT}" != "true" ]]; then
                  echo "- Reason: external authors require an explicit workflow_dispatch before model credentials are used."
                fi
                echo
                echo "### Contract findings"
                jq -r '.errors[] | "- " + .' "${RUNNER_TEMP}/issue-contract.json"
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "Issue Contract tooling failed with exit code ${code}" >&2
              exit "${code}"
              ;;
          esac

      # Structurally valid Issues still require tier assessment on trusted edits.
      - name: Select requirement-risk reassessment
        if: github.event_name != 'issue_comment' || steps.target.outputs.authorized == 'true'
        id: tier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          CONTRACT_NEEDS_AGENT: ${{ steps.contract.outputs.needs_agent }}
          ALLOW_AGENT: ${{ steps.target.outputs.allow_agent }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tier_count="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq '[.labels[].name | select(. == "verification:scoped" or . == "verification:integration" or . == "verification:full")] | length')"
          [[ "$tier_count" =~ ^[0-9]+$ ]] || exit 1
          if (( tier_count > 1 )); then
            echo "::error::Conflicting verification tier labels; trusted owner must resolve"
            exit 1
          fi
          needs="${CONTRACT_NEEDS_AGENT}"
          if [[ "$ALLOW_AGENT" == true ]]; then
            if (( tier_count == 0 )) || [[ "$EVENT_NAME" == workflow_dispatch || "$EVENT_NAME" == issue_comment ]] ||
               [[ "$EVENT_ACTION" == edited ]] ||
               { [[ "$EVENT_ACTION" == labeled || "$EVENT_ACTION" == unlabeled ]] &&
                 [[ "$EVENT_LABEL" == verification:* ]]; }; then
              needs=true
            fi
          fi
          echo "needs_agent=$needs" >> "$GITHUB_OUTPUT"
          echo "Risk tier labels=$tier_count, needs_agent=$needs" >> "$GITHUB_STEP_SUMMARY"

  agent:
    needs: contract
    if: >-
      (needs.contract.outputs.needs_agent == 'true' && needs.contract.outputs.allow_agent == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.simulate_missing_provider_config == true)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.contract.outputs.mode == 'tree' && 60 || 20 }}
    environment: ${{ needs.contract.outputs.environment }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ needs.contract.outputs.issue_number }}
      ISSUE_AUDIT_PROVIDER: ${{ needs.contract.outputs.provider }}
      ISSUE_AUDIT_ALLOW_AGENT: 'true'
      ISSUE_AUDIT_TRIGGER: ${{ github.event_name }}
      ISSUE_AUDIT_MODE: ${{ needs.contract.outputs.mode || 'single' }}
      ISSUE_AUDIT_REEVALUATE_TIER: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment' || github.event.action == 'edited' || github.event.action == 'labeled' || github.event.action == 'unlabeled' }}

      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
      CURSOR_MODEL_FAST: ${{ vars.CURSOR_MODEL_FAST || 'true' }}
      CURSOR_SDK_VERSION: ${{ vars.CURSOR_SDK_VERSION || 'latest' }}

      ISSUE_AUDIT_MAX_TURNS: ${{ needs.contract.outputs.mode == 'tree' && '120' || (vars.ISSUE_AUDIT_MAX_TURNS || '20') }}
      ISSUE_AUDIT_CLAUDE_MODEL: ${{ (needs.contract.outputs.provider == 'qwen' && vars.ANTHROPIC_MODEL) || vars.ISSUE_AUDIT_CLAUDE_MODEL || vars.ANTHROPIC_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
      LLM_INPUT_USD_PER_MTOK: ${{ vars.LLM_INPUT_USD_PER_MTOK }}
      LLM_OUTPUT_USD_PER_MTOK: ${{ vars.LLM_OUTPUT_USD_PER_MTOK }}
      LLM_CACHE_READ_USD_PER_MTOK: ${{ vars.LLM_CACHE_READ_USD_PER_MTOK }}
      LLM_CACHE_WRITE_USD_PER_MTOK: ${{ vars.LLM_CACHE_WRITE_USD_PER_MTOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Self-test audit tooling
        run: |
          ./gates/run issue-contract-selftest issue-audit-agent-selftest issue-audit-cursor-selftest

      - name: Verify selected provider configuration
        env:
          SIMULATE_MISSING_PROVIDER_CONFIG: ${{ inputs.simulate_missing_provider_config || false }}
        run: |
          set -euo pipefail

          if [[ "${SIMULATE_MISSING_PROVIDER_CONFIG}" == "true" ]]; then
            if [[ "${ISSUE_AUDIT_PROVIDER}" == "cursor" ]]; then
              CURSOR_API_KEY=""
            else
              ANTHROPIC_BASE_URL=""
              ANTHROPIC_AUTH_TOKEN=""
              ANTHROPIC_API_KEY=""
            fi
            {
              echo "## Issue Audit provider negative-path smoke"
              echo
              echo "- Provider: ${ISSUE_AUDIT_PROVIDER}"
              echo "- Simulated missing provider configuration: **yes**"
              echo "- Expected outcome: provider preflight fails before provider runtime installation or model invocation"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [[ "${ISSUE_AUDIT_PROVIDER}" == "qwen" && ! "${ISSUE_AUDIT_CLAUDE_MODEL}" =~ ^[Qq][Ww][Ee][Nn][a-zA-Z0-9._-]*$ ]]; then
            echo 'Qwen Issue Audit requires a Qwen model in the selected Environment (ANTHROPIC_MODEL)' >&2
            exit 1
          fi

          case "${ISSUE_AUDIT_PROVIDER}" in
            cursor)
              if [[ -z "${CURSOR_API_KEY}" ]]; then
                echo 'Cursor Environment is missing required configuration: CURSOR_API_KEY' >&2
                echo 'Fix the GitHub Environment named cursor. No provider fallback is configured or attempted.' >&2
                exit 1
              fi
              ;;
            deepseek|qwen)
              missing=()
              [[ -n "${ANTHROPIC_BASE_URL}" ]] || missing+=("ANTHROPIC_BASE_URL")
              if [[ -z "${ANTHROPIC_AUTH_TOKEN}" && -z "${ANTHROPIC_API_KEY}" ]]; then
                missing+=("ANTHROPIC_AUTH_TOKEN or ANTHROPIC_API_KEY")
              fi
              if (( ${#missing[@]} > 0 )); then
                printf 'Claude Gateway Environment is missing required configuration:\n' >&2
                printf ' - %s\n' "${missing[@]}" >&2
                echo 'Fix the selected GitHub Environment. No provider fallback is configured or attempted.' >&2
                exit 1
              fi
              ;;
          esac

      - name: Install selected provider runtime
        run: |
          set -euo pipefail
          case "${ISSUE_AUDIT_PROVIDER}" in
            cursor)
              sdk_root="${RUNNER_TEMP}/cursor-sdk"
              mkdir -p "${sdk_root}"
              npm install --prefix "${sdk_root}" "@cursor/sdk@${CURSOR_SDK_VERSION}"
              echo "CURSOR_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
              ;;
            deepseek|qwen)
              npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION:-latest}"
              claude --version
              ;;
          esac
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}

      - name: Audit and repair issue
        run: |
          set -euo pipefail
          case "${ISSUE_AUDIT_PROVIDER}" in
            cursor)
              node scripts/issue-audit-cursor.mjs "${ISSUE_NUMBER}" "${RUNNER_TEMP}/issue-audit"
              ;;
            deepseek|qwen)
              node scripts/issue-audit-agent.mjs "${ISSUE_NUMBER}" "${RUNNER_TEMP}/issue-audit"
              ;;
          esac

      - name: Upload canonical Agent telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-telemetry-issue-audit-${{ needs.contract.outputs.provider }}-${{ needs.contract.outputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-audit/agent-telemetry.json
          if-no-files-found: warn
          retention-days: 30
