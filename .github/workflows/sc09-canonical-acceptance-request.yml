name: Test / SC09 Canonical Acceptance Dispatch Sender
# Disposable one-shot request; no Store writer/App token and no Issue patch.
# The main-owned Acceptance Agent and projector remain solely authoritative.
on:
  push:
    branches: [test/1690-acceptance-dispatch-sender]
    paths: [.github/workflows/sc09-canonical-acceptance-request.yml]
permissions:
  contents: read
  actions: write
jobs:
  request:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/test/1690-acceptance-dispatch-sender' && github.actor == 'BestNathan'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request trusted-main read-only Agent Acceptance for Issue 1690
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run agent-sc-acceptance.yml \
            --repo BestNathan/nession \
            --ref main \
            -f issue_number=1690 \
            -f stage=post-merge \
            -f provider=cursor \
            -f target_ref=a5baa4eebde5790e38ea6d1054a50cc12e90c4c0
          echo 'Requested canonical post-merge Acceptance at a5baa4eebde5790e38ea6d1054a50cc12e90c4c0, without deterministic_result_json.' >> "$GITHUB_STEP_SUMMARY"
