name: Deploy / MCP Secret Preflight
# #3914: temporary manually dispatched protected read-only VPN observer.
# Never grant Task / Ephemeral Runner deployment credentials.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-mcp-secret-preflight
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: nession-staging-identity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fixed observer and GitOps probe
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/mcp-secret-preflight-readback.mjs self-test
          git fetch --quiet --no-tags origin gitops
          git cat-file -e origin/gitops:environments/staging/mcp/secret-preflight-job.yaml ||
            { echo '::error::temporary GitOps Job absent'; exit 1; }
          echo "GITOPS_SHA=$(git rev-parse origin/gitops)" >> "$GITHUB_ENV"
      - name: Install approved GOST client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gost.tgz" \
            https://github.com/go-gost/gost/releases/download/v3.0.0/gost_3.0.0_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/gost.tgz" -C "$RUNNER_TEMP" gost
          chmod 755 "$RUNNER_TEMP/gost"
      - name: Open job-owned API-only VPN
        env:
          GOST_RELAY_URL: ${{ secrets.GOST_RELAY_URL }}
        shell: bash
        run: bash scripts/ci/deploy-identity-tunnel.sh start
      - name: Inspect only the staging MCP probe Pod
        env:
          KUBE_CONFIG_CI: ${{ secrets.KUBE_CONFIG_CI }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/nession-ci-kubeconfig"
          test -n "$KUBE_CONFIG_CI" ||
            { echo '::error::read-only Kubernetes identity unavailable'; exit 1; }
          if [[ "$KUBE_CONFIG_CI" == *'apiVersion:'* ]]; then
            printf '%s\n' "$KUBE_CONFIG_CI" > "$KUBECONFIG"
          else
            printf '%s' "$KUBE_CONFIG_CI" | base64 -d > "$KUBECONFIG"
          fi
          chmod 600 "$KUBECONFIG"
          for action in 'get pods' 'list pods'; do
            kubectl --request-timeout=20s auth can-i $action -n nession --quiet ||
              { echo "::error::Pod observation RBAC missing ($action)"; exit 1; }
          done
          for action in 'get secrets' 'list secrets' 'create pods' 'create jobs' 'delete pods' 'create pods/exec'; do
            if kubectl --request-timeout=20s auth can-i $action -n nession --quiet; then
              echo "::error::unexpected observer permission ($action)"
              exit 1
            fi
          done
          for attempt in $(seq 1 15); do
            kubectl --request-timeout=20s -n nession get pods \
              -l batch.kubernetes.io/job-name=nession-mcp-secret-preflight-3914 \
              -o json > "$RUNNER_TEMP/mcp-secret-preflight-pods.json"
            result="$(node scripts/ci/mcp-secret-preflight-readback.mjs evaluate \
              "$RUNNER_TEMP/mcp-secret-preflight-pods.json")"
            IFS=: read -r status reason <<< "$result"
            echo "MCP_SECRET_PREFLIGHT_V1 status=$status reason=$reason attempt=$attempt/15 gitops=$GITOPS_SHA"
            case "$status" in
              pass)
                echo 'MCP Secret Pod consumed both credentials and matched canonical Server token (no values read by CI).' >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              fail) echo "::error::MCP Secret Pod failed ($reason)"; exit 1 ;;
              pending) sleep 8 ;;
              *) echo '::error::invalid verifier result'; exit 1 ;;
            esac
          done
          echo '::error::MCP Secret Pod observation timed out'
          exit 1
      - name: Cleanup only job-owned VPN and Pod observation
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/mcp-secret-preflight-pods.json"
          bash scripts/ci/deploy-identity-tunnel.sh cleanup
