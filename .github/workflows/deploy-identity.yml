name: Deploy / Identity

# Read-only deployment identity attestation (#1616, consumed by #2323).
# This workflow never deploys, restarts or mutates a cluster. It attests that
# the source SHA currently deployed on an isolated staging lane matches the
# trusted build provenance and the observed ready workloads.
on:
  # The source is a completed, GitHub-owned Staging release, not a PR artifact.
  # The protected Main job independently checks original Run/Job/Step identity
  # before any access to the read-only Kubernetes observation credentials.
  workflow_run:
    workflows: ["Release / Staging Artifacts"]
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: 'registered staging lane under gitops/environments (staging or staging-01)'
        required: true
        default: staging

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-identity-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  attest:
    # The existing relay/cluster secrets must never run on a dispatch from
    # another branch, fork, or repository. Environment protection rules are
    # configured in GitHub and must restrict this environment to trusted main.
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Release / Staging Artifacts' &&
          (
            github.event.workflow_run.path == '.github/workflows/release-staging.yml' ||
            github.event.workflow_run.path == '.github/workflows/release-staging.yml@refs/heads/staging'
          ) &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          ) &&
          github.event.workflow_run.head_branch == 'staging' &&
          github.event.workflow_run.repository.full_name == github.repository &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.status == 'completed' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    runs-on: ubuntu-24.04
    environment:
      name: nession-staging-identity
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for original release source verification
        if: github.event_name == 'workflow_run'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate original successful Staging release Run/Jobs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment-identity-trigger.mjs verify "$GITHUB_EVENT_PATH"

      - name: Validate environment and read trusted GitOps state
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          SOURCE_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            staging|staging-01) ;;
            *) echo "::error::unsupported environment: $ENVIRONMENT"; exit 1 ;;
          esac
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags origin gitops
          OVERLAY_PATH="environments/$ENVIRONMENT/nession/kustomization.yaml"
          git cat-file -e "origin/gitops:$OVERLAY_PATH" 2>/dev/null \
            || { echo "::error::no such environment on gitops: $ENVIRONMENT"; exit 1; }
          git show "origin/gitops:$OVERLAY_PATH" > "$RUNNER_TEMP/overlay.yaml"
          git rev-parse origin/gitops > "$RUNNER_TEMP/gitops-revision"
          NAMESPACE=$(awk '/^namespace:/{print $2; exit}' "$RUNNER_TEMP/overlay.yaml")
          [[ -n "$NAMESPACE" ]] || { echo "::error::overlay has no namespace"; exit 1; }
          SHORT=$(awk '/newTag: server-/{sub(/.*server-/,""); print; exit}' "$RUNNER_TEMP/overlay.yaml")
          [[ "$SHORT" =~ ^[0-9a-f]{7,40}$ ]] \
            || { echo "::error::overlay server tag is not a commit prefix: $SHORT"; exit 1; }
          for role in agent server ui; do
            grep -Eq "newTag: ${role}-${SHORT}[[:space:]]*$" "$RUNNER_TEMP/overlay.yaml" \
              || { echo "::error::overlay role tags do not share $SHORT"; exit 1; }
          done
          FULL=$(git rev-parse --verify --quiet "${SHORT}^{commit}") \
            || { echo "::error::deployed short SHA is not uniquely resolvable: $SHORT"; exit 1; }
          [[ "$FULL" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::resolved SHA is invalid"; exit 1; }
          # A completed Release event cannot attest a newer, unrelated
          # GitOps target if the requested source was superseded meanwhile.
          # Manual observers continue to attest the actual current target.
          if [[ -n "${SOURCE_RELEASE_SHA:-}" && "$FULL" != "$SOURCE_RELEASE_SHA" ]]; then
            echo "::error::Staging release $SOURCE_RELEASE_SHA was superseded by desired $FULL before observation"
            exit 1
          fi
          {
            echo "NAMESPACE=$NAMESPACE"
            echo "OVERLAY_PATH=$OVERLAY_PATH"
            echo "DEPLOYED_SHORT=$SHORT"
            echo "DEPLOYED_SHA=$FULL"
          } >> "$GITHUB_ENV"
          echo "GitOps $(cat "$RUNNER_TEMP/gitops-revision") desires $ENVIRONMENT at $SHORT ($FULL)"

      - name: Validate CI secret availability (values never printed)
        env:
          GOST_RELAY_URL: ${{ secrets.GOST_RELAY_URL }}
          KUBE_CONFIG_CI: ${{ secrets.KUBE_CONFIG_CI }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GOST_RELAY_URL:-}" ]] || { echo "::error::GOST_RELAY_URL unavailable for the protected identity environment"; exit 1; }
          [[ -n "${KUBE_CONFIG_CI:-}" ]] || { echo "::error::KUBE_CONFIG_CI unavailable for the protected identity environment"; exit 1; }
          echo "Required CI secrets are available. Their values are not logged."

      - name: Install gost and check kubectl client
        shell: bash
        run: |
          set -euo pipefail
          # Pinned to the server-side gost major.minor (relay+wss protocol).
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gost.tgz" https://github.com/go-gost/gost/releases/download/v3.0.0/gost_3.0.0_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/gost.tgz" -C "$RUNNER_TEMP" gost
          chmod +x "$RUNNER_TEMP/gost"
          command -v kubectl >/dev/null || { echo "::error::kubectl not installed on runner"; exit 1; }

      - name: Establish owned gost tunnel via existing HK relay
        env:
          GOST_RELAY_URL: ${{ secrets.GOST_RELAY_URL }}
        shell: bash
        run: bash scripts/ci/deploy-identity-tunnel.sh start

      - name: Verify read-only Kubernetes identity
        env:
          KUBE_CONFIG_CI: ${{ secrets.KUBE_CONFIG_CI }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/nession-ci-kubeconfig"
          if [[ "$KUBE_CONFIG_CI" == *'apiVersion:'* ]]; then
            printf '%s\n' "$KUBE_CONFIG_CI" > "$KUBECONFIG"
          else
            printf '%s' "$KUBE_CONFIG_CI" | base64 -d > "$KUBECONFIG"
          fi
          chmod 600 "$KUBECONFIG"
          for resource in deployments pods; do
            kubectl --request-timeout=20s auth can-i get "$resource" -n "$NAMESPACE" --quiet \
              || { echo "::error::kubeconfig cannot read $resource in $NAMESPACE"; exit 1; }
          done
          # Positive namespace reads do not authorize cluster-wide discovery,
          # secret access, exec, writes or lateral movement.
          for action in "get secrets" "list secrets" "create deployments" "delete pods" "create pods/exec" "get nodes" "list namespaces"; do
            if kubectl --request-timeout=20s auth can-i $action -n "$NAMESPACE" --quiet; then
              echo "::error::CI kubeconfig is overprivileged ($action). Provision a read-only service account."; exit 1
            fi
          done
          kubectl config current-context > "$RUNNER_TEMP/cluster-context"
          echo "CLUSTER_CONTEXT=$(cat "$RUNNER_TEMP/cluster-context")" >> "$GITHUB_ENV"

      - name: Observe deployed workloads
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/nession-ci-kubeconfig"
          kubectl --request-timeout=20s -n "$NAMESPACE" get deployments -o json > "$RUNNER_TEMP/deployments.json"
          kubectl --request-timeout=20s -n "$NAMESPACE" get pods -o json > "$RUNNER_TEMP/pods.json"

      - name: Download trusted build provenance for the deployed source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          response=$(gh api "repos/$REPO/actions/workflows/release-staging.yml/runs?head_sha=${DEPLOYED_SHA}&per_page=100")
          RUN_ID=$(jq -r --arg sha "$DEPLOYED_SHA" '
            [.workflow_runs[]
              | select((.path | split("@")[0]) == ".github/workflows/release-staging.yml")
              # A workflow-only staging change is ignored by paths-ignore, so
              # the trusted workflow dispatch escape hatch may be the build
              # that produced the deployed images. Both events bind the same
              # exact SHA/branch/workflow identity.
              | select(.event == "push" or .event == "workflow_dispatch")
              | select(.head_branch == "staging")
              | select(.head_sha == $sha)
              | select(.status == "completed")
              | select(.conclusion == "success")
              | .id] | sort | join(" ")' <<<"$response")
          count=$(wc -w <<<"$RUN_ID" | tr -d ' ')
          [[ "$count" == "1" ]] \
            || { echo "::error::expected exactly one successful Release / Staging run for $DEPLOYED_SHA, found $count"; exit 1; }
          mkdir -p "$RUNNER_TEMP/provenance"
          gh run download "$RUN_ID" -R "$REPO" -n nession-build-provenance -D "$RUNNER_TEMP/provenance"
          echo "Downloaded provenance from trusted run $RUN_ID (attempt identity is in the run URL)."

      - name: Wait boundedly for reconciled Staging workload identity
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/nession-ci-kubeconfig"
          # The trusted collector alone classifies retryable rolling readiness
          # (exit 75). Identity/provenance/namespace/digest mismatches fail
          # immediately and emit one allowlisted rejection receipt (#3318);
          # neither retries nor timeout produce a Run Record.
          attempts=18
          attested=false
          rm -f "$RUNNER_TEMP/deployment-attestation.json"
          for attempt in $(seq 1 "$attempts"); do
            if (( attempt > 1 )); then
              kubectl --request-timeout=20s -n "$NAMESPACE" get deployments -o json \
                > "$RUNNER_TEMP/deployments.json"
              kubectl --request-timeout=20s -n "$NAMESPACE" get pods -o json \
                > "$RUNNER_TEMP/pods.json"
            fi
            status=0
            node scripts/deployment-identity-collect.mjs attest \
              --overlay-path "$OVERLAY_PATH" \
              --overlay "$RUNNER_TEMP/overlay.yaml" \
              --gitops-revision "$(cat "$RUNNER_TEMP/gitops-revision")" \
              --provenance "$RUNNER_TEMP/provenance/nession-build-provenance.json" \
              --environment "${{ github.event.inputs.environment }}" \
              --cluster-context "$CLUSTER_CONTEXT" \
              --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --deployments "$RUNNER_TEMP/deployments.json" \
              --pods "$RUNNER_TEMP/pods.json" \
              --out "$RUNNER_TEMP/deployment-attestation.json" \
              > "$RUNNER_TEMP/deployment-attempt.stdout" \
              2> "$RUNNER_TEMP/deployment-attempt.stderr" || status=$?
            if (( status == 0 )); then
              # Emit exactly one source-bound log receipt for trusted ingest.
              grep '^DEPLOYMENT_ATTESTATION_V1 ' \
                "$RUNNER_TEMP/deployment-attempt.stdout"
              echo "Ready Staging identity attested after ${attempt} attempt(s)." >> "$GITHUB_STEP_SUMMARY"
              attested=true
              break
            fi
            if (( status != 75 )); then
              # #3318: surface only the collector's allowlisted rejection
              # receipt, never arbitrary redirected stderr. A missing or
              # malformed receipt degrades to a bounded generic class.
              rejection="$(grep -m1 '^DEPLOYMENT_IDENTITY_REJECTION_V1 ' \
                "$RUNNER_TEMP/deployment-attempt.stderr" || true)"
              rejection_class='unknown'
              rejection_reason='unclassified deployment identity rejection'
              if [[ -n "$rejection" ]]; then
                payload="${rejection#DEPLOYMENT_IDENTITY_REJECTION_V1 }"
                rejection_class="$(jq -r 'if (.class | type) == "string" then .class else "unknown" end' \
                  <<<"$payload" 2>/dev/null || true)"
                rejection_reason="$(jq -r 'if (.message | type) == "string" then .message else empty end' \
                  <<<"$payload" 2>/dev/null || true)"
                rejection_reason="${rejection_reason//$'\n'/ }"
              fi
              echo "::error::Staging identity rejected (class=${rejection_class:-unknown}, retryable=false, deployed=${DEPLOYED_SHA:-unknown}): ${rejection_reason:-unclassified deployment identity rejection}"
              exit 1
            fi
            if (( attempt == attempts )); then
              echo "::error::Staging rollout did not reconcile within bounded read-only observation window"
              exit 1
            fi
            echo "Staging not ready (${attempt}/${attempts}); retrying fresh read-only metadata."
            sleep 10
          done
          [[ "$attested" == true && -s "$RUNNER_TEMP/deployment-attestation.json" ]] \
            || { echo "::error::missing canonical Staging attestation"; exit 1; }

      # Runs only on trusted main with the existing read-only tunnel and
      # kubeconfig. Never execute source-SHA Cases/Playwright or arbitrary
      # scripts with the connection credentials.
      - name: Collect bounded remote-staging observations through existing tunnel
        shell: bash
        env:
          KUBECONFIG: ${{ runner.temp }}/nession-ci-kubeconfig
        run: |
          set -euo pipefail
          node scripts/remote-staging-observe.mjs run \
            --profile remote-staging \
            --attestation "$RUNNER_TEMP/deployment-attestation.json" \
            --overlay-path "$OVERLAY_PATH" \
            --overlay "$RUNNER_TEMP/overlay.yaml" \
            --gitops-revision "$(cat "$RUNNER_TEMP/gitops-revision")" \
            --provenance "$RUNNER_TEMP/provenance/nession-build-provenance.json" \
            --out "$RUNNER_TEMP/deployment-attestation.json"
          # A remote observation is a zero-verdict identity/readiness fact, not
          # an Acceptance Case Pass. Trust/source provenance is bound on ingest.
          echo "Two real read-only Staging snapshots observed; Acceptance evaluation remains null." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pinned GitOps revision remained unchanged during read-only observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin gitops
          [[ "$(git rev-parse FETCH_HEAD)" == "$(cat "$RUNNER_TEMP/gitops-revision")" ]] \
            || { echo "::error::GitOps revision changed while observing Staging; refusing stale attestation"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nession-deployment-attestation-${{ github.event.inputs.environment }}
          path: ${{ runner.temp }}/deployment-attestation.json
          retention-days: 90

      - name: Remove only job-owned tunnel, alias and temporary evidence
        if: always()
        shell: bash
        run: bash scripts/ci/deploy-identity-tunnel.sh cleanup
