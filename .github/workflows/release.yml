name: Release

on:
  push:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Version check — gate for entire workflow
  # ═══════════════════════════════════════════════════════════════════
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      rust_version: ${{ steps.check.outputs.rust_version }}
      web_version: ${{ steps.check.outputs.web_version }}
      short_sha: ${{ steps.check.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          RUST_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          WEB_VER=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          echo "rust_version=${RUST_VER}" >> $GITHUB_OUTPUT
          echo "web_version=${WEB_VER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # If the release tag doesn't exist yet, the previous release attempt
          # either never ran or failed. Re-trigger regardless of version change
          # so the same version can be retried without bumping. (#71)
          TAG="v${RUST_VER}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG not found — release needed (retry or first run)."
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              echo "No comparable previous commit — treating as version change."
              echo "version_changed=true" >> $GITHUB_OUTPUT
            else
              PREV_RUST=$(git show ${BEFORE}:Cargo.toml 2>/dev/null | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')
              PREV_WEB=$(git show ${BEFORE}:web/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
              if [ "$RUST_VER" != "$PREV_RUST" ] || [ "$WEB_VER" != "$PREV_WEB" ]; then
                echo "Version changed (rust: ${PREV_RUST} -> ${RUST_VER}, web: ${PREV_WEB} -> ${WEB_VER})."
                echo "version_changed=true" >> $GITHUB_OUTPUT
              else
                echo "Version unchanged and tag $TAG exists. Skipping release."
                echo "version_changed=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Check — lint + test
  # ═══════════════════════════════════════════════════════════════════
  rust-check:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: just check

  web-check:
    needs: version-check
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - run: cd web && npm ci
      - run: just web-lint
      - run: just web-test

  # ═══════════════════════════════════════════════════════════════════
  # Build web UI
  # ═══════════════════════════════════════════════════════════════════
  build-web:
    needs: [version-check, rust-check, web-check]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # Native binaries — Linux amd64 (also used for Docker)
  # ═══════════════════════════════════════════════════════════════════
  build-linux-amd64:
    needs: [version-check, rust-check, web-check]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }

      - uses: actions/cache@v4
        id: cache-zig-amd64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-x86_64

      - name: Install zig
        if: steps.cache-zig-amd64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-x86_64-0.14.0 /usr/local/zig-0.14.0

      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig

      - uses: actions/cache@v4
        id: cache-zigbuild-amd64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-x86_64

      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-amd64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent --bin nession

      - name: Package native binaries
        run: |
          V="${{ needs.version-check.outputs.rust_version }}"
          mkdir -p dist
          BIN_DIR="target/x86_64-unknown-linux-gnu/release"
          for bin in nession-server nession-agent nession; do
            cp "${BIN_DIR}/${bin}" "dist/${bin}"
          done
          tar -czf "nession-${V}-linux-amd64.tar.gz" -C dist .

      - name: Generate checksums
        run: sha256sum nession-*.tar.gz > checksums-linux-amd64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: nession-*.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-linux-amd64
          path: checksums-linux-amd64.txt
          retention-days: 7

      # Upload individual binaries for Docker builds
      - uses: actions/upload-artifact@v4
        with:
          name: server-bin-amd64
          path: target/x86_64-unknown-linux-gnu/release/nession-server
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: agent-bin-amd64
          path: target/x86_64-unknown-linux-gnu/release/nession-agent
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # Native binaries — Linux arm64 (also used for Docker)
  # ═══════════════════════════════════════════════════════════════════
  build-linux-arm64:
    needs: [version-check, rust-check, web-check]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }

      - uses: actions/cache@v4
        id: cache-zig-arm64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-aarch64

      - name: Install zig
        if: steps.cache-zig-arm64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-aarch64-0.14.0 /usr/local/zig-0.14.0

      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig

      - uses: actions/cache@v4
        id: cache-zigbuild-arm64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-aarch64

      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-arm64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent --bin nession

      - name: Package native binaries
        run: |
          V="${{ needs.version-check.outputs.rust_version }}"
          mkdir -p dist
          for bin in nession-server nession-agent nession; do
            cp "target/aarch64-unknown-linux-gnu/release/${bin}" "dist/${bin}"
          done
          tar -czf "nession-${V}-linux-arm64.tar.gz" -C dist .

      - name: Generate checksums
        run: sha256sum nession-*.tar.gz > checksums-linux-arm64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-arm64
          path: nession-*.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-linux-arm64
          path: checksums-linux-arm64.txt
          retention-days: 7

      # Upload individual binaries for Docker builds
      - uses: actions/upload-artifact@v4
        with:
          name: server-bin-arm64
          path: target/aarch64-unknown-linux-gnu/release/nession-server
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: agent-bin-arm64
          path: target/aarch64-unknown-linux-gnu/release/nession-agent
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # Docker — 6 parallel jobs (server/agent/ui × amd64/arm64)
  # ═══════════════════════════════════════════════════════════════════

  # ── amd64 ──────────────────────────────────────────────────────────
  docker-server-amd64:
    needs: [version-check, build-web, build-linux-amd64]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: server-bin-amd64, path: /tmp/server-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.version-check.outputs.rust_version }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.RUST_VER }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

  docker-agent-amd64:
    needs: [version-check, build-web, build-linux-amd64]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: agent-bin-amd64, path: /tmp/agent-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.version-check.outputs.rust_version }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.RUST_VER }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

  docker-ui-amd64:
    needs: [version-check, build-web]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "WEB_VER=${{ needs.version-check.outputs.web_version }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.WEB_VER }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ── arm64 ──────────────────────────────────────────────────────────
  docker-server-arm64:
    needs: [version-check, build-web, build-linux-arm64]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: server-bin-arm64, path: /tmp/server-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.version-check.outputs.rust_version }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.RUST_VER }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

  docker-agent-arm64:
    needs: [version-check, build-web, build-linux-arm64]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: agent-bin-arm64, path: /tmp/agent-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.version-check.outputs.rust_version }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.RUST_VER }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

  docker-ui-arm64:
    needs: [version-check, build-web]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "WEB_VER=${{ needs.version-check.outputs.web_version }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.WEB_VER }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ═══════════════════════════════════════════════════════════════════
  # Merge multi-arch manifests (version tags only)
  # ═══════════════════════════════════════════════════════════════════
  merge:
    needs:
      [version-check,
       docker-server-amd64, docker-agent-amd64, docker-ui-amd64,
       docker-server-arm64, docker-agent-arm64, docker-ui-arm64]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch version manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          RUST_VER="${{ needs.version-check.outputs.rust_version }}"
          WEB_VER="${{ needs.version-check.outputs.web_version }}"

          for prefix in server agent; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${RUST_VER} \
              ${IMG}:${prefix}-${RUST_VER}-amd64 ${IMG}:${prefix}-${RUST_VER}-arm64
          done
          docker buildx imagetools create -t ${IMG}:ui-${WEB_VER} \
            ${IMG}:ui-${WEB_VER}-amd64 ${IMG}:ui-${WEB_VER}-arm64

  # ═══════════════════════════════════════════════════════════════════
  # Update production kustomize
  # ═══════════════════════════════════════════════════════════════════
  update-prod-kustomize:
    needs: [version-check, merge]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: |
          cd k8s/overlays/production
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          RUST_VER="${{ needs.version-check.outputs.rust_version }}"
          WEB_VER="${{ needs.version-check.outputs.web_version }}"
          kustomize edit set image \
            ghcr.io/${OWNER_LOWER}/nession-server=ghcr.io/${OWNER_LOWER}/nession:server-${RUST_VER} \
            ghcr.io/${OWNER_LOWER}/nession-agent=ghcr.io/${OWNER_LOWER}/nession:agent-${RUST_VER} \
            ghcr.io/${OWNER_LOWER}/nession-ui=ghcr.io/${OWNER_LOWER}/nession:ui-${WEB_VER}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update prod image tags to v${{ needs.version-check.outputs.rust_version }} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break || sleep 2
          done

  # ═══════════════════════════════════════════════════════════════════
  # Native binaries — macOS (arm64 native + amd64 cross-compile)
  # ═══════════════════════════════════════════════════════════════════
  build-macos:
    needs: [version-check, rust-check, web-check]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }

      - name: Build (arm64)
        run: cargo build --release --target aarch64-apple-darwin --bin nession-server --bin nession-agent --bin nession

      - name: Build (amd64)
        run: cargo build --release --target x86_64-apple-darwin --bin nession-server --bin nession-agent --bin nession

      - name: Package arm64
        run: |
          V="${{ needs.version-check.outputs.rust_version }}"
          mkdir -p dist-arm64
          for bin in nession-server nession-agent nession; do
            cp "target/aarch64-apple-darwin/release/${bin}" "dist-arm64/${bin}"
          done
          tar -czf "nession-${V}-darwin-arm64.tar.gz" -C dist-arm64 .

      - name: Package amd64
        run: |
          V="${{ needs.version-check.outputs.rust_version }}"
          mkdir -p dist-amd64
          for bin in nession-server nession-agent nession; do
            cp "target/x86_64-apple-darwin/release/${bin}" "dist-amd64/${bin}"
          done
          tar -czf "nession-${V}-darwin-amd64.tar.gz" -C dist-amd64 .

      - name: Generate checksums
        run: |
          sha256sum nession-*-darwin-arm64.tar.gz > checksums-darwin-arm64.txt
          sha256sum nession-*-darwin-amd64.tar.gz > checksums-darwin-amd64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: nession-*.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-macos
          path: checksums-darwin-*.txt
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════════════════════════
  create-release:
    needs:
      [version-check, merge,
       build-linux-amd64, build-linux-arm64, build-macos]
    if: needs.version-check.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: ./
          merge-multiple: true

      - name: Merge checksums
        run: |
          cat checksums-*.txt > release-assets/checksums.txt
          rm -f checksums-*.txt

      - name: Copy install.sh to release assets
        run: cp scripts/install.sh release-assets/install.sh

      - name: List assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.rust_version }}
          name: v${{ needs.version-check.outputs.rust_version }}
          body: |
            ## Nession v${{ needs.version-check.outputs.rust_version }}

            ### Docker Images
            - `ghcr.io/${{ github.repository_owner }}/nession:server-${{ needs.version-check.outputs.rust_version }}`
            - `ghcr.io/${{ github.repository_owner }}/nession:agent-${{ needs.version-check.outputs.rust_version }}`
            - `ghcr.io/${{ github.repository_owner }}/nession:ui-${{ needs.version-check.outputs.web_version }}`

            ### Native Binaries
            | Platform | Architectures |
            |----------|---------------|
            | Linux | amd64, arm64 |
            | macOS | amd64 (Intel), arm64 (Apple Silicon) |

            ### Verification
            Verify downloads with `checksums.txt`:
            ```bash
            sha256sum -c checksums.txt
            ```
          files: release-assets/*
          generate_release_notes: true

  # ═══════════════════════════════════════════════════════════════════
  # Cleanup — keep last 5 GitHub Releases
  # ═══════════════════════════════════════════════════════════════════
  cleanup-releases:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete old releases (keep last 5)
        run: |
          echo "Fetching releases..."
          TAGS=$(gh release list --limit 100 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[].tagName' 2>/dev/null || echo "")

          if [ -z "$TAGS" ]; then
            echo "No releases found — skipping cleanup."
            exit 0
          fi

          COUNT=0
          for TAG in $TAGS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              echo "Deleting release: ${TAG}"
              gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || \
                echo "  ⚠ Failed to delete release ${TAG}"
            else
              echo "Keeping release: ${TAG} (position: ${COUNT})"
            fi
          done

          echo "Cleanup complete. Deleted $((COUNT > 5 ? COUNT - 5 : 0)) old releases."

  # ═══════════════════════════════════════════════════════════════════
  # Cleanup — keep last 5 GHCR version-tagged packages
  # ═══════════════════════════════════════════════════════════════════
  cleanup-ghcr:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old package versions (keep last 5)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PACKAGE="nession"

          echo "Fetching versions for ${OWNER}/${PACKAGE}..."
          VERSIONS=$(gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --paginate \
            -q 'sort_by(.created_at) | reverse | .[].id' 2>/dev/null || echo "")

          if [ -z "$VERSIONS" ]; then
            echo "No versions found — skipping cleanup."
            exit 0
          fi

          COUNT=0
          for ID in $VERSIONS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              echo "Deleting version ${ID} (position: ${COUNT})"
              gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions/${ID}" \
                -X DELETE --silent 2>/dev/null || echo "  ⚠ Failed to delete version ${ID}"
            else
              echo "Keeping version ${ID} (position: ${COUNT})"
            fi
          done

          echo "Cleanup complete. Deleted $((COUNT > 5 ? COUNT - 5 : 0)) old versions."
