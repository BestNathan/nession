name: Acceptance / Case Smoke

permissions:
  contents: read
  issues: read

on:
  pull_request:
    branches: [staging, main]
    # Scope PR execution to changes that can affect this validator.
    # Keep push / manual triggers unchanged for exact-SHA evidence.
    paths:
      - '.github/workflows/acceptance-case-smoke.yml'
      - 'crates/**'
      - 'web/**'
      - 'design/**'
      - 'e2e/**'
      - 'gates/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'justfile'
  workflow_dispatch:

concurrency:
  group: acceptance-case-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  case-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RUSTC_WRAPPER: ""
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checks verify exact source SHA, never GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout trusted main selectors (no write credentials)
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Validate canonical Case contracts and generic selection
        run: |
          node scripts/acceptance-cases-selftest.mjs
          node scripts/acceptance-case-smoke-select.mjs self-test
          node scripts/select-acceptance-cases.mjs self-test

      - name: Build runtime
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          cargo build -p nession-server -p nession-agent

      - name: Install browser Case runtime
        run: |
          cd e2e
          npm ci
          npx playwright install chromium --with-deps

      - name: Select representative Case verifier classes (untrusted source, no token)
        run: |
          set -euo pipefail
          node scripts/acceptance-case-smoke-select.mjs select \
            e2e/acceptance/cases "${RUNNER_TEMP}/representative-cases.json"

      - name: Select PR-linked Case-method proofs (trusted main policy)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          mkdir -p "${RUNNER_TEMP}/acceptance-smoke-contracts" "${RUNNER_TEMP}/acceptance-smoke-results"
          echo '[]' > "${RUNNER_TEMP}/linked-cases.json"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            issue_numbers="$(node trusted/scripts/requirement-acceptance.mjs discover-pre-merge)"
            jq -r '.[]' <<< "${issue_numbers}" | while read -r issue; do
              gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" \
                > "${RUNNER_TEMP}/acceptance-smoke-contracts/${issue}.json"
            done
            ISSUE_NUMBERS="${issue_numbers}" ACCEPTANCE_STAGE="pre-merge" \
              TARGET_SHA="${target_sha}" \
              node trusted/scripts/select-acceptance-cases.mjs select \
              e2e/acceptance/cases "${RUNNER_TEMP}/acceptance-smoke-contracts" \
              "${RUNNER_TEMP}/selected-pr-cases.json" "${RUNNER_TEMP}/pr-case-coverage.json"
            jq 'map(. + {stage:"pre-merge"})' "${RUNNER_TEMP}/selected-pr-cases.json" \
              > "${RUNNER_TEMP}/linked-cases.json"
          fi

          jq -s 'add | unique_by([.issue,.criterion,.stage])' \
            "${RUNNER_TEMP}/representative-cases.json" \
            "${RUNNER_TEMP}/linked-cases.json" \
            > "${RUNNER_TEMP}/acceptance-smoke-plan.json"
          jq -e 'length >= 2' "${RUNNER_TEMP}/acceptance-smoke-plan.json" > /dev/null
          cp "${RUNNER_TEMP}/acceptance-smoke-plan.json" \
            "${RUNNER_TEMP}/acceptance-smoke-results/selection.json"
          echo "Selected generic Case Smoke plan:"
          jq . "${RUNNER_TEMP}/acceptance-smoke-plan.json"

      # #1866 Phase B: one job-scoped invocation instead of one
      # `./e2e/run acceptance` per Case. Every Case still emits its own record
      # and verdict; only Cases that opted into `isolation: shared` share one
      # job-owned runtime. The batch receipt is written to this job's log so
      # Acceptance evaluators can observe the reuse without reading artifacts.
      - name: Run selected source-aligned Cases through one job-scoped batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          contracts="${RUNNER_TEMP}/acceptance-smoke-contracts"
          results="${RUNNER_TEMP}/acceptance-smoke-results"
          mkdir -p "${contracts}" "${results}"
          # Representative Cases are not PR-linked, so their trusted Issue
          # contracts may not have been fetched by the selection step.
          jq -r '.[].issue' "${RUNNER_TEMP}/acceptance-smoke-plan.json" | sort -u |
            while read -r issue; do
              # Never trust PR-head JSON to supply CLI identifiers.
              [[ "${issue}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid Issue ID"; exit 1; }
              if [[ ! -s "${contracts}/${issue}.json" ]]; then
                gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" > "${contracts}/${issue}.json"
              fi
            done
          # Source Case verifier code must not inherit the GitHub token.
          unset GH_TOKEN GITHUB_TOKEN
          set +e
          ./e2e/run acceptance-batch \
            --sha "${target_sha}" \
            --stage pre-merge \
            --selection "${RUNNER_TEMP}/acceptance-smoke-plan.json" \
            --contracts-dir "${contracts}" \
            --results-dir "${results}" \
            > "${results}/records.jsonl" 2> "${results}/batch.log"
          status=$?
          set -e
          cat "${results}/batch.log" >&2
          {
            echo "## Acceptance Case smoke batch"
            echo
            echo '```'
            grep -E '^\[acceptance-batch\]' "${results}/batch.log" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-case-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/acceptance-smoke-results/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
