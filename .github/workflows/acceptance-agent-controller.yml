name: Acceptance / Agent Controller

# Unprivileged owner/main request. A single native owner-authenticated #3001
# comment may use the same trust-separated ingress when manual workflow
# dispatch is unavailable. This workflow cannot write Store or use App keys.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing OPEN Issue (use a separate fixture Issue, not #1664)'
        required: true
        type: number
      input_sha:
        description: 'Exact main-ancestor SHA for manual Owner starts; Bug comments bind to trusted main SHA'
        required: false
        default: ''
        type: string
      source_comment_id:
        description: 'Original Owner /develop comment ID, supplied only by the trusted Comment Router'
        required: false
        default: ''
        type: string
      developer:
        description: 'Optional registered Developer override (Qwen awaits #2274)'
        required: false
        default: ''
        type: string
      reviewer:
        description: 'Optional registered Reviewer override (empty = GitHub default)'
        required: false
        default: ''
        type: string
      acceptor:
        description: 'Optional registered Acceptor override (empty = GitHub default)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: read

jobs:
  request:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (
        (github.actor == 'BestNathan' && github.event_name == 'workflow_dispatch') ||
        (github.actor == 'github-actions[bot]' &&
         github.event_name == 'workflow_dispatch' &&
         inputs.source_comment_id != '' &&
         inputs.input_sha == '' &&
         inputs.developer == '' &&
         inputs.reviewer == '' &&
         inputs.acceptor == '') ||
        (
          github.actor == 'BestNathan' &&
          github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 3001 &&
          github.event.issue.state == 'open' &&
          !github.event.issue.pull_request &&
          github.event.comment.user.login == 'BestNathan' &&
          github.event.comment.body == '/nession qwen-v2-start issue=3001'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main request contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify request and Controller Store contracts without credentials
        run: |
          set -euo pipefail
          node scripts/lib/agent/orchestration/controller-start-selftest.mjs
          node scripts/lib/agent/orchestration/controller-request-selftest.mjs
          node scripts/lib/agent/orchestration/bug-develop-comment.mjs self-test
      - name: Revalidate original Owner Bug comment for bot-origin requests
        if: github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
        run: node scripts/lib/agent/orchestration/bug-develop-comment.mjs verify "$ISSUE_NUMBER" "$SOURCE_COMMENT_ID"

      - name: Confirm exact SHA and open native Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'issue_comment' && '3001' || inputs.issue_number }}
          INPUT_SHA: ${{ github.actor == 'github-actions[bot]' && github.sha || (github.event_name == 'issue_comment' && github.sha || inputs.input_sha) }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$INPUT_SHA^{commit}"
          git merge-base --is-ancestor "$INPUT_SHA" HEAD
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" |
            jq -e --argjson n "$ISSUE_NUMBER" '
              .number == $n and .state == "open" and
              (.pull_request | not) and
              .repository_url == ("https://api.github.com/repos/" + env.GITHUB_REPOSITORY)
            ' >/dev/null
      - name: Export validated sanitized request (no Store private key)
        env:
          CONTROLLER_DEFAULT_DEVELOPER: ${{ vars.AGENT_DEFAULT_DEVELOPER }}
          CONTROLLER_DEFAULT_REVIEWER: ${{ vars.AGENT_DEFAULT_REVIEWER }}
          CONTROLLER_DEFAULT_ACCEPTOR: ${{ vars.AGENT_DEFAULT_ACCEPTOR }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controller-request"
          node scripts/lib/agent/orchestration/controller-request.mjs prepare             "$RUNNER_TEMP/controller-request/controller-request.json"
      - name: Publish only owner/main-bound Controller request
        uses: actions/upload-artifact@v4
        with:
          name: agent-controller-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/controller-request/controller-request.json
          if-no-files-found: error
          retention-days: 2
