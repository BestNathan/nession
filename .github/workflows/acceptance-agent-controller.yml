name: Acceptance / Agent Controller

# Owner-initiated trusted Controller root: one immutable Issue state + Outbox
# action in the pre-bootstrapped agent-store orphan ref. No Provider/model runs.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing OPEN Issue to initialize (use a separate fixture Issue)'
        required: true
        type: number
      input_sha:
        description: 'Exact main-ancestor SHA of the intended development input'
        required: true
        type: string
      developer:
        description: 'Registered Developer Agent ID'
        required: true
        default: dev-cursor-01
        type: string
      reviewer:
        description: 'Registered Reviewer Agent ID'
        required: true
        default: review-cursor-01
        type: string
      acceptor:
        description: 'Registered Acceptor Agent ID'
        required: true
        default: accept-cursor-01
        type: string

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: acceptance-agent-controller-initialize
  cancel-in-progress: false

jobs:
  initialize:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout authenticated main Controller code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Controller, immutable Store and negative-case contracts
        run: |
          set -euo pipefail
          node scripts/lib/agent/orchestration/controller-start-selftest.mjs
          ./gates/run run-store-integrity
      - name: Verify explicit Issue and exact main-ancestor SHA before issuing writer token
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_SHA: ${{ inputs.input_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Positive Issue number required"; exit 1;
          }
          [[ "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::Exact source commit SHA required"; exit 1;
          }
          git cat-file -e "$INPUT_SHA^{commit}"
          git merge-base --is-ancestor "$INPUT_SHA" HEAD || {
            echo "::error::Source SHA must be reachable from checked-out main"; exit 1;
          }
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" |
            jq -e --argjson number "$ISSUE_NUMBER" '
              .number == $number and .state == "open" and
              (.pull_request | not) and .repository_url ==
              ("https://api.github.com/repos/" + env.GITHUB_REPOSITORY)
            ' >/dev/null || {
              echo "::error::Selected Issue must be an open native repository Issue"; exit 1;
            }
          echo "Authenticated main SHA and explicit open Issue #$ISSUE_NUMBER" >> "$GITHUB_STEP_SUMMARY"
      - name: Require existing scoped Run Store App
        env:
          APP_ID: ${{ vars.RUN_STORE_WRITER_APP_ID }}
        run: |
          set -euo pipefail
          [[ "$APP_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Existing RUN_STORE_WRITER_APP_ID is required"; exit 1;
          }
      - name: Mint Store-scoped privileged writer identity
        id: writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RUN_STORE_WRITER_APP_ID }}
          private-key: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write
      - name: Atomically initialize Issue state and pending Developer action
        env:
          STORE_APP_TOKEN: ${{ steps.writer.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$STORE_APP_TOKEN" ]] || exit 1
          export AGENT_STORE_CONTROLLER_REMOTE="https://x-access-token:${STORE_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node scripts/lib/agent/orchestration/controller-start.mjs --apply > "$RUNNER_TEMP/controller-start.json"
          unset AGENT_STORE_CONTROLLER_REMOTE STORE_APP_TOKEN
          jq -e '.issue > 0 and .version == 1 and
            (.commit_sha | test("^[a-f0-9]{40}$")) and
            (.first_action_id | test("^[a-f0-9]{64}$"))' "$RUNNER_TEMP/controller-start.json" >/dev/null
          {
            echo "## Issue Controller durable initialization"
            echo "- Issue: #$(jq -r .issue "$RUNNER_TEMP/controller-start.json")"
            echo "- Created: $(jq -r .created "$RUNNER_TEMP/controller-start.json")"
            echo "- Replayed existing v1 state: $(jq -r .replayed "$RUNNER_TEMP/controller-start.json")"
            echo "- Store commit: $(jq -r .commit_sha "$RUNNER_TEMP/controller-start.json")"
            echo "- Pending action: $(jq -r .first_action_id "$RUNNER_TEMP/controller-start.json")"
            echo "- Worker dispatch: not performed; no model had Store credentials"
          } >> "$GITHUB_STEP_SUMMARY"
