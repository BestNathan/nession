name: Agent / Cursor Resume Verify

# Second genuinely distinct GitHub Run. Ingest from a verified main-owned seed
# and restore only ciphertext authenticated under the checkpoint private key.
on:
  workflow_run:
    workflows:
      - Agent / Cursor Resume Seed
    types: [completed]

env:
  NSESSION_AGENT_WORKFLOW_ID: agent-cursor-resume-verify

permissions:
  contents: read
  actions: read

jobs:
  resume:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'BestNathan/nession' &&
      github.event.workflow_run.head_repository.full_name == 'BestNathan/nession' &&
      vars.CURSOR_RESUME_PUBLIC_KEY_B64 != ''
    runs-on: ubuntu-latest
    environment: cursor
    timeout-minutes: 15
    env:
      CURSOR_MODEL: ${{ vars.CURSOR_MODEL || 'composer-2.5' }}
      CURSOR_MODEL_FAST: ${{ vars.CURSOR_MODEL_FAST || 'true' }}
      CURSOR_SDK_VERSION: ${{ vars.CURSOR_SDK_VERSION || 'latest' }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the exact authenticated producer main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read and independently authenticate seed Run and Artifact identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/seed-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/seed-artifacts.json"
          node scripts/lib/agent/providers/cursor-resume-fixture.mjs verify-source \
            "$RUNNER_TEMP/seed-run.json" "$RUNNER_TEMP/seed-artifacts.json" \
            "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_SHA" > "$RUNNER_TEMP/seed-artifact-digest"
      - name: Download exact single encrypted seed Artifact
        uses: actions/download-artifact@v4
        with:
          name: cursor-resume-seed-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cursor-resume-input
      - name: Install matching native SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cursor-sdk"
          npm install --prefix "$RUNNER_TEMP/cursor-sdk" "@cursor/sdk@$CURSOR_SDK_VERSION"
          echo "CURSOR_SDK_ROOT=$RUNNER_TEMP/cursor-sdk" >> "$GITHUB_ENV"
      - name: Decrypt into restricted temporary native Store (no model invocation)
        env:
          CURSOR_RESUME_PRIVATE_KEY_B64: ${{ secrets.CURSOR_RESUME_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          node scripts/lib/agent/providers/cursor-resume-fixture.mjs unseal \
            "$RUNNER_TEMP/cursor-resume-input" "$RUNNER_TEMP/cursor-resume-store"
      - name: Resume the same native Cursor SDK Agent and verify retained context
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/lib/agent/providers/cursor-resume-fixture.mjs resume \
            "$RUNNER_TEMP/cursor-resume-input" "$RUNNER_TEMP/cursor-resume-store" \
            "$RUNNER_TEMP/cursor-resume-verification"
      - name: Upload canonical Agent telemetry for existing trusted Metrics Ingest
        uses: actions/upload-artifact@v4
        with:
          name: agent-telemetry-cursor-resume-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-resume-verification/agent-telemetry.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized continuity proof (no native session bytes)
        uses: actions/upload-artifact@v4
        with:
          name: cursor-resume-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cursor-resume-verification/verification.json
            ${{ runner.temp }}/cursor-resume-verification/agent-telemetry.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral native Store after run
        if: always()
        run: |
          # Deletes local ephemeral files only; the encrypted source Artifact remains
          # for bounded authenticated readback.
          rm -rf "$RUNNER_TEMP/cursor-resume-store"
