name: Task / Ephemeral Runner

# Task source is pinned by SHA. GitHub-authenticated Write+ actors may request
# allowlisted credentials; all other tasks remain secretless and read-only.
# Result records are still untrusted observations ingested by task-result-ingest.yml.
on:
  push:
    branches:
      - 'task/**'
    paths:
      - '.task/**'
  workflow_dispatch:
    inputs:
      task_id:
        description: Registered Task ID (must equal task.json id)
        required: true
        type: string
      source_sha:
        description: Exact 40-character Task source commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ephemeral-task-${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
      REQUESTED_ID: ${{ github.event_name == 'push' && github.ref_name || inputs.task_id }}
    steps:
      - name: Checkout trusted main Task runner
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout exact untrusted Task source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: workspace
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runner contract
        run: node trusted/scripts/task-runner.mjs self-test
      - name: Classify authenticated task initiator
        id: actor
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: node trusted/scripts/task-runner.mjs actor-trust
      - name: Check exact-source Task credential request
        id: route
        env:
          TASK_ACTOR_TRUSTED: ${{ steps.actor.outputs.trusted }}
        run: |
          set -euo pipefail
          task_id="${REQUESTED_ID#task/}"
          node trusted/scripts/task-runner.mjs route \
            "${GITHUB_WORKSPACE}/workspace" "${SOURCE_SHA}" "${task_id}"
      - name: Run ordinary Task (no secrets)
        if: steps.route.outputs.credentialed == 'false'
        env:
          TASK_OUTPUT: ${{ runner.temp }}/task-execution
        run: |
          set -euo pipefail
          task_id="${REQUESTED_ID#task/}"
          node trusted/scripts/task-runner.mjs execute \
            "${GITHUB_WORKSPACE}/workspace" "${SOURCE_SHA}" "${task_id}" "${TASK_OUTPUT}"
      - name: Run Write+ Task with requested allowlisted secret
        if: steps.route.outputs.credentialed == 'true'
        env:
          TASK_OUTPUT: ${{ runner.temp }}/task-execution
          TASK_APPROVED_SECRETS: TYPESAFE_API_KEY
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          task_id="${REQUESTED_ID#task/}"
          node trusted/scripts/task-runner.mjs execute \
            "${GITHUB_WORKSPACE}/workspace" "${SOURCE_SHA}" "${task_id}" "${TASK_OUTPUT}"
      - name: Upload untrusted Task observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-execution/record.json
          if-no-files-found: error
          retention-days: 14
