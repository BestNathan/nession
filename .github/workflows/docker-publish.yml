name: Docker

on:
  push:
    branches: [main]

jobs:
  # ── 读取版本号 + 检测是否变化 ──
  versions:
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.versions.outputs.rust_version }}
      web_version: ${{ steps.versions.outputs.web_version }}
      should_deploy: ${{ steps.versions.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: versions
        run: |
          RUST_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          WEB_VER=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          echo "rust_version=${RUST_VER}" >> $GITHUB_OUTPUT
          echo "web_version=${WEB_VER}" >> $GITHUB_OUTPUT

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No comparable previous commit — deploying."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            PREV_RUST=$(git show ${BEFORE}:Cargo.toml 2>/dev/null | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')
            PREV_WEB=$(git show ${BEFORE}:web/package.json 2>/dev/null | grep '"version"' | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
            if [ "$RUST_VER" != "$PREV_RUST" ] || [ "$WEB_VER" != "$PREV_WEB" ]; then
              echo "Version changed (rust: ${PREV_RUST} -> ${RUST_VER}, web: ${PREV_WEB} -> ${WEB_VER}) — deploying."
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged (rust: ${RUST_VER}, web: ${WEB_VER}) — skipping deploy."
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          fi
          echo "Rust: ${RUST_VER}, Web: ${WEB_VER}"

  # ── Build web UI 一次（架构无关）──
  build-web:
    needs: versions
    if: needs.versions.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ── amd64: 原生 x86_64 ──
  build-amd64:
    needs: [versions, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/web-dist
      - name: Set image refs (lowercase)
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.versions.outputs.rust_version }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.RUST_VER }}-amd64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

      - name: Build & push agent (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.RUST_VER }}-amd64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

      - name: Build & push UI (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:ui-${{ needs.versions.outputs.web_version }}-amd64
          build-contexts: |
            web-dist=/tmp/web-dist

  # ── arm64: GitHub 原生 ARM runner ──
  build-arm64:
    needs: [versions, build-web]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/web-dist
      - name: Set image refs (lowercase)
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.versions.outputs.rust_version }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.RUST_VER }}-arm64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

      - name: Build & push agent (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.RUST_VER }}-arm64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

      - name: Build & push UI (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:ui-${{ needs.versions.outputs.web_version }}-arm64
          build-contexts: |
            web-dist=/tmp/web-dist

  # ── 合并 multi-arch manifests ──
  merge:
    needs: [versions, build-amd64, build-arm64]
    if: needs.versions.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          RUST_VER="${{ needs.versions.outputs.rust_version }}"
          WEB_VER="${{ needs.versions.outputs.web_version }}"
          for prefix in server agent; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${RUST_VER} \
              ${IMG}:${prefix}-${RUST_VER}-amd64 ${IMG}:${prefix}-${RUST_VER}-arm64
          done
          docker buildx imagetools create -t ${IMG}:ui-${WEB_VER} \
            ${IMG}:ui-${WEB_VER}-amd64 ${IMG}:ui-${WEB_VER}-arm64

  # ── 更新 kustomization.yaml ──
  update-kustomize:
    needs: [versions, merge]
    if: needs.versions.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd k8s
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          RUST_VER="${{ needs.versions.outputs.rust_version }}"
          WEB_VER="${{ needs.versions.outputs.web_version }}"
          kustomize edit set image \
            ghcr.io/${OWNER_LOWER}/nession-server=ghcr.io/${OWNER_LOWER}/nession:server-${RUST_VER} \
            ghcr.io/${OWNER_LOWER}/nession-agent=ghcr.io/${OWNER_LOWER}/nession:agent-${RUST_VER} \
            ghcr.io/${OWNER_LOWER}/nession-ui=ghcr.io/${OWNER_LOWER}/nession:ui-${WEB_VER}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags (rust=${{ needs.versions.outputs.rust_version }}, web=${{ needs.versions.outputs.web_version }})"
          git push
