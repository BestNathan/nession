name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 所有镜像推到同一个 ghcr.io/bestnathan/nession package，用 tag 前缀 + 版本号区分
# tag 规则：
#   server-{rust_version}-{arch} → server-{rust_version} (multi-arch)
#   agent-{rust_version}-{arch}  → agent-{rust_version}  (multi-arch)
#   ui-{web_version}             (web 是纯静态，不需要 multi-arch)

jobs:
  # ── 读取版本号 ──
  versions:
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.versions.outputs.rust_version }}
      web_version: ${{ steps.versions.outputs.web_version }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          # Rust workspace version from Cargo.toml
          RUST_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          # Web version from package.json
          WEB_VER=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          echo "rust_version=${RUST_VER}" >> $GITHUB_OUTPUT
          echo "web_version=${WEB_VER}" >> $GITHUB_OUTPUT
          echo "Rust: ${RUST_VER}, Web: ${WEB_VER}"

  # ── amd64: 原生 x86_64 ──
  build-amd64:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image refs (lowercase)
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.versions.outputs.rust_version }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-all-crates: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: cd web && npm ci && npm run build
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (amd64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.RUST_VER }}-amd64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Build & push agent (amd64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.RUST_VER }}-amd64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

  # ── arm64: GitHub 原生 ARM runner ──
  build-arm64:
    needs: versions
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image refs (lowercase)
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "RUST_VER=${{ needs.versions.outputs.rust_version }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-all-crates: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: cd web && npm ci && npm run build
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.RUST_VER }}-arm64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Build & push agent (arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.RUST_VER }}-arm64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

  # ── UI image (纯静态，无需 multi-arch) ──
  build-ui:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image refs (lowercase)
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "WEB_VER=${{ needs.versions.outputs.web_version }}" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci && npm run build
      - run: mkdir -p /tmp/web-dist && cp -r web/dist/* /tmp/web-dist/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push UI
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.WEB_VER }}
          build-contexts: |
            web-dist=/tmp/web-dist

  # ── 合并 multi-arch manifest ──
  merge:
    needs: [versions, build-amd64, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          VER="${{ needs.versions.outputs.rust_version }}"
          for prefix in server agent; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${VER} \
              ${IMG}:${prefix}-${VER}-amd64 ${IMG}:${prefix}-${VER}-arm64
          done

  # ── 更新 kustomization.yaml ──
  update-kustomize:
    needs: [versions, merge, build-ui]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd k8s
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          RUST_VER="${{ needs.versions.outputs.rust_version }}"
          WEB_VER="${{ needs.versions.outputs.web_version }}"
          kustomize edit set image \
            ghcr.io/${OWNER_LOWER}/nession-server=ghcr.io/${OWNER_LOWER}/nession:server-${RUST_VER} \
            ghcr.io/${OWNER_LOWER}/nession-agent=ghcr.io/${OWNER_LOWER}/nession:agent-${RUST_VER} \
            ghcr.io/${OWNER_LOWER}/nession-ui=ghcr.io/${OWNER_LOWER}/nession:ui-${WEB_VER}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to ${{ needs.versions.outputs.rust_version }}"
          git push
