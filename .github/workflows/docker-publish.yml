name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ── amd64: 原生 x86_64，导出 tar artifact ──
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: web/package-lock.json }

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: cd web && npm ci && npm run build

      - name: Prepare image context
        run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3

      - name: Build & export server (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/server-amd64.tar
          tags: nession-server:amd64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Build & export agent (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/agent-amd64.tar
          tags: nession-agent:amd64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

      - uses: actions/upload-artifact@v4
        with:
          name: images-amd64
          path: /tmp/*-amd64.tar
          retention-days: 1

  # ── arm64: GitHub 原生 ARM runner，导出 tar artifact ──
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: web/package-lock.json }

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: cd web && npm ci && npm run build

      - name: Prepare image context
        run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3

      - name: Build & export server (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          outputs: type=docker,dest=/tmp/server-arm64.tar
          tags: nession-server:arm64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Build & export agent (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          outputs: type=docker,dest=/tmp/agent-arm64.tar
          tags: nession-agent:arm64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

      - uses: actions/upload-artifact@v4
        with:
          name: images-arm64
          path: /tmp/*-arm64.tar
          retention-days: 1

  # ── 合并 multi-arch，只推最终 tag ──
  push:
    needs: [build-amd64, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { packages: write }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          merge-multiple: true
          path: /tmp/

      - name: Load, push per-arch, create multi-arch manifest
        run: |
          REG="${{ env.REGISTRY }}/${{ github.repository_owner }}"
          REG="${REG,,}"  # lowercase required for Docker image refs
          TAG="${{ github.ref_name }}"
          TMP_TAG="__build-${{ github.run_id }}"

          for img in server agent; do
            for arch in amd64 arm64; do
              docker load -i /tmp/${img}-${arch}.tar
              docker tag nession-${img}:${arch} ${REG}/nession-${img}:${TMP_TAG}-${arch}
              docker push ${REG}/nession-${img}:${TMP_TAG}-${arch}
            done
            # 合并 multi-arch manifest
            docker buildx imagetools create -t ${REG}/nession-${img}:${TAG} \
              ${REG}/nession-${img}:${TMP_TAG}-amd64 \
              ${REG}/nession-${img}:${TMP_TAG}-arm64
            [ "$TAG" = "main" ] && \
            docker buildx imagetools create -t ${REG}/nession-${img}:latest \
              ${REG}/nession-${img}:${TMP_TAG}-amd64 \
              ${REG}/nession-${img}:${TMP_TAG}-arm64
          done

          # 清理临时 tag（通过 GHCR API 删除）
          echo "Cleaning up temporary tags..."
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          for img in server agent; do
            for suffix in "${TMP_TAG}-amd64" "${TMP_TAG}-arm64"; do
              VERSION_ID=$(gh api "repos/${OWNER}/${REPO}/packages/container/nession-${img}/versions" \
                --jq ".[] | select(.metadata.container.tags[] | contains(\"${suffix}\")) | .id" 2>/dev/null | head -1)
              if [ -n "$VERSION_ID" ]; then
                gh api --method DELETE \
                  "repos/${OWNER}/${REPO}/packages/container/nession-${img}/versions/${VERSION_ID}" \
                  2>/dev/null || true
              fi
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 更新 kustomization.yaml ──
  update-kustomize:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd k8s
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/nession-server:main \
            ghcr.io/${{ github.repository_owner }}/nession-agent:main
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to main"
          git push
