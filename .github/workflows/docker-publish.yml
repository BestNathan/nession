name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ── amd64: 原生 x86_64 编译 ──
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: web/package-lock.json }

      - name: Build Rust binaries
        run: cargo build --release --bin nession-server --bin nession-agent

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Prepare image context
        run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push server image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nession-server:${{ github.ref_name }}-amd64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Push agent image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nession-agent:${{ github.ref_name }}-amd64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

  # ── arm64: GitHub 原生 ARM runner ──
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ".", cache-all-crates: "true" }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: web/package-lock.json }

      - name: Build Rust binaries
        run: cargo build --release --bin nession-server --bin nession-agent

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Prepare image context
        run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push server image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nession-server:${{ github.ref_name }}-arm64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Push agent image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nession-agent:${{ github.ref_name }}-arm64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

  # ── 合并为 multi-arch manifest ──
  merge:
    needs: [build-amd64, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { packages: write }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          REG="${{ env.REGISTRY }}/${{ github.repository_owner }}"
          TAG="${{ github.ref_name }}"
          for img in nession-server nession-agent; do
            docker buildx imagetools create -t ${REG}/${img}:${TAG} \
              ${REG}/${img}:${TAG}-amd64 ${REG}/${img}:${TAG}-arm64
            [ "$TAG" = "main" ] && \
            docker buildx imagetools create -t ${REG}/${img}:latest \
              ${REG}/${img}:${TAG}-amd64 ${REG}/${img}:${TAG}-arm64
          done

  # ── 更新 kustomization.yaml ──
  update-kustomize:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd k8s
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/nession-server:main \
            ghcr.io/${{ github.repository_owner }}/nession-agent:main
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to main"
          git push
