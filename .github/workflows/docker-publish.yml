name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 所有镜像推到同一个 ghcr.io/bestnathan/nession package，用 tag 前缀区分 server/agent
# tag 规则：
#   server-{branch}-amd64 / server-{branch}-arm64 → server-{branch} (multi-arch)
#   agent-{branch}-amd64  / agent-{branch}-arm64  → agent-{branch}  (multi-arch)

jobs:
  # ── amd64: 原生 x86_64 ──
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image refs (lowercase)
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-all-crates: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: cd web && npm ci && npm run build
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (amd64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.TAG }}-amd64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Build & push agent (amd64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.TAG }}-amd64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

  # ── arm64: GitHub 原生 ARM runner ──
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image refs (lowercase)
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-all-crates: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: cd web && npm ci && npm run build
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.TAG }}-arm64
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=web/dist

      - name: Build & push agent (arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.TAG }}-arm64
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=web/dist

  # ── 合并 multi-arch manifest ──
  merge:
    needs: [build-amd64, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          TAG="${{ github.ref_name }}"
          for prefix in server agent; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${TAG} \
              ${IMG}:${prefix}-${TAG}-amd64 ${IMG}:${prefix}-${TAG}-arm64
            if [ "$TAG" = "main" ]; then
              docker buildx imagetools create -t ${IMG}:${prefix} \
                ${IMG}:${prefix}-${TAG}-amd64 ${IMG}:${prefix}-${TAG}-arm64
              docker buildx imagetools create -t ${IMG}:${prefix}-latest \
                ${IMG}:${prefix}-${TAG}-amd64 ${IMG}:${prefix}-${TAG}-arm64
            fi
          done

  # ── 更新 kustomization.yaml ──
  update-kustomize:
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd k8s
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          kustomize edit set image \
            ghcr.io/${OWNER_LOWER}/nession-server=ghcr.io/${OWNER_LOWER}/nession:server-main \
            ghcr.io/${OWNER_LOWER}/nession-agent=ghcr.io/${OWNER_LOWER}/nession:agent-main
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to main"
          git push
