name: Release / ACR Staging Public Readback (temporary)

on:
  push:
    branches: [test/acr-staging-readback-2225]
    paths:
      - '.github/workflows/release-acr-staging-readback-2225.yml'

permissions:
  contents: read

jobs:
  anonymous-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        image: [server, agent, ui]
        version: [e0ce848, 1790d9f]
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Verify no-login registry readback and two-platform manifest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ matrix.version }}
          REGISTRY_IMAGE: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com/n_public/nession
        run: |
          set -euo pipefail
          tag="${IMAGE}-${VERSION}"
          echo "Checking anonymous ACR manifest for ${tag}; no registry login credentials are configured"
          docker buildx imagetools inspect --raw "${REGISTRY_IMAGE}:${tag}" > manifest.json
          jq -e '
            [.manifests[]? | select(.platform.os == "linux") | .platform.architecture]
            | sort == ["amd64", "arm64"]
          ' manifest.json
          echo "Anonymous ACR readback verified: ${tag} (amd64 and arm64)"
