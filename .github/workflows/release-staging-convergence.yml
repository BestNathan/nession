name: Release / Staging Convergence

# #2926. Runs on trusted main only. This is a deterministic PR planner/writer,
# NOT an Agent runtime, Acceptance evaluator or permission to auto-merge.
# Eligible branches come from checked-in push-triggered Staging deploy workflows.
# Protected staging syncs use immutable checked two-parent integration heads,
# so rust-check/web-check can qualify the actual tested merge content.
on:
  schedule:
    - cron: '0 */2 * * *'
  # Bootstrap after the workflow definition is first installed/modified on main;
  # ordinary code pushes do not create extra convergence scans.
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-staging-convergence.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and report without creating PRs'
        required: false
        type: boolean
        default: false
  # Permit an owner-only no-approval recheck or exact source-bound approval.
  # Comments are wake-up signals only; the planner independently authenticates
  # every SHA, Issue declaration, approval, check and protected merge.
  issue_comment:
    types: [created]
  # Wake only on completed checks for repository-owned immutable sync heads;
  # the trusted controller still revalidates every source and receipt.
  workflow_run:
    workflows: ['CI / Quality Gate', 'Acceptance / Case Smoke', 'E2E / Tests']
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write # exact, main-owned batch Requirement creation (#2953)
  pull-requests: read

concurrency:
  group: release-staging-convergence
  cancel-in-progress: false

jobs:
  converge:
    # The no-approval recheck wakes the same fail-closed controller.
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request == null &&
          github.actor == github.event.comment.user.login &&
          (
            (
              github.actor == github.repository_owner &&
              github.event.comment.user.type == 'User' &&
              (
                startsWith(github.event.comment.body, '/approve-staging-convergence ') ||
                github.event.comment.body == '/run-staging-convergence'
              )
            ) ||
            (
              github.actor == 'github-actions[bot]' &&
              github.event.comment.user.type == 'Bot' &&
              startsWith(github.event.comment.body, 'STAGING_CONVERGENCE_AUDIT_V1 ')
            )
          )
        )
      ) &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'chore/staging-sync-')
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled/comment events can queue while protected Main advances.
          # Always execute the current trusted Main, never event-stale code.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify trusted main and deterministic negative fixtures
        run: |
          set -euo pipefail
          # Revalidate latest protected Main after checkout. Planner independently
          # re-reads main and deploy-eligible lane heads before any write.
          trusted_main="$(git rev-parse HEAD)"
          live_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$trusted_main" == "$live_main" ]] || {
            echo "::error::Protected Main advanced during checkout; retry on latest ref"; exit 1;
          }
          node scripts/staging-branch-convergence.mjs self-test
          node scripts/staging-convergence-batch.mjs self-test

      - name: Discover actual auto-deploy branch sources and plan exact refs
        id: plan
        run: |
          set -euo pipefail
          node scripts/staging-branch-convergence.mjs plan "$RUNNER_TEMP/convergence-plan.json"
          count="$(jq '[.branches[].actions[]] | length' "$RUNNER_TEMP/convergence-plan.json")"
          if [[ "$count" -gt 0 ]]; then
            echo 'actionable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'actionable=false' >> "$GITHUB_OUTPUT"
          fi
          {
            echo '## Staging branch convergence (#2926)'
            echo
            echo "- Trusted Main SHA: $(git rev-parse HEAD)"
            echo '- Scheduled cadence: every two hours (UTC); runs may be delayed by GitHub'
            echo
            echo '| Deploy-eligible branch | Ahead main | Behind main | Planned actions |'
            echo '|---|---:|---:|---|'
            jq -r '.branches[] | "| `" + .branch + "` | " + (.ahead|tostring) + " | " + (.behind|tostring) + " | " + (.actions|join(", ")) + " |"' "$RUNNER_TEMP/convergence-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint existing repository Publisher App identity for PR creation
        id: publisher
        if: steps.plan.outputs.actionable == 'true' && inputs.dry_run != true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write
          permission-pull-requests: write

      - name: Idempotently prepare, qualify and merge main/staging PRs
        if: steps.plan.outputs.actionable == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          READ_GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_GITHUB_TOKEN: ${{ github.token }}
          ISSUE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/staging-branch-convergence.mjs reconcile "$RUNNER_TEMP/convergence-plan.json" | tee "$RUNNER_TEMP/convergence-results.json"
          {
            echo
            echo '### Pull requests'
            jq -r '.[] | "- " + .direction + ": " + .url + " (" + .action + "; " + .outcome + (if .reason then "; " + .reason else "" end) + (if .issue_number then "; Issue #" + (.issue_number|tostring) else "" end) + (if .integration_head then "; integration " + .integration_head else "" end) + ")"' "$RUNNER_TEMP/convergence-results.json"
            echo
            echo 'Merges require authenticated exact-head PR Quality/Case/E2E, clean GitHub mergeability and promotion-specific staging/Issue acceptance. Blockers remain open for repair.'
          } >> "$GITHUB_STEP_SUMMARY"
          blocked="$(jq '[.[] | select(.outcome != "MERGED")] | length' "$RUNNER_TEMP/convergence-results.json")"
          if [[ "$blocked" -gt 0 ]]; then
            echo "::warning::Staging convergence has ${blocked} outstanding item(s); see the Job Summary for exact reasons"
          fi

      - name: Explain no-op or dry-run
        if: steps.plan.outputs.actionable != 'true' || inputs.dry_run == true
        run: |
          if [[ "${{ inputs.dry_run }}" == 'true' ]]; then
            echo 'Dry run: no PR writes performed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No divergence: no PR writes and no model invocations.' >> "$GITHUB_STEP_SUMMARY"
          fi
