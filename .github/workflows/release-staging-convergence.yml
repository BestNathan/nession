name: Release / Staging Convergence

# #2926/#3689. Runs on trusted main only. The deterministic planner writes
# PR proposals and a strict required qualification status; GitHub owns
# native merge-commit Auto-merge after all authenticated checks.
# Eligible branches come from checked-in push-triggered Staging deploy workflows.
# Protected staging syncs use immutable checked two-parent integration heads,
# so rust-check/web-check can qualify the actual tested merge content.
on:
  schedule:
    - cron: '0 */2 * * *'
  # Every Main advance invalidates strict-HEAD qualification until rechecked.
  push:
    branches: [main]
  # Recheck source Issue acceptance after changes; the trusted policy
  # independently reauthenticates the exact historic source PR/Issue.
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
  # Publisher-created promotion PRs should be armed as early as possible,
  # before CI finishes. Only the trusted Main checkout executes below.
  pull_request_target:
    branches: [main, staging]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and report without creating PRs'
        required: false
        type: boolean
        default: false
  # Permit an owner-only no-approval recheck or exact source-bound approval.
  # Comments are wake-up signals only; the planner independently authenticates
  # every SHA, Issue declaration, approval, check and protected merge.
  issue_comment:
    types: [created]
  # #3465: Full E2E is a periodic Main diagnostic, not a convergence wake
  # or an authorization source for either merge direction.
  # #3211/#3689: PR-native staging -> main promotion has exact-head PR
  # checks; wake on completion including failures to revoke stale status.
  # Only the independent canonical policy may publish qualified success.
  # #3674: wake on successful post-mirror Staging deploy push only after
  # release proof exists. This is NEVER approval; reconcile independently
  # re-attests exact HEAD checks, deployment and all source acceptance.
  # Wake only on completed checks for repository-owned immutable sync heads;
  # the trusted controller still revalidates every source and receipt.
  workflow_run:
    workflows: ['CI / Quality Gate', 'Acceptance / Case Smoke', 'E2E / Tests', 'Deploy / Staging ACR']
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write # legacy cleanup only; new batches are PR-native
  pull-requests: read
  statuses: write # only exact-HEAD canonical qualification context (#3689)

# Job-level controller serialization keeps required PR qualification independent:
# a newer unrelated schedule/workflow_run must not cancel pull_request_target
# before it publishes the required nession/convergence-qualification status.
jobs:
  # GitHub required contexts are branch-wide. Every regular main/staging PR
  # must receive a trusted "not applicable" success while the Publisher's
  # native Convergence proposals remain pending/failing until qualified.
  # Neither the event payload nor the PR head is executed as workflow code.
  classify_pr:
    if: github.event_name == 'pull_request_target' && github.repository == 'BestNathan/nession'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted Main classification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish SHA-bound required qualification context
        env:
          GH_TOKEN: ${{ github.token }}
          READ_GITHUB_TOKEN: ${{ github.token }}
          STATUS_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/staging-convergence-automerge.mjs classify

  converge:
    # Only the mutating controller is serialized; ordinary PR classifiers must
    # always run and publish their exact-HEAD required status.
    concurrency:
      group: release-staging-convergence
      cancel-in-progress: false
    needs: [classify_pr]
    # The no-approval recheck wakes the same fail-closed controller.
    # Owner PR comments are wake signals only; trusted source/digest checks remain mandatory.
    if: >-
      always() &&
      (github.event_name != 'pull_request_target' || needs.classify_pr.result == 'success') &&
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.actor == github.event.comment.user.login &&
          (
            (
              github.actor == github.repository_owner &&
              github.event.comment.user.type == 'User' &&
              (
                startsWith(github.event.comment.body, '/approve-staging-convergence ') ||
                github.event.comment.body == '/run-staging-convergence'
              )
            ) ||
            (
              github.actor == 'github-actions[bot]' &&
              github.event.issue.pull_request == null &&
              github.event.comment.user.type == 'Bot' &&
              startsWith(github.event.comment.body, 'STAGING_CONVERGENCE_AUDIT_V1 ')
            )
          )
        )
      ) &&
      (
        github.event_name != 'pull_request_target' ||
        (
          github.event.pull_request.user.login == 'nession-publisher[bot]' &&
          (
            (
              github.event.pull_request.head.ref == 'staging' &&
              github.event.pull_request.base.ref == 'main'
            ) ||
            (
              startsWith(github.event.pull_request.head.ref, 'chore/staging-sync-') &&
              github.event.pull_request.base.ref == 'staging'
            )
          ) &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      ) &&
      (
        github.event_name != 'workflow_run' ||
        (
          (
            github.event.workflow_run.conclusion == 'success' ||
            github.event.workflow_run.conclusion == 'failure' ||
            github.event.workflow_run.conclusion == 'cancelled'
          ) &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            (
              github.event.workflow_run.event == 'pull_request' &&
              (
                startsWith(github.event.workflow_run.head_branch, 'chore/staging-sync-') ||
                (
                  github.event.workflow_run.head_branch == 'staging' &&
                  github.event.workflow_run.pull_requests[0].head.ref == 'staging' &&
                  github.event.workflow_run.pull_requests[0].base.ref == 'main'
                )
              )
            ) ||
            (
              (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
              github.event.workflow_run.head_branch == 'staging' &&
              github.event.workflow_run.path == '.github/workflows/deploy-staging-acr.yml' &&
              github.event.workflow_run.name == 'Deploy / Staging ACR' &&
              github.event.workflow_run.repository.full_name == github.repository
            )
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled/comment events can queue while protected Main advances.
          # Always execute the current trusted Main, never event-stale code.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # #3247/#3248: immutable, token-free source fields make the real
      # workflow_run -> converge link independently auditable on Main.
      # A wake is observation only; it cannot authorize any promotion.
      - name: Record authenticated workflow wake receipt
        if: github.event_name == 'workflow_run'
        run: |
          jq -c --arg controller_run "$GITHUB_RUN_ID" '
            {
              receipt: "CONVERGENCE_WAKE_V1",
              controller_run: ($controller_run | tonumber),
              source_run_id: .workflow_run.id,
              source_attempt: .workflow_run.run_attempt,
              source_event: .workflow_run.event,
              source_path: .workflow_run.path,
              source_name: .workflow_run.name,
              source_repository: .workflow_run.repository.full_name,
              source_head_repository: .workflow_run.head_repository.full_name,
              source_sha: .workflow_run.head_sha,
              source_branch: .workflow_run.head_branch,
              source_conclusion: .workflow_run.conclusion
            }
          ' "$GITHUB_EVENT_PATH"

      - name: Verify trusted main and deterministic negative fixtures
        run: |
          set -euo pipefail
          # Revalidate latest protected Main after checkout. Planner independently
          # re-reads main and deploy-eligible lane heads before any write.
          trusted_main="$(git rev-parse HEAD)"
          live_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$trusted_main" == "$live_main" ]] || {
            echo "::error::Protected Main advanced during checkout; retry on latest ref"; exit 1;
          }
          node scripts/staging-branch-convergence.mjs self-test
          node scripts/staging-convergence-automerge.mjs self-test
          node scripts/staging-convergence-batch.mjs self-test

      - name: Discover actual auto-deploy branch sources and plan exact refs
        id: plan
        run: |
          set -euo pipefail
          node scripts/staging-branch-convergence.mjs plan "$RUNNER_TEMP/convergence-plan.json"
          count="$(jq '[.branches[].actions[]] | length' "$RUNNER_TEMP/convergence-plan.json")"
          if [[ "$count" -gt 0 ]]; then
            echo 'actionable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'actionable=false' >> "$GITHUB_OUTPUT"
          fi
          {
            echo '## Staging branch convergence (#2926)'
            echo
            echo "- Trusted Main SHA: $(git rev-parse HEAD)"
            echo '- Scheduled cadence: every two hours (UTC); runs may be delayed by GitHub'
            echo
            echo '| Deploy-eligible branch | Ahead main | Behind main | Planned actions |'
            echo '|---|---:|---:|---|'
            jq -r '.branches[] | "| `" + .branch + "` | " + (.ahead|tostring) + " | " + (.behind|tostring) + " | " + (.actions|join(", ")) + " |"' "$RUNNER_TEMP/convergence-plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint existing repository Publisher App identity for PR creation
        id: publisher
        if: steps.plan.outputs.actionable == 'true' && inputs.dry_run != true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write
          permission-pull-requests: write

      - name: Idempotently prepare and arm protected GitHub Auto-merge
        if: steps.plan.outputs.actionable == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          READ_GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_GITHUB_TOKEN: ${{ github.token }}
          ISSUE_GITHUB_TOKEN: ${{ github.token }}
          STATUS_GITHUB_TOKEN: ${{ github.token }}
          # The legacy qualified merge remains the default until both
          # protected targets enforce strict required qualification.
          NESSION_CONVERGENCE_NATIVE_AUTO_MERGE: ${{ vars.NESSION_CONVERGENCE_NATIVE_AUTO_MERGE }}
        run: |
          set -euo pipefail
          node scripts/staging-branch-convergence.mjs reconcile "$RUNNER_TEMP/convergence-plan.json" | tee "$RUNNER_TEMP/convergence-results.json"
          {
            echo
            echo '### Pull requests'
            jq -r '.[] | "- " + .direction + ": " + .url + " (" + .action + "; " + .outcome + (if .reason then "; " + .reason else "" end) + (if .issue_number then "; Issue #" + (.issue_number|tostring) else "" end) + (if .integration_head then "; integration " + .integration_head else "" end) + ")"' "$RUNNER_TEMP/convergence-results.json"
            echo
            if [[ "${NESSION_CONVERGENCE_NATIVE_AUTO_MERGE}" == 'true' ]]; then
              echo 'Native Auto-merge requested: strict required qualification on both protected targets must be proven. GitHub owns the merge.'
            else
              echo 'Migration not activated: retaining independently qualified merge-commit Controller until strict protected native Auto-merge is configured.'
            fi
            echo 'Main Full remains nonblocking (#3465).'
          } >> "$GITHUB_STEP_SUMMARY"
          blocked="$(jq '[.[] | select(.outcome != "AUTO_MERGE_QUALIFIED" and .outcome != "MERGED")] | length' "$RUNNER_TEMP/convergence-results.json")"
          if [[ "$blocked" -gt 0 ]]; then
            echo "::warning::Staging convergence has ${blocked} outstanding item(s); see the Job Summary for exact reasons"
          fi

      - name: Explain no-op or dry-run
        if: steps.plan.outputs.actionable != 'true' || inputs.dry_run == true
        run: |
          if [[ "${{ inputs.dry_run }}" == 'true' ]]; then
            echo 'Dry run: no PR writes performed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No divergence: no PR writes and no model invocations.' >> "$GITHUB_STEP_SUMMARY"
          fi
