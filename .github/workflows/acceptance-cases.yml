name: Acceptance / Cases

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Requirement Issue number
        required: true
        type: string
      criterion:
        description: Exact SC id, e.g. SC-14
        required: true
        type: string
      target_sha:
        description: Exact 40-character product SHA
        required: true
        type: string
      stage:
        description: Acceptance stage
        required: true
        type: choice
        options: [pre-merge, staging, post-merge]
      runtime_profile:
        description: Runtime profile declared by the Case
        required: true
        default: full-stack-local
        type: choice
        options: [full-stack-local]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: acceptance-cases-${{ github.event_name }}-${{ github.ref_name || inputs.target_sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      NESSION_ACCEPTANCE_TRUSTED_ROOT: ${{ github.workspace }}/trusted
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout trusted discovery tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Resolve target identity
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_CRITERION: ${{ inputs.criterion }}
          INPUT_RUNTIME: ${{ inputs.runtime_profile }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${INPUT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "target_sha must be exact SHA" >&2; exit 1; }
            [[ "${INPUT_ISSUE}" =~ ^[0-9]+$ ]] || { echo "issue_number must be numeric" >&2; exit 1; }
            [[ "${INPUT_CRITERION}" =~ ^SC-[0-9]{2,}$ ]] || { echo "criterion must be SC-xx" >&2; exit 1; }
            target_sha="${INPUT_SHA}"
            stage="${INPUT_STAGE}"
            issues="[\"${INPUT_ISSUE}\"]"
            manual_criterion="${INPUT_CRITERION}"
            runtime_profile="${INPUT_RUNTIME}"
          else
            target_sha="${PUSH_SHA}"
            case "${PUSH_REF}" in
              staging) stage=staging ;;
              main) stage=post-merge ;;
              *) echo "unsupported push branch ${PUSH_REF}" >&2; exit 1 ;;
            esac
            issues="$(node trusted/scripts/requirement-acceptance.mjs discover-ref "${target_sha}")"
            manual_criterion=""
            runtime_profile=""
          fi
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "issues=${issues}" >> "${GITHUB_OUTPUT}"
          echo "manual_criterion=${manual_criterion}" >> "${GITHUB_OUTPUT}"
          echo "runtime_profile=${runtime_profile}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          path: workspace
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            workspace/web/package-lock.json
            workspace/e2e/package-lock.json

      - name: Verify Acceptance Case selection contract
        run: node trusted/scripts/acceptance-case-selection-contract.mjs self-test

      - name: Fetch trusted Requirement contracts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBERS: ${{ steps.target.outputs.issues }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/acceptance-contracts"
          jq -r '.[]' <<<"${ISSUE_NUMBERS}" | while read -r issue; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" > "${RUNNER_TEMP}/acceptance-contracts/${issue}.json"
          done

      - name: Select source-aligned Cases
        id: select
        env:
          ISSUE_NUMBERS: ${{ steps.target.outputs.issues }}
          ACCEPTANCE_STAGE: ${{ steps.target.outputs.stage }}
          MANUAL_CRITERION: ${{ steps.target.outputs.manual_criterion }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          RUNTIME_PROFILE: ${{ steps.target.outputs.runtime_profile }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/acceptance-case-results"
          # Trusted main tooling owns selection; target Case manifests are untrusted inputs.
          node trusted/scripts/select-acceptance-cases.mjs select \
            "workspace/e2e/acceptance/cases" \
            "${RUNNER_TEMP}/acceptance-contracts" \
            "${RUNNER_TEMP}/selected-cases.json" \
            "${RUNNER_TEMP}/case-coverage.json"
          count="$(jq 'length' "${RUNNER_TEMP}/selected-cases.json")"
          needs_browser="$(jq 'any(.needs_browser == true)' "${RUNNER_TEMP}/selected-cases.json")"
          selection_status="$(jq -r '.status' "${RUNNER_TEMP}/case-coverage.json")"
          cp "${RUNNER_TEMP}/selected-cases.json" "${RUNNER_TEMP}/acceptance-case-results/selection.json"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "needs_browser=${needs_browser}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Acceptance Case selection"
            echo
            echo "- Target: \`${{ steps.target.outputs.target_sha }}\`"
            echo "- Stage: \`${{ steps.target.outputs.stage }}\`"
            echo "- Cases: ${count}"
            echo "- Selection: ${selection_status} (not-applicable is not a Case Pass)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.select.outputs.count != '0'
        with: { cache-workspaces: "workspace", cache-all-crates: "true" }

      - name: Install runtime dependencies
        if: steps.select.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Web preview dependencies
        if: steps.select.outputs.count != '0'
        run: cd workspace/web && npm ci

      # Only an exact main push may read a completed successful main Quality
      # producer. PR or manual/other stage Cases build locally without any
      # GH_TOKEN passed to target-controlled code. This never suppresses Cases.
      - name: Restore verified main Web dist
        id: web-dist
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && steps.target.outputs.stage == 'post-merge' && steps.target.outputs.target_sha == github.sha)) && github.ref == 'refs/heads/main' && steps.select.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash workspace/scripts/ci/try-web-build-reuse.sh workspace "${{ steps.target.outputs.target_sha }}"

      - name: Build Web on cold/mismatched artifact
        if: steps.select.outputs.count != '0' && steps.web-dist.outputs.hit != 'true'
        run: cd workspace/web && npm run build

      - name: Verify runnable Web preview and proxy parity
        if: steps.select.outputs.count != '0'
        run: node workspace/scripts/ci/web-preview-parity.mjs workspace

      - name: Build Rust runtime
        if: steps.select.outputs.count != '0'
        run: cd workspace && cargo build -p nession-server -p nession-agent

      # Runtime/Protocol verifiers may invoke a real Browser/Terminal Scenario
      # transitively. Each such Case must explicitly declare a Browser verifier;
      # only the trusted selector may request browser runtime installation.
      - name: Install browser verifier runtime
        if: steps.select.outputs.needs_browser == 'true'
        run: |
          set -euo pipefail
          cd workspace/e2e
          npm ci
          npx playwright install chromium --with-deps

      # #1866 Phase B: one job-scoped invocation instead of one `run acceptance`
      # per Case. Each Case still emits its own record and verdict; eligible
      # Cases (manifest `isolation: shared`) may share one runtime. Every Case
      # still runs even when an earlier one fails, and the step still fails.
      - name: Execute selected Cases in one job-scoped batch
        id: cases
        if: steps.select.outputs.count != '0'
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          ACCEPTANCE_STAGE: ${{ steps.target.outputs.stage }}
        run: |
          set -uo pipefail
          results="${RUNNER_TEMP}/acceptance-case-results"
          node workspace/e2e/run acceptance-batch \
            --sha "${TARGET_SHA}" \
            --stage "${ACCEPTANCE_STAGE}" \
            --selection "${RUNNER_TEMP}/selected-cases.json" \
            --contracts-dir "${RUNNER_TEMP}/acceptance-contracts" \
            --results-dir "${results}" \
            > "${results}/records.jsonl" 2> "${results}/batch.log"
          status=$?
          cat "${results}/batch.log" >&2
          {
            echo "## Acceptance Case batch"
            echo
            echo '```'
            grep -E '^\[acceptance-batch\]' "${results}/batch.log" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Enforce Case coverage without suppressing executed Case evidence
        if: always() && steps.select.outcome == 'success'
        run: |
          set -euo pipefail
          missing="$(jq '.missing | length' "${RUNNER_TEMP}/case-coverage.json")"
          echo "Missing eligible SC Cases: ${missing}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${missing}" -gt 0 ]]; then
            jq -r '.missing[]' "${RUNNER_TEMP}/case-coverage.json" >&2
            echo "::error::Missing Issue/SC Case coverage remains Pending; fix Cases before green Acceptance"
            exit 1
          fi

      - name: Upload compact Case results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-case-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-case-results/
          if-no-files-found: error
          retention-days: 90

      - name: Upload large verifier evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.needs_browser == 'true'
        with:
          name: acceptance-case-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/e2e/runner/drivers/test-results/
            workspace/e2e/test-results/
          if-no-files-found: warn
          retention-days: 90
