name: Acceptance Cases

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Requirement Issue number
        required: true
        type: string
      criterion:
        description: Exact SC id, e.g. SC-14
        required: true
        type: string
      target_sha:
        description: Exact 40-character product SHA
        required: true
        type: string
      stage:
        description: Acceptance stage
        required: true
        type: choice
        options: [pre-merge, staging, post-merge]
      runtime_profile:
        description: Runtime profile declared by the Case
        required: true
        default: full-stack-local
        type: choice
        options: [full-stack-local]

permissions:
  contents: read
  issues: read

concurrency:
  group: acceptance-cases-${{ github.event_name }}-${{ github.ref_name || inputs.target_sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      NESSION_ACCEPTANCE_TRUSTED_ROOT: ${{ github.workspace }}/trusted
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout trusted discovery tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Resolve target identity
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref_name }}
          INPUT_SHA: ${{ inputs.target_sha }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_CRITERION: ${{ inputs.criterion }}
          INPUT_RUNTIME: ${{ inputs.runtime_profile }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${INPUT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "target_sha must be exact SHA" >&2; exit 1; }
            [[ "${INPUT_ISSUE}" =~ ^[0-9]+$ ]] || { echo "issue_number must be numeric" >&2; exit 1; }
            [[ "${INPUT_CRITERION}" =~ ^SC-[0-9]{2,}$ ]] || { echo "criterion must be SC-xx" >&2; exit 1; }
            target_sha="${INPUT_SHA}"
            stage="${INPUT_STAGE}"
            issues="[\"${INPUT_ISSUE}\"]"
            manual_criterion="${INPUT_CRITERION}"
            runtime_profile="${INPUT_RUNTIME}"
          else
            target_sha="${PUSH_SHA}"
            case "${PUSH_REF}" in
              staging) stage=staging ;;
              main) stage=post-merge ;;
              *) echo "unsupported push branch ${PUSH_REF}" >&2; exit 1 ;;
            esac
            issues="$(node trusted/scripts/requirement-acceptance.mjs discover-ref "${target_sha}")"
            manual_criterion=""
            runtime_profile=""
          fi
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "issues=${issues}" >> "${GITHUB_OUTPUT}"
          echo "manual_criterion=${manual_criterion}" >> "${GITHUB_OUTPUT}"
          echo "runtime_profile=${runtime_profile}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          path: workspace
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            workspace/web/package-lock.json
            workspace/e2e/package-lock.json

      - name: Fetch trusted Requirement contracts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBERS: ${{ steps.target.outputs.issues }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/acceptance-contracts"
          jq -r '.[]' <<<"${ISSUE_NUMBERS}" | while read -r issue; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" > "${RUNNER_TEMP}/acceptance-contracts/${issue}.json"
          done

      - name: Select source-aligned Cases
        id: select
        env:
          ISSUE_NUMBERS: ${{ steps.target.outputs.issues }}
          ACCEPTANCE_STAGE: ${{ steps.target.outputs.stage }}
          MANUAL_CRITERION: ${{ steps.target.outputs.manual_criterion }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          RUNTIME_PROFILE: ${{ steps.target.outputs.runtime_profile }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/acceptance-case-results"
          if [[ ! -f trusted/acceptance/cases.mjs ]]; then
            echo "::error::Case discovery source missing at requested SHA; cannot claim acceptance"
            exit 2
          else
            node --input-type=module <<'NODE' > "${RUNNER_TEMP}/selected-cases.json"
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const moduleUrl = pathToFileURL(path.resolve('trusted/acceptance/cases.mjs')).href;
          const { discoverCases } = await import(moduleUrl);
          const issueSet = new Set(JSON.parse(process.env.ISSUE_NUMBERS || '[]').map(Number));
          const stage = process.env.ACCEPTANCE_STAGE;
          const manual = process.env.MANUAL_CRITERION || '';
          const runtime = process.env.RUNTIME_PROFILE || '';
          const selected = discoverCases(path.resolve('workspace/e2e/acceptance/cases'))
            .map((item) => item.manifest)
            .filter((item) => issueSet.has(item.issue))
            .filter((item) => item.stage === stage)
            .filter((item) => !manual || item.criterion === manual)
            .filter((item) => !runtime || item.runtime === runtime)
            .map(({ issue, criterion, runtime, verifiers }) => ({
              issue,
              criterion,
              runtime,
              needs_browser: verifiers.some((item) => item.type === 'browser'),
            }));
          process.stdout.write(JSON.stringify(selected));
          NODE
          fi
          # Coverage is computed against the trusted Issue contract on main,
          # not against a target-controlled list that can silently drop Cases.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          const trusted = await import(pathToFileURL(path.resolve('trusted/scripts/acceptance-executor.mjs')).href);
          const stage = process.env.ACCEPTANCE_STAGE;
          const issueNumbers = JSON.parse(process.env.ISSUE_NUMBERS || '[]').map(Number);
          const requested = process.env.MANUAL_CRITERION || '';
          const selected = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/selected-cases.json', 'utf8'));
          const expected = [];
          for (const issueNumber of issueNumbers) {
            const issue = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/acceptance-contracts/' + issueNumber + '.json', 'utf8'));
            const context = trusted.buildAcceptanceContext(issue, stage, { targetRef: process.env.TARGET_SHA, runId: process.env.GITHUB_RUN_ID });
            for (const criterion of context.criteria) expected.push(issueNumber + '/' + criterion.criterion);
          }
          const selectedKeys = selected.map((entry) => entry.issue + '/' + entry.criterion);
          const unexpected = selectedKeys.filter((key) => !expected.includes(key));
          const duplicates = selectedKeys.filter((key, index) => selectedKeys.indexOf(key) !== index);
          if (unexpected.length || duplicates.length) throw new Error(
            'Case selection includes wrong-stage/unknown or duplicate entries: ' + [...unexpected, ...duplicates].join(', '));
          const selectionScope = requested ? expected.filter((key) => key === issueNumbers[0] + '/' + requested) : expected;
          const missing = selectionScope.filter((key) => !selectedKeys.includes(key));
          if (requested && (selected.length !== 1 || selected[0].criterion !== requested ||
            issueNumbers.length !== 1 || missing.includes(issueNumbers[0] + '/' + requested))) {
            throw new Error('manual Case selection missing or wrong stage/profile: ' + issueNumbers[0] + '/' + requested);
          }
          if (issueNumbers.length > 0 && selected.length === 0) {
            throw new Error('no source-aligned Cases selected for associated Issues and stage ' + stage);
          }
          const coverage = { stage, expected, selected: selectedKeys, missing };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/case-coverage.json', JSON.stringify(coverage, null, 2));
          if (missing.length) {
            console.error('::warning::Missing stage-specific Case coverage: ' + missing.join(', '));
          }
          NODE
          count="$(jq 'length' "${RUNNER_TEMP}/selected-cases.json")"
          needs_browser="$(jq 'any(.needs_browser == true)' "${RUNNER_TEMP}/selected-cases.json")"
          cp "${RUNNER_TEMP}/selected-cases.json" "${RUNNER_TEMP}/acceptance-case-results/selection.json"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "needs_browser=${needs_browser}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Acceptance Case selection"
            echo
            echo "- Target: \`${{ steps.target.outputs.target_sha }}\`"
            echo "- Stage: \`${{ steps.target.outputs.stage }}\`"
            echo "- Cases: ${count}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.select.outputs.count != '0'
        with: { cache-workspaces: "workspace", cache-all-crates: "true" }

      - name: Install runtime dependencies
        if: steps.select.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build full-stack runtime
        if: steps.select.outputs.count != '0'
        run: |
          set -euo pipefail
          cd workspace/web
          npm ci
          npm run build
          cd ..
          cargo build -p nession-server -p nession-agent

      - name: Install browser verifier runtime
        if: steps.select.outputs.needs_browser == 'true'
        run: |
          set -euo pipefail
          cd workspace/e2e
          npm ci
          npx playwright install chromium --with-deps

      - name: Execute selected Cases
        id: cases
        if: steps.select.outputs.count != '0'
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          ACCEPTANCE_STAGE: ${{ steps.target.outputs.stage }}
        run: |
          set -uo pipefail
          failed=0
          while IFS=
          exit "${failed}"

      - name: Enforce Case coverage without suppressing executed Case evidence
        if: always() && steps.select.outcome == 'success'
        run: |
          set -euo pipefail
          missing="$(jq '.missing | length' "${RUNNER_TEMP}/case-coverage.json")"
          echo "Missing eligible SC Cases: ${missing}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${missing}" -gt 0 ]]; then
            jq -r '.missing[]' "${RUNNER_TEMP}/case-coverage.json" >&2
            echo "::error::Missing Issue/SC Case coverage remains Pending; fix Cases before green Acceptance"
            exit 1
          fi

      - name: Upload compact Case results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-case-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-case-results/
          if-no-files-found: error
          retention-days: 90

      - name: Upload large verifier evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.needs_browser == 'true'
        with:
          name: acceptance-case-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/acceptance/verifiers/test-results/
            workspace/e2e/test-results/
          if-no-files-found: warn
          retention-days: 90
\t' read -r issue criterion profile; do
            output="${RUNNER_TEMP}/acceptance-case-results/${issue}-${criterion}.case.json"
            # Use the same canonical E2E CLI as Regression/Scenario/Smoke.
            # Trusted Issue discovery, selection and ingestion remain separate,
            # and the CLI rejects mismatched exact SHA or unknown profiles.
            node workspace/e2e/run acceptance \
              --issue-json "${RUNNER_TEMP}/acceptance-contracts/${issue}.json" \
              --issue "${issue}" \
              --sc "${criterion}" \
              --stage "${ACCEPTANCE_STAGE}" \
              --sha "${TARGET_SHA}" \
              --profile "${profile}" \
              --output "${output}" || failed=1
          done < <(jq -r '.[] | [.issue, .criterion, .runtime] | @tsv' "${RUNNER_TEMP}/selected-cases.json")
          exit "${failed}"

      - name: Enforce Case coverage without suppressing executed Case evidence
        if: always() && steps.select.outcome == 'success'
        run: |
          set -euo pipefail
          missing="$(jq '.missing | length' "${RUNNER_TEMP}/case-coverage.json")"
          echo "Missing eligible SC Cases: ${missing}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${missing}" -gt 0 ]]; then
            jq -r '.missing[]' "${RUNNER_TEMP}/case-coverage.json" >&2
            echo "::error::Missing Issue/SC Case coverage remains Pending; fix Cases before green Acceptance"
            exit 1
          fi

      - name: Upload compact Case results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-case-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-case-results/
          if-no-files-found: error
          retention-days: 90

      - name: Upload large verifier evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.needs_browser == 'true'
        with:
          name: acceptance-case-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/acceptance/verifiers/test-results/
            workspace/e2e/test-results/
          if-no-files-found: warn
          retention-days: 90
