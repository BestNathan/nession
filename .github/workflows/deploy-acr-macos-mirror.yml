name: Deploy / ACR Mirror (hs-mac)
# #3832: manually benchmark OCI registry transport on an isolated Mac runner.
# Not a Staging rollout source: no GitOps, provenance or Identity consumer.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full 40-character SHA of an authenticated successful Staging GHCR release'
        required: true
        type: string
      image:
        description: 'OCI image role to mirror (or all four roles)'
        required: true
        type: choice
        default: all
        options:
          - all
          - server
          - agent
          - mcp
          - ui
      max_concurrent_images:
        description: 'Maximum simultaneous image roles (architecture/Blob copy is owned by regctl)'
        required: true
        type: choice
        default: '2'
        options:
          - '1'
          - '2'
          - '4'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-acr-mac-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  mirror:
    # #3861: source authentication and OCI copy execute on the same native Mac.
    # The gate is evaluated before this trusted-main checkout or any credentials.
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, hs-mac]
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Add Homebrew tool paths for launchd runners
        shell: bash
        run: |
          echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
          echo '/usr/local/bin' >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Fail closed before the step that receives ACR credentials.
      # The verifier uses the original authenticated Staging Release Run and
      # emits pinned source SHA / Run / Attempt as same-job step outputs.
      - name: Authenticate original Staging GHCR multiarch release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          node scripts/ci/verify-staging-ghcr-source.mjs verify-mirror "$REQUESTED_SOURCE_SHA" "$REQUESTED_IMAGE"
      - name: Verify native macOS mirror prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          command -v regctl
          regctl version
          command -v node
      - name: Mirror roles with native platform selection and phase timing
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          MIRROR_RESULT_DIR: ${{ runner.temp }}/acr-mac-mirror
          SELECTED_IMAGE: ${{ inputs.image }}
          MIRROR_MAX_CONCURRENT_IMAGES: ${{ inputs.max_concurrent_images }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
        run: |
          node scripts/ci/mirror-acr-macos.mjs \
            "$SOURCE_SHA" "$SELECTED_IMAGE" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"
      - name: Retain exact-run timing JSON even when the copy fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acr-mac-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acr-mac-mirror/result.json
          retention-days: 30
          if-no-files-found: warn
