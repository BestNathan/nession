name: Acceptance Case Ingest

on:
  workflow_run:
    workflows: ["Acceptance Cases"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: acceptance-results-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted ingestion tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Self-test trusted ingestion
        working-directory: trusted
        run: |
          node scripts/requirement-acceptance.mjs self-test
          node scripts/acceptance-executor.mjs self-test
          node scripts/acceptance-case-ingest.mjs self-test

      - name: Download source Case results
        uses: actions/download-artifact@v4
        with:
          name: acceptance-case-results-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: incoming
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and prepare immutable records
        id: records
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/persisted-records.txt"
          : > "${RUNNER_TEMP}/records-to-ingest.tsv"
          count=0
          while IFS= read -r file; do
            # Never create a persistent path until the GitHub-owned source run
            # identity and immutable source Case tree have been attested.
            durable_path="$(node trusted/scripts/acceptance-case-ingest.mjs attest "${file}" "${GITHUB_EVENT_PATH}")"
            echo "${file}"$'\t'"${durable_path}" >> "${RUNNER_TEMP}/records-to-ingest.tsv"
            count=$((count + 1))
          done < <(find incoming -type f -name '*.case.json' -print | sort)
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Initialize append-only results branch
        if: steps.records.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir results-repo
          git -C results-repo init
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C results-repo ls-remote --exit-code --heads origin acceptance-results >/dev/null 2>&1; then
            git -C results-repo fetch --depth=1 origin acceptance-results
            git -C results-repo checkout -B acceptance-results FETCH_HEAD
          else
            git -C results-repo checkout --orphan acceptance-results
            cat > results-repo/README.md <<'EOF'
          # Nession Acceptance Results

          This orphan branch stores compact immutable Acceptance Case records.
          Product source and verifier code live on normal product branches; large
          traces/screenshots/logs remain GitHub Actions artifacts linked by each record.

          Files under `runs/` are append-only. Never rewrite or force-push this branch.
          EOF
          fi

      - name: Append compact immutable records
        if: steps.records.outputs.count != '0'
        env:
          SOURCE_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r source durable_path; do
            destination="results-repo/${durable_path}"
            if [[ -e "${destination}" ]]; then
              echo "immutable acceptance record already exists: ${durable_path}" >&2
              exit 1
            fi
            mkdir -p "$(dirname "${destination}")"
            node trusted/scripts/acceptance-case-ingest.mjs enrich \
              "${source}" "${destination}" "${SOURCE_WORKFLOW_URL}" "${durable_path}" "${GITHUB_EVENT_PATH}"
            node trusted/scripts/acceptance-case-ingest.mjs validate "${destination}" >/dev/null
            printf '%s\n' "${durable_path}" >> "${RUNNER_TEMP}/persisted-records.txt"
          done < "${RUNNER_TEMP}/records-to-ingest.tsv"

          git -C results-repo add README.md runs/
          git -C results-repo commit -m "acceptance: ingest run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}"
          git -C results-repo push origin acceptance-results

      - name: Project only currently eligible results
        if: steps.records.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r durable_path; do
            echo "Projecting ${durable_path}"
            if ! node trusted/scripts/acceptance-case-ingest.mjs apply "results-repo/${durable_path}"; then
              echo "::error::Projection failed for ${durable_path}"
              failed=1
            fi
          done < "${RUNNER_TEMP}/persisted-records.txt"
          exit "${failed}"

      - name: Summarize ingestion
        if: always()
        run: |
          {
            echo "## Acceptance Case ingestion"
            echo
            echo "- Source run: ${{ github.event.workflow_run.html_url }}"
            echo "- Source conclusion: \`${{ github.event.workflow_run.conclusion }}\`"
            echo "- Compact records discovered: \`${{ steps.records.outputs.count || '0' }}\`"
            echo "- Durable branch: \`acceptance-results\`"
          } >> "${GITHUB_STEP_SUMMARY}"
\t' read -r source durable_path; do
            destination="results-repo/${durable_path}"
            if [[ -e "${destination}" ]]; then
              echo "immutable acceptance record already exists: ${durable_path}" >&2
              exit 1
            fi
            mkdir -p "$(dirname "${destination}")"
            node trusted/scripts/acceptance-case-ingest.mjs enrich \
              "${source}" "${destination}" "${SOURCE_WORKFLOW_URL}" "${durable_path}"
            node trusted/scripts/acceptance-case-ingest.mjs validate "${destination}" >/dev/null
            printf '%s\n' "${durable_path}" >> "${RUNNER_TEMP}/persisted-records.txt"
          done < "${RUNNER_TEMP}/records-to-ingest.tsv"

          git -C results-repo add README.md runs/
          git -C results-repo commit -m "acceptance: ingest run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}"
          git -C results-repo push origin acceptance-results

      - name: Project only currently eligible results
        if: steps.records.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r durable_path; do
            echo "Projecting ${durable_path}"
            if ! node trusted/scripts/acceptance-case-ingest.mjs apply "results-repo/${durable_path}"; then
              echo "::error::Projection failed for ${durable_path}"
              failed=1
            fi
          done < "${RUNNER_TEMP}/persisted-records.txt"
          exit "${failed}"

      - name: Summarize ingestion
        if: always()
        run: |
          {
            echo "## Acceptance Case ingestion"
            echo
            echo "- Source run: ${{ github.event.workflow_run.html_url }}"
            echo "- Source conclusion: \`${{ github.event.workflow_run.conclusion }}\`"
            echo "- Compact records discovered: \`${{ steps.records.outputs.count || '0' }}\`"
            echo "- Durable branch: \`acceptance-results\`"
          } >> "${GITHUB_STEP_SUMMARY}"
