name: E2E Scenario Smoke

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-scenario-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  terminal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTC_WRAPPER: ""
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: cd e2e && npm ci && npx playwright install chromium --with-deps
      - run: cd web && npm ci && npm run build
      - run: cargo build -p nession-server -p nession-agent
      - name: Run scenario contract self-test
        run: |
          ./gates/run terminal-attach-resume-selftest acceptance-runtime-contract
      - name: Run actual terminal replay scenario
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ./e2e/run scenario terminal-attach-resume --sha "${sha}" --repeat 2 --output "${RUNNER_TEMP}/nession-scenarios"
      - name: Validate real repeated observations and compare without verdict
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const dir = process.env.RUNNER_TEMP + '/nession-scenarios';
          const names = fs.readdirSync(dir).filter(file => /^scenario-.*\.json$/.test(file));
          if (names.length !== 2) throw new Error('expected exactly two independently executed Scenario records');
          const runs = names.map(name => ({ name, data: JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8')) }))
            .sort((a,b) => a.data.run_index - b.data.run_index);
          assert.deepEqual(runs.map(r=>r.data.run_index), [1,2]);
          const target = execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim();
          for (const {data} of runs) {
            assert.equal(data.target_sha, target, 'record target differs from checked-out SHA');
            assert.equal(data.status, 'Completed');
            assert.equal(data.evaluation, null);
            assert.ok(data.observation_count >= 2);
            assert.ok(data.observations.some(o => o.stage === 'before-reload'));
            assert.ok(data.observations.some(o => o.stage === 'after-reload'));
          }
          const compare = execFileSync(process.execPath, [
            './e2e/run', 'compare', ...runs.map(r => path.join(dir,r.name))
          ], {encoding:'utf8'});
          const result = JSON.parse(compare);
          assert.equal(result.status, 'Completed');
          assert.equal(result.evaluation, null, 'observations cannot claim Acceptance Pass');
          assert.equal(result.config_comparable, true);
          assert.match(result.limitations, /nondeterministic/);
          assert.equal(result.left.sample_count, runs[0].data.observation_count);
          assert.equal(result.right.sample_count, runs[1].data.observation_count);
          fs.writeFileSync(path.join(dir,'comparison.json'), JSON.stringify(result,null,2)+'\n');
          console.log('Two real exact-SHA repetitions compared without evaluative verdict');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-terminal-scenario-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nession-scenarios/
          if-no-files-found: warn
          retention-days: 14
