name: E2E / Tests

# Repository Cargo config enables a local-only rustc wrapper. CI deliberately
# bypasses it and keeps using setup-rust-toolchain / rust-cache. This preserves
# the measured #126 decision: sccache on GHA had a 0–3% hit rate and competed
# for the Actions cache quota.
permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  RUSTC_WRAPPER: ""


on:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: 'Regenerate canonical visual baselines with --update-snapshots=all (download artifact and commit PNGs)'
        type: boolean
        default: false
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]

# One run per branch/PR. Superseded runs are useless, so cancel them.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # PLAYWRIGHT_BROWSERS_PATH applies to BOTH install and test — keeps them
    # pointed at the same directory (and the same one the cache restores to).
    # NESSION_TARGET_SHA binds the shared Runtime Harness to the exact checkout
    # that this workflow is verifying.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      NESSION_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout trusted E2E planning code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      # ── Rust toolchain ────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2

      # ── Node ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Detect import-safe trusted Issue E2E support
        if: github.event_name == 'pull_request'
        id: selected-capability
        shell: bash
        run: |
          set -euo pipefail
          # A version/file-presence check is insufficient: importing the
          # planner/reporter may execute a CLI and crash before any test runs.
          # Missing or broken trusted selection MUST expand to full E2E,
          # never produce an empty/successful selected verification artifact.
          if [[ -f trusted/scripts/issue-e2e-selection-entry.mjs &&
                -f trusted/scripts/issue-e2e-collect.mjs &&
                -f trusted/scripts/issue-e2e-source-attestation.mjs ]] &&
             node --input-type=module -e '
               await import("./trusted/scripts/issue-e2e-selection-entry.mjs");
               await import("./trusted/scripts/issue-e2e-collect.mjs");
               await import("./trusted/scripts/issue-e2e-source-attestation.mjs");
             ' >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Trusted selected-E2E modules are not import-safe; expanding to full browser regression"
          fi

      - name: Resolve linked Issue E2E obligations
        if: github.event_name == 'pull_request' && steps.selected-capability.outputs.available == 'true'
        id: selection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-e2e"
          node --input-type=module -e '
            import fs from "node:fs";
            import { parsePreMergeIssueNumbers } from "./trusted/scripts/requirement-acceptance.mjs";
            const pr=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH)).pull_request;
            console.log(JSON.stringify(parsePreMergeIssueNumbers(pr.body,"BestNathan","nession",pr.title)));
          ' > "$RUNNER_TEMP/issue-e2e/refs.json"
          echo '[]' > "$RUNNER_TEMP/issue-e2e/issues.json"
          mkdir -p "$RUNNER_TEMP/issue-e2e/contracts"
          jq -r '.[]' "$RUNNER_TEMP/issue-e2e/refs.json" | while read -r issue; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > "$RUNNER_TEMP/issue-e2e/contracts/$issue.json"
          done
          if compgen -G "$RUNNER_TEMP/issue-e2e/contracts/*.json" > /dev/null; then
            jq -s '.' "$RUNNER_TEMP"/issue-e2e/contracts/*.json > "$RUNNER_TEMP/issue-e2e/issues.json"
          fi
          node trusted/scripts/issue-e2e-selection-entry.mjs plan \
            "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/issue-e2e/issues.json" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/issue-e2e/plan.json"
          echo "mode=$(jq -r '.mode' "$RUNNER_TEMP/issue-e2e/plan.json")" >> "$GITHUB_OUTPUT"

      # tmux is required by nession-agent to create sessions. The runner
      # image may or may not have it pre-installed; install it explicitly.
      - run: sudo apt-get update && sudo apt-get install -y tmux

      # Restore browser cache BEFORE install — a cache hit means the install
      # below skips the download entirely.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # Install Playwright + Chromium only (skip Firefox/WebKit).
      - run: |
          cd e2e
          npm ci
          npx playwright install chromium --with-deps

      # ── Build web (vite preview serves this) ─────────────────────────
      - run: cd web && npm ci && npm run build

      # Pre-build Rust binaries so the webServer startup is fast and the
      # three `cargo run` invocations don't each pay the compile cost.
      # (cargo's flock still serialises them; this is just the first hit.)
      - run: cargo build -p nession-server -p nession-agent

      # #759: browser contract enforcement uses the same canonical gate as
      # manual work and hooks. The browser profile owns the contract/matrix
      # subset; this workflow does not duplicate that list.
      - name: Run canonical browser design gate
        env:
          CI: true
        run: ./gates/run design-system-browser

      # ── Run E2E ───────────────────────────────────────────────────────
      - name: Run E2E tests
        env:
          CI: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_visual_snapshots }}" = "true" ]; then
            cd e2e
            # `=all` is required, not optional. A bare `--update-snapshots` means
            # mode "changed", which still compares through maxDiffPixelRatio and
            # only rewrites snapshots that FAIL tolerance — a chrome change small
            # enough to sit inside the ratio is silently left alone, and the run
            # logs nothing to say so. That is how the Workspace baselines stayed
            # stale through the contextual-bar change (#714). The ratio is far
            # tighter since #1038, which narrows this window but does not close
            # it: any drift under the current value is still skipped in silence.
            ./run test --suite fixture-visual --update-snapshots=all
          elif [[ "${{ github.event_name }}" == 'pull_request' && "${{ steps.selected-capability.outputs.available }}" == 'true' ]]; then
            plan="$RUNNER_TEMP/issue-e2e/plan.json"
            mode="$(jq -r '.mode' "$plan")"
            case "$mode" in
              selected)
                mapfile -t ids < <(jq -r '.selected[].id' "$plan")
                (( ${#ids[@]} > 0 )) || exit 1
                args=()
                for id in "${ids[@]}"; do args+=(--id "$id"); done
                PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/e2e/playwright-selected.json" \
                  CI=true ./e2e/run test "${args[@]}" ;;
              not-required) echo 'Explicit Issue none; no browser test required for this PR' ;;
              full) ./gates/run e2e-playwright ;;
              *) echo "::error::Invalid Issue E2E mode"; exit 1 ;;
            esac
          else
            ./gates/run e2e-playwright
          fi

      - name: Normalize selected per-file results even on failure
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && steps.selected-capability.outputs.available == 'true' && steps.selection.outcome == 'success' }}
        shell: bash
        run: |
          node trusted/scripts/issue-e2e-collect.mjs collect \
            "$RUNNER_TEMP/issue-e2e/plan.json" \
            "$GITHUB_WORKSPACE/e2e/playwright-selected.json" \
            "$RUNNER_TEMP/issue-e2e/results.json"
          if [[ -f "$GITHUB_WORKSPACE/e2e/playwright-selected.json" ]]; then
            cp "$GITHUB_WORKSPACE/e2e/playwright-selected.json" "$RUNNER_TEMP/issue-e2e/playwright.json"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && steps.selection.outcome == 'success' }}
        with:
          name: issue-e2e-verification
          path: ${{ runner.temp }}/issue-e2e/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce authenticated selected-E2E execution result
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.selection.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(jq -r '.mode' "$RUNNER_TEMP/issue-e2e/plan.json")" == 'selected' ]]; then
            jq -e '.status == "Pass"' "$RUNNER_TEMP/issue-e2e/results.json" > /dev/null ||
              { echo "::error::At least one required E2E ID is not proven Pass"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots == true
        with:
          name: canonical-visual-baselines
          path: e2e/tests/browser/__snapshots__/
          retention-days: 7

      # ── Report ────────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-snapshot-diffs
          path: |
            e2e/test-results/
            e2e/tests/browser/__snapshots__/
          retention-days: 14
