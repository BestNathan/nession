name: Acceptance / Verified Issue Stage

# Owner-only manual verification for the controlled #2010 staged requirement.
# The former issue_comment subscription created an Actions Run on every repo
# Issue comment, even though only one exact #2010 owner command was accepted.
# Use Actions > Acceptance / Verified Issue Stage > Run workflow on main.
# The shared read-only Agent and deterministic Issue updater remain the ONLY
# authority to project Success Criteria; a dispatch is not a verdict.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: verified-issue-stage-${{ github.event.issue.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  accept:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'BestNathan'
    uses: ./.github/workflows/agent-sc-acceptance.yml
    with:
      issue_number: '2010'
      stage: staging
      provider: cursor
      target_ref: ${{ github.sha }}
      deployment: controlled-live-1997
    secrets: inherit
