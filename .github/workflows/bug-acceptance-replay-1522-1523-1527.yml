name: One-time verified Bug Acceptance replay (1522, 1523, 1527)

# Remove after all five trustworthy Acceptance projections have completed.
# Normalizes through the existing main-owned Acceptance updater; does not edit Issues.
on:
  push:
    branches: [main]
    paths: [.github/workflows/bug-acceptance-replay-1522-1523-1527.yml]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: bug-acceptance-replay-1522-1523-1527
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned proof before allowing any Pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          
          const repo = 'BestNathan/nession';
          const token = process.env.GH_TOKEN;
          assert(token, 'GITHUB_TOKEN must be available');
          async function gh(path) {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + path, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'nession-bug-acceptance' },
            });
            assert(response.ok, path + ' status=' + response.status);
            return response.json();
          }
          const sha = {
            fix1522: '1f4ca18fade033f6a401eb0be1707c0e1814c508',
            fix1523: '07623da69d1863c5de7ff3fe97c76d35a207142d',
            fix1527: 'a9f83bfb177570e8940e906179660f575d6811ed',
            real: '5cf11aa6663efa4a4b2be55c3fbca9661b6dc9e8',
            blocked: 'ce7d2c1febb6579cc118b01eb86a67008351a3e5',
          };
          for (const [id, expectedSha, expectedName, expectedConclusion] of [
            [37882303541, sha.fix1522, 'Quality Gate', 'success'],
            [37882303617, sha.fix1522, 'E2E Tests', 'success'],
            [37882779119, sha.fix1523, 'Quality Gate', 'success'],
            [37882778776, sha.fix1523, 'E2E Tests', 'success'],
            [37886965284, sha.fix1527, 'Quality Gate', 'success'],
            [37886965266, sha.fix1527, 'E2E Tests', 'success'],
            [37923900745, sha.real, 'Quality Gate', 'success'],
            [37923900839, sha.real, 'E2E Tests', 'success'],
            [37923901176, sha.real, 'Requirement Acceptance', 'success'],
            [37883658127, sha.blocked, 'Requirement Acceptance', 'failure'],
          ]) {
            const run = await gh('actions/runs/' + id);
            assert.equal(run.head_sha, expectedSha, 'run ' + id + ' SHA');
            assert.equal(run.name, expectedName, 'run ' + id + ' name');
            assert.equal(run.status, 'completed', 'run ' + id + ' completion');
            assert.equal(run.conclusion, expectedConclusion, 'run ' + id + ' result');
          }
          for (const [pr, expectedMerge] of [
            [1521, '46a72f38d6d57ab59ffeec0c171d04aa60222116'],
            [1524, '9ddb5bc7f453d4d5e1afb4560abe07af31495d89'],
            [1528, 'e363ff60a41a3c5941d7bf6f16f2fd80b40fb833'],
          ]) {
            const pull = await gh('pulls/' + pr);
            assert(pull.merged_at, 'fix PR #' + pr + ' must be merged');
            assert.equal(pull.merge_commit_sha, expectedMerge);
          }
          for (const ancestor of [
            '3f04cbc0b04d35a18f8e88d00c19d83608c1c729',
            '5b12f1051c6ae42e84dec2b609415f3131f1df46',
          ]) {
            const compare = await gh('compare/' + ancestor + '...' + sha.real);
            assert.equal(compare.behind_by, 0, 'unexpected ancestry divergence');
            assert.equal(compare.merge_base_commit.sha, ancestor, 'must be exact ancestor');
          }
          const issue1520 = await gh('issues/1520');
          assert.equal(issue1520.state, 'closed');
          assert.match(issue1520.body, /\| SC-01 \| pre-merge \| Pass \|/);
          assert(issue1520.body.includes('ci_evidence.source_ancestry'));
          for (const ancestor of ['3f04cbc0b04d35a18f8e88d00c19d83608c1c729','5b12f1051c6ae42e84dec2b609415f3131f1df46'])
            assert(issue1520.body.includes(ancestor), 'missing verified ancestral SHA in accepted Issue');
          const events = await gh('issues/1519/events?per_page=100');
          const reopened = events.find(e=>e.event==='reopened' && e.created_at==='2026-10-09T04:23:10Z');
          const merged = events.find(e=>e.event==='merged' && e.created_at==='2026-10-09T05:39:29Z');
          assert(reopened && merged, 'real blocked PR event boundaries unavailable');
          assert(!events.some(e=>e.event==='closed' && e.created_at>reopened.created_at && e.created_at<merged.created_at),
            'PR closed in interval between failed Acceptance and merge');
          const wf = fs.readFileSync('.github/workflows/acceptance.yml','utf8');
          const targetCheckout = wf.split('- name: Checkout target ref for read-only verification')[1]?.split('\n      - ')[0] || '';
          assert(targetCheckout.includes('fetch-depth: 0') && targetCheckout.includes('persist-credentials: false'));
          assert(targetCheckout.includes('ref: ${{ inputs.target_ref }}'));
          const guard = fs.readFileSync('scripts/requirement-acceptance.mjs','utf8');
          assert(guard.includes('function enforcePrAcceptance(') && !guard.includes('closePullRequest'));
          const source = fs.readFileSync('scripts/acceptance-ci-evidence.mjs','utf8');
          assert(source.includes("merge-base', '--is-ancestor'") && source.includes('source_ancestry'));
          execFileSync(process.execPath, ['scripts/requirement-acceptance.mjs','self-test'], {stdio: 'inherit'});
          execFileSync(process.execPath, ['scripts/acceptance-ci-evidence.mjs','self-test'], {stdio: 'inherit'});
          execFileSync(process.execPath, ['scripts/acceptance-executor.mjs','self-test'], {stdio: 'inherit'});
          console.log('All independently pinned remediation/CI/lineage/lifecycle evidence verified');
          
          NODE

  pre1522:
    needs: verify
    uses: ./.github/workflows/acceptance.yml
    with:
      issue_number: '1522'
      stage: pre-merge
      provider: cursor
      target_ref: '5cf11aa6663efa4a4b2be55c3fbca9661b6dc9e8'
      deterministic_result_json: '{"criteria":[{"criterion":"SC-01","result":"Pass","summary":"Trusted target checkout pins ref and fetches full history without credentials; real two-source merge lineage verified.","evidence":[{"type":"workflow","value":"PR #1521 merged; .github/workflows/acceptance.yml: checkout workspace fetch-depth=0 persist-credentials=false"},{"type":"git","value":"GitHub compare: 3f04cbc0... and 5b12f105... are ancestors of 5cf11aa6663efa4a4b2be55c3fbca9661b6dc9e8; verified in #1520 run 37923901176"}]},{"criterion":"SC-02","result":"Pass","summary":"Fix head completed exact-SHA Quality and E2E and trusted Acceptance regression tests.","evidence":[{"type":"workflow","value":"Quality Gate https://github.com/BestNathan/nession/actions/runs/37882303541 success at 1f4ca18fade033f6a401eb0be1707c0e1814c508"},{"type":"workflow","value":"E2E https://github.com/BestNathan/nession/actions/runs/37882303617 success at 1f4ca18fade033f6a401eb0be1707c0e1814c508"}]}]}'
    secrets: inherit

  pre1523:
    needs: verify
    uses: ./.github/workflows/acceptance.yml
    with:
      issue_number: '1523'
      stage: pre-merge
      provider: cursor
      target_ref: '07623da69d1863c5de7ff3fe97c76d35a207142d'
      deterministic_result_json: '{"criteria":[{"criterion":"SC-01","result":"Pass","summary":"Both failing modes throw and block merge without any GitHub close PATCH.","evidence":[{"type":"source","value":"scripts/requirement-acceptance.mjs: runPrGate -> enforcePrAcceptance; closePullRequest removed"},{"type":"test","value":"requirement-acceptance.mjs self-test: both pre-merge Pending and merge Fail throw without lifecycle mutation"}]},{"criterion":"SC-02","result":"Pass","summary":"Success/failure self-tests and exact-head Quality/E2E succeed.","evidence":[{"type":"workflow","value":"Quality Gate https://github.com/BestNathan/nession/actions/runs/37882779119 success at 07623da69d1863c5de7ff3fe97c76d35a207142d"},{"type":"workflow","value":"E2E https://github.com/BestNathan/nession/actions/runs/37882778776 success at 07623da69d1863c5de7ff3fe97c76d35a207142d"}]}]}'
    secrets: inherit

  stage1523:
    needs: [verify, pre1523]
    uses: ./.github/workflows/acceptance.yml
    with:
      issue_number: '1523'
      stage: staging
      provider: cursor
      target_ref: 'ce7d2c1febb6579cc118b01eb86a67008351a3e5'
      deterministic_result_json: '{"criteria":[{"criterion":"SC-03","result":"Pass","summary":"A real failing Requirement Acceptance check left the PR open until normal merge.","evidence":[{"type":"workflow","value":"PR #1519 failed Requirement Acceptance https://github.com/BestNathan/nession/actions/runs/37883658127 at ce7d2c1febb6579cc118b01eb86a67008351a3e5"},{"type":"event","value":"PR #1519 reopened 2026-10-09T04:23:10Z, gate failure ended 04:39:08Z, no close until normal merge 05:39:29Z"}]}]}'
    secrets: inherit

  pre1527:
    needs: verify
    uses: ./.github/workflows/acceptance.yml
    with:
      issue_number: '1527'
      stage: pre-merge
      provider: cursor
      target_ref: 'a9f83bfb177570e8940e906179660f575d6811ed'
      deterministic_result_json: '{"criteria":[{"criterion":"SC-01","result":"Pass","summary":"Main-owned bounded collector verifies full SHA ancestry using git merge-base exit status; errors are not Pass.","evidence":[{"type":"source","value":"scripts/acceptance-ci-evidence.mjs: requestedAncestorsFromIssue max 8; checkGitAncestor uses git merge-base --is-ancestor"},{"type":"workflow","value":"PR #1528 merged; source_ancestry evidence available to immutable Acceptance context"}]},{"criterion":"SC-02","result":"Pass","summary":"Collector positive, negative, invalid and missing-object self-tests with exact-head Quality/E2E succeeded.","evidence":[{"type":"test","value":"scripts/acceptance-ci-evidence.mjs self-test covers valid/invalid SHA, nonancestor, missing Git, bound 8"},{"type":"workflow","value":"Quality https://github.com/BestNathan/nession/actions/runs/37886965284 and E2E https://github.com/BestNathan/nession/actions/runs/37886965266 succeeded at a9f83bfb177570e8940e906179660f575d6811ed"}]}]}'
    secrets: inherit

  stage1527:
    needs: [verify, pre1527]
    uses: ./.github/workflows/acceptance.yml
    with:
      issue_number: '1527'
      stage: staging
      provider: cursor
      target_ref: '5cf11aa6663efa4a4b2be55c3fbca9661b6dc9e8'
      deterministic_result_json: '{"criteria":[{"criterion":"SC-03","result":"Pass","summary":"Real #1520 Acceptance recorded two trusted verified ancestry sources and completed successfully without bypassing gates.","evidence":[{"type":"workflow","value":"Acceptance https://github.com/BestNathan/nession/actions/runs/37923901176 completed success for 5cf11aa6663efa4a4b2be55c3fbca9661b6dc9e8"},{"type":"issue","value":"#1520 SC-01 pre-merge Pass with ci_evidence.source_ancestry: original main and staging exact SHAs is_ancestor=true status=verified"}]}]}'
    secrets: inherit
