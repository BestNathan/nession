name: E2E / Full Failure Intake
on:
  workflow_run:
    workflows: ["E2E / Full Regression"]
    types: [completed]
permissions:
  actions: write
  contents: write
concurrency:
  group: acceptance-results-ingest
  cancel-in-progress: false
jobs:
  ingest:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/e2e-full-regression.yml' &&
      github.event.workflow_run.name == 'E2E / Full Regression' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted Main intake code only
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run positive and negative intake contract fixtures
        run: node trusted/scripts/e2e-full-failure-ingest.mjs self-test
      - name: Fetch exact Run, workflow, attempt jobs and artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full-failure-intake"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/full-failure-intake/run.json"
          workflow_id="$(jq -er '.workflow_id' "$RUNNER_TEMP/full-failure-intake/run.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/full-failure-intake/workflow.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/full-failure-intake/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/full-failure-intake/artifacts.json"
          expected="full-regression-$SOURCE_RUN_ID-$SOURCE_ATTEMPT"
          artifact_id="$(jq -er --arg name "$expected" --argjson run "$SOURCE_RUN_ID" '[.artifacts[] | select(.name==$name and .expired==false and .workflow_run.id==$run)] | if length == 1 then .[0].id else empty end' "$RUNNER_TEMP/full-failure-intake/artifacts.json")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/full-failure-intake/artifact.zip"
          archive_sha="$(sha256sum "$RUNNER_TEMP/full-failure-intake/artifact.zip" | cut -d' ' -f1)"
          mapfile -t entries < <(unzip -Z1 "$RUNNER_TEMP/full-failure-intake/artifact.zip" | grep -E '(^|/)full-regression-failure-candidate\.json$' || true)
          [[ "${#entries[@]}" -eq 1 ]] || { echo "::error::Missing or duplicate candidate in exact artifact" >&2; exit 1; }
          entry="${entries[0]}"
          [[ "$entry" != /* && "$entry" != *".."* ]]
          unzip -p "$RUNNER_TEMP/full-failure-intake/artifact.zip" "$entry" > "$RUNNER_TEMP/full-failure-intake/candidate.json"
          jq -n --slurpfile event "$GITHUB_EVENT_PATH" --slurpfile run "$RUNNER_TEMP/full-failure-intake/run.json" --slurpfile workflow "$RUNNER_TEMP/full-failure-intake/workflow.json" --slurpfile jobs "$RUNNER_TEMP/full-failure-intake/jobs.json" --slurpfile artifacts "$RUNNER_TEMP/full-failure-intake/artifacts.json" --slurpfile candidate "$RUNNER_TEMP/full-failure-intake/candidate.json" --arg archiveSha "$archive_sha" '{event:$event[0],run:$run[0],workflow:$workflow[0],jobs:$jobs[0],artifacts:$artifacts[0],candidate:$candidate[0],archiveSha256:$archiveSha}' > "$RUNNER_TEMP/full-failure-intake/input.json"
      - name: Authenticate and create immutable observation records
        id: records
        run: |
          set -euo pipefail
          node trusted/scripts/e2e-full-failure-ingest.mjs verify-json "$RUNNER_TEMP/full-failure-intake/input.json" "$RUNNER_TEMP/full-failure-intake/records" > "$RUNNER_TEMP/full-failure-intake/paths.json"
          echo "record=$(jq -r .record "$RUNNER_TEMP/full-failure-intake/paths.json")" >> "$GITHUB_OUTPUT"
          echo "index=$(jq -r .index "$RUNNER_TEMP/full-failure-intake/paths.json")" >> "$GITHUB_OUTPUT"
      - name: Mint scoped Store writer App token
        if: (vars.RUN_STORE_WRITER_MODE == '' || vars.RUN_STORE_WRITER_MODE == 'app')
        id: store_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RUN_STORE_WRITER_APP_ID }}
          private-key: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write
      - name: Reject unrecognized writer mode or unavailable App token
        env:
          WRITER_MODE: ${{ vars.RUN_STORE_WRITER_MODE }}
          APP_TOKEN: ${{ steps.store_app.outputs.token }}
        run: |
          set -euo pipefail
          case "$WRITER_MODE" in
            legacy) ;;
            ''|app) [[ -n "$APP_TOKEN" ]] || { echo "::error::No App token; refuse legacy fallback" >&2; exit 1; } ;;
            *) echo "::error::Unsupported RUN_STORE_WRITER_MODE" >&2; exit 1 ;;
          esac
      - name: Append authenticated observation to canonical acceptance-results
        env:
          STORE_PUSH_TOKEN: ${{ vars.RUN_STORE_WRITER_MODE == 'legacy' && secrets.GITHUB_TOKEN || steps.store_app.outputs.token }}
          RECORD_PATH: ${{ steps.records.outputs.record }}
          INDEX_PATH: ${{ steps.records.outputs.index }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$STORE_PUSH_TOKEN" ]]
          case "$RECORD_PATH" in runs/*/full-regression/*-*.json) ;; *) echo "::error::Unsafe record path" >&2; exit 1 ;; esac
          case "$INDEX_PATH" in indexes/by-sha/*/full-regression/*-*.json) ;; *) echo "::error::Unsafe index path" >&2; exit 1 ;; esac
          mkdir results-repo
          git -C results-repo init
          git -C results-repo config user.name "github-actions[bot]"
          git -C results-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C results-repo remote add origin "https://x-access-token:$STORE_PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C results-repo fetch --depth=1 origin acceptance-results
          git -C results-repo checkout -B acceptance-results FETCH_HEAD
          for spec in "$RECORD_PATH:$RUNNER_TEMP/full-failure-intake/records/record.json" "$INDEX_PATH:$RUNNER_TEMP/full-failure-intake/records/index.json"; do
            dest="${spec%%:*}"; source="${spec#*:}"
            if [[ -e "results-repo/$dest" ]]; then
              cmp -s "$source" "results-repo/$dest" || { echo "::error::Immutable failure observation collision" >&2; exit 1; }
            else
              mkdir -p "results-repo/$(dirname "$dest")"
              cp "$source" "results-repo/$dest"
            fi
          done
          git -C results-repo add runs indexes
          if ! git -C results-repo diff --cached --quiet; then
            git -C results-repo commit -m "e2e: ingest failed Full Regression $SOURCE_RUN_ID attempt $SOURCE_ATTEMPT"
            node trusted/scripts/run-store-cas-push.mjs acceptance-results "$GITHUB_WORKSPACE/results-repo"
          fi
          echo "Authenticated failed Full Regression observation appended; no Agent dispatch or Pass issued." >> "$GITHUB_STEP_SUMMARY"
      - name: Mint scoped App token for durable Agent Store admission
        id: agent_store_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RUN_STORE_WRITER_APP_ID }}
          private-key: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write
      - name: CAS-publish per-ID admission observations to existing agent-store
        env:
          STORE_PUSH_TOKEN: ${{ steps.agent_store_app.outputs.token }}
          RECORD_PATH: ${{ steps.records.outputs.record }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$STORE_PUSH_TOKEN" ]]
          case "$RECORD_PATH" in runs/*/full-regression/*-*.json) ;; *) echo "::error::Unsafe record path" >&2; exit 1 ;; esac
          mkdir agent-store-repo
          git -C agent-store-repo init
          git -C agent-store-repo remote add origin "https://x-access-token:$STORE_PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -C agent-store-repo fetch --depth=1 origin agent-store
          git -C agent-store-repo checkout -B agent-store FETCH_HEAD
          node trusted/scripts/e2e-failure-admission-ingest.mjs self-test
          node trusted/scripts/e2e-failure-admission-ingest.mjs ingest \
            "$RUNNER_TEMP/full-failure-intake/records/record.json" \
            "$GITHUB_WORKSPACE/agent-store-repo" \
            "$RUNNER_TEMP/full-failure-intake/admission-result.json" \
            | tee "$RUNNER_TEMP/full-failure-intake/admission-summary.json"
          git -C agent-store-repo add -A
          node trusted/scripts/run-store-integrity.mjs staged agent-store "$GITHUB_WORKSPACE/agent-store-repo"
          if ! git -C agent-store-repo diff --cached --quiet; then
            git -C agent-store-repo config user.name "nession-store-writer"
            git -C agent-store-repo config user.email "nession-store-writer@users.noreply.github.com"
            git -C agent-store-repo commit -m "e2e: admit authenticated per-ID failure observations $SOURCE_RUN_ID attempt $SOURCE_ATTEMPT"
            node trusted/scripts/run-store-cas-push.mjs agent-store "$GITHUB_WORKSPACE/agent-store-repo"
          fi
          jq -e '.dispatch_allowed == false and .agent_invocations == 0 and .bug_writes == 0' \
            "$RUNNER_TEMP/full-failure-intake/admission-result.json" >/dev/null
          echo "Per-ID CAS admission projection published; dispatching one analysis per newly claimed fingerprint." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch one analysis per newly claimed fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_PUSH_TOKEN: ${{ steps.agent_store_app.outputs.token }}
          STORE: ${{ github.workspace }}/agent-store-repo
          ADMISSION_RESULT: ${{ runner.temp }}/full-failure-intake/admission-result.json
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$STORE_PUSH_TOKEN" ]]
          dispatch=trusted/scripts/e2e-failure-analysis-dispatch.mjs
          gh run list --repo "$GITHUB_REPOSITORY" --workflow agent-e2e-failure-analysis.yml             --limit 20 --json databaseId,attempt,displayTitle,event,status             > "$RUNNER_TEMP/analysis-runs.json"
          while IFS= read -r fingerprint; do
            [[ -n "$fingerprint" ]] || continue
            node "$dispatch" plan "$STORE" "$fingerprint" "$RUNNER_TEMP/plan.json"
            action="$(jq -r .action "$RUNNER_TEMP/plan.json")"
            if [[ "$action" == RECONCILE ]]; then
              node "$dispatch" reconcile "$STORE" "$fingerprint"                 "$RUNNER_TEMP/analysis-runs.json" "$RUNNER_TEMP/plan.json"
              action="$(jq -r .action "$RUNNER_TEMP/plan.json")"
            fi
            case "$action" in
              DISPATCH)
                analysis_id="$(jq -r .analysis_id "$RUNNER_TEMP/plan.json")"
                request="$(jq -c .request "$RUNNER_TEMP/plan.json")"
                echo "Dispatching analysis ${analysis_id} for ${fingerprint}"
                gh workflow run agent-e2e-failure-analysis.yml --ref main                   -f analysis_id="$analysis_id" -f request_json="$request"
                # A dispatch POST has no response body. Fence redelivery until a
                # downstream run search proves whether it landed.
                node "$dispatch" ambiguous "$STORE" "$fingerprint" > /dev/null
                ;;
              ADOPT)
                node "$dispatch" record "$STORE" "$fingerprint"                   "$(jq -r .run_id "$RUNNER_TEMP/plan.json")"                   "$(jq -r .run_attempt "$RUNNER_TEMP/plan.json")" > /dev/null
                ;;
              *)
                echo "No dispatch for ${fingerprint}: ${action}"
                ;;
            esac
          done < <(jq -r '.outcomes[] | select(.status=="ANALYSIS_CLAIMED") | .fingerprint' "$ADMISSION_RESULT")
          git -C "$STORE" add -A
          node trusted/scripts/run-store-integrity.mjs staged agent-store "$STORE"
          if ! git -C "$STORE" diff --cached --quiet; then
            git -C "$STORE" -c user.name=nession-store-writer               -c user.email=nession-store-writer@users.noreply.github.com               commit -m "e2e: record failure analysis dispatch intents $SOURCE_RUN_ID attempt $SOURCE_ATTEMPT"
            node trusted/scripts/run-store-cas-push.mjs agent-store "$STORE"
          fi
          echo "Dispatch outbox drained; ambiguous POSTs remain fenced as reconcile until a run search proves the outcome." >> "$GITHUB_STEP_SUMMARY"
