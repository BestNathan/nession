name: gitops-guard
on:
  push:
    branches: [gitops]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: reject non-gitops paths and non-semver production tags
        run: |
          # First push of the orphan branch has no HEAD^: event.before is all
          # zeros then — fall back to diff-tree against the single commit.
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          # 1) Only gitops/**, README and this workflow may exist on this branch;
          #    application source paths (crates/, web/, ...) are rejected.
          BAD=$(echo "$CHANGED" | grep -vE '^(gitops/|README\.md$|\.github/workflows/gitops-guard\.yml$)') || true
          [ -z "$BAD" ] || { echo "non-gitops path in gitops branch push: $BAD"; exit 1; }
          # 2) environments/production image tags must be SemVer (no v prefix,
          #    e.g. 0.36.0) — production only ever ships released versions.
          for f in $(echo "$CHANGED" | grep '^gitops/environments/production/' || true); do
            grep -E '^\s+newTag:' "$f" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+' \
              || { echo "non-semver tag in production: $f"; exit 1; }
          done
