name: gitops-guard
on:
  push:
    branches: [gitops]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stateless validation of the whole branch tree at HEAD — no dependence
      # on event.before, so history rewrites (pre-cutover) cannot break it.
      - name: reject app-source paths and non-semver production tags
        run: |
          # 1) This branch may only carry desired state: argocd/, base/,
          #    environments/, README and this workflow. Application source
          #    paths (crates/, web/, Cargo.toml, ...) are rejected.
          BAD=$(git ls-tree -r --name-only HEAD \
            | grep -vE '^(argocd/|base/|environments/|README\.md$|\.github/workflows/gitops-guard\.yml$)') || true
          [ -z "$BAD" ] || { echo "non-desired-state path in gitops branch: $BAD"; exit 1; }
          # 2) environments/production image tags must be SemVer (no v prefix,
          #    e.g. 0.36.0) — production only ever ships released versions.
          for f in $(git ls-tree -r --name-only HEAD | grep '^environments/production/' | grep 'kustomization\.yaml$'); do
            git show "HEAD:$f" | grep -E '^\s+newTag:' | grep -qE '[0-9]+\.[0-9]+\.[0-9]+' \
              || { echo "non-semver tag in production: $f"; exit 1; }
          done
