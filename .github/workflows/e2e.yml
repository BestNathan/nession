name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

# One run per branch/PR. Superseded runs are useless, so cancel them.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ────────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }

      # ── Node + Playwright ─────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      # Install Playwright + Chromium only (skip Firefox/WebKit).
      # PLAYWRIGHT_BROWSERS_PATH=0 installs into e2e/node_modules/ so the
      # cache restore puts them exactly where Playwright expects them.
      - run: |
          cd e2e
          npm ci
          PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium --with-deps

      - uses: actions/cache@v4
        with:
          path: e2e/node_modules/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # ── Build web (vite preview serves this) ─────────────────────────
      - run: cd web && npm ci && npm run build

      # Pre-build Rust binaries so the webServer startup is fast and the
      # three `cargo run` invocations don't each pay the compile cost.
      # (cargo's flock still serialises them; this is just the first hit.)
      - run: cargo build -p nession-server -p nession-agent

      # ── Run E2E ───────────────────────────────────────────────────────
      - run: cd e2e && npx playwright test

      # ── Report ────────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
