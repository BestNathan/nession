name: Agent / Development

env:
  NSESSION_AGENT_WORKFLOW_ID: agent-develop

# #2010. Bounded real Developer slice. NO Store writer, Controller HMAC,
# Actions writer, Publisher credential or PR publication capability in Worker.
on:
  workflow_dispatch:
    inputs:
      action_id:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      agent_id:
        required: true
        type: string
      task:
        required: true
        type: string
      input_sha:
        required: true
        type: string
      dispatch_ticket:
        required: true
        type: string
      resume_from:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: development-${{ inputs.issue_number }}-${{ inputs.action_id }}
  cancel-in-progress: false

jobs:
  developer:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cursor
    steps:
      - name: Checkout trusted main-owned Worker code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish non-authoritative Worker Run claim before any model call
        run: |
          set -euo pipefail
          node scripts/lib/agent/orchestration/worker-claim.mjs \
            prepare "$RUNNER_TEMP/development-worker-claim.json"
      - name: Upload Worker claim for independent HMAC and Store reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: development-worker-claim-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-worker-claim.json
          if-no-files-found: error
          retention-days: 3
      - name: Require exact authenticated Run ID from immutable Store receipt
        shell: bash
        run: |
          set -euo pipefail
          # A Worker may start before the trusted Controller's HTTP-200 ACK
          # CAS finishes. Poll READ-ONLY: never claim or mutate the Store here.
          for attempt in {1..12}; do
            if node scripts/lib/agent/orchestration/worker-preflight.mjs \
              verify "$RUNNER_TEMP/development-admission.json"; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::No authenticated Run-bound Store receipt; fail closed"
              exit 1
            fi
            sleep 5
          done
      - name: Derive only the public RSA sealing key in isolated pre-model step
        env:
          CURSOR_RESUME_PRIVATE_KEY_B64: ${{ secrets.CURSOR_RESUME_PRIVATE_KEY_B64 }}
          CONFIGURED_PUBLIC_KEY_B64: ${{ vars.CURSOR_RESUME_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createPrivateKey,createPublicKey} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const source=process.env.CURSOR_RESUME_PRIVATE_KEY_B64;
          if(!source)throw Error('existing cursor Environment native Session key is required');
          const key=createPrivateKey(Buffer.from(source,'base64').toString('utf8'));
          if(key.asymmetricKeyType!=='rsa'||
              (key.asymmetricKeyDetails?.modulusLength??0)<2048)
            throw Error('unsupported native Session private key');
          const pem=createPublicKey(key).export({format:'pem',type:'spki'});
          const encoded=Buffer.from(pem).toString('base64');
          if(process.env.CONFIGURED_PUBLIC_KEY_B64 &&
              process.env.CONFIGURED_PUBLIC_KEY_B64!==encoded)
            throw Error('configured sealing public key differs from cursor Environment');
          appendFileSync(process.env.GITHUB_ENV,'CURSOR_RESUME_PUBLIC_KEY_B64='+encoded+'\n');
          NODE
      - name: Require pinned Cursor Provider and public-only Session sealing key
        env:
          CURSOR_SDK_VERSION: ${{ vars.CURSOR_SDK_VERSION || '1.0.37' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSOR_API_KEY"
          test -n "$CURSOR_RESUME_PUBLIC_KEY_B64"
          [[ "$CURSOR_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::Worker requires pinned numeric CURSOR_SDK_VERSION (not latest)"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/development-sdk"
          npm install --prefix "$RUNNER_TEMP/development-sdk" \
            --ignore-scripts --no-audit --no-fund "@cursor/sdk@$CURSOR_SDK_VERSION"
          echo "CURSOR_SDK_ROOT=$RUNNER_TEMP/development-sdk" >> "$GITHUB_ENV"
          echo "CURSOR_SDK_VERSION=$CURSOR_SDK_VERSION" >> "$GITHUB_ENV"
      - name: Execute real Developer in isolated Docker with no host credentials
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL || 'composer-2.5' }}
          CURSOR_MODEL_FAST: ${{ vars.CURSOR_MODEL_FAST || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Clone the exact trusted checkout into an unprivileged disposable Git
          # repository. Docker never mounts the runner's .git or credential dir.
          git clone --no-hardlinks --local "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/development-checkout"
          git -C "$RUNNER_TEMP/development-checkout" remote remove origin
          mkdir -p "$RUNNER_TEMP/development-output"
          chmod 0700 "$RUNNER_TEMP/development-output"
          docker run --rm --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=4g --cpus=2 \
            --network=bridge --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --user "$(id -u):$(id -g)" --workdir /trusted-code \
            -v "$GITHUB_WORKSPACE:/trusted-code:ro" \
            -v "$RUNNER_TEMP/development-checkout:/workspace:rw" \
            -v "$RUNNER_TEMP/development-sdk:/sdk:ro" \
            -v "$RUNNER_TEMP/development-admission.json:/admission.json:ro" \
            -v "$RUNNER_TEMP/development-output:/output:rw" \
            -e NESSION_DEVELOPER_ISOLATED=docker-v1 \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -e GITHUB_REF -e CURSOR_API_KEY -e CURSOR_MODEL \
            -e CURSOR_MODEL_FAST -e CURSOR_RESUME_PUBLIC_KEY_B64 \
            -e CURSOR_SDK_VERSION \
            -e GITHUB_WORKSPACE=/workspace -e RUNNER_TEMP=/tmp \
            -e CURSOR_SDK_ROOT=/sdk -e HOME=/tmp \
            node:24-bookworm \
            node scripts/lib/agent/orchestration/development-worker.mjs \
              /admission.json /output
      - name: Upload canonical immutable Agent telemetry
        uses: actions/upload-artifact@v4
        with:
          name: agent-telemetry-developer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-output/agent-telemetry.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload only encrypted native Session and bounded sanitized result
        uses: actions/upload-artifact@v4
        with:
          name: development-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/development-output/ciphertext.json
            ${{ runner.temp }}/development-output/proof.json
            ${{ runner.temp }}/development-output/result.json
          if-no-files-found: error
          retention-days: 3
