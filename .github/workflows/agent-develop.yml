name: Agent / Development

env:
  NSESSION_AGENT_WORKFLOW_ID: agent-develop

# #2010. Bounded real Developer slice. NO Store writer, Controller HMAC,
# Actions writer, Publisher credential or PR publication capability in Worker.
on:
  workflow_dispatch:
    inputs:
      action_id:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      agent_id:
        required: true
        type: string
      task:
        required: true
        type: string
      input_sha:
        required: true
        type: string
      dispatch_ticket:
        required: true
        type: string
      resume_from:
        required: false
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: development-${{ inputs.issue_number }}-${{ inputs.action_id }}
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish non-authoritative Worker Run claim before any model call
        run: |
          set -euo pipefail
          node scripts/lib/agent/orchestration/worker-claim.mjs \
            prepare "$RUNNER_TEMP/development-worker-claim.json"
      - name: Upload Worker claim for independent HMAC and Store reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: development-worker-claim-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-worker-claim.json
          if-no-files-found: error
          retention-days: 3

  restore:
    needs: claim
    # A separate trusted job: no Provider call, no model API key, no App token.
    # The App private key is used ONLY as the existing checkpoint AES seed.
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.actor == 'github-actions[bot]' &&
      inputs.agent_id == 'dev-cursor-01' &&
      inputs.resume_from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: cursor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate exact resumed Run from the committed Store
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node scripts/lib/agent/orchestration/worker-preflight.mjs verify "$RUNNER_TEMP/resume-admission.json"; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then exit 1; fi
            sleep 5
          done
      - name: Rewrap committed native checkpoint in trusted isolated process
        env:
          STORE_WRITER_PRIVATE_KEY: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          CURSOR_RESUME_PRIVATE_KEY_B64: ${{ secrets.CURSOR_RESUME_PRIVATE_KEY_B64 }}
          CURSOR_SDK_VERSION: ${{ vars.CURSOR_SDK_VERSION || '1.0.37' }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          CURSOR_MODEL_FAST: ${{ vars.CURSOR_MODEL_FAST || 'true' }}
        run: node scripts/lib/agent/orchestration/development-resume.mjs prepare "$RUNNER_TEMP/resume-admission.json" "$RUNNER_TEMP/resume-transfer"
      - name: Upload encrypted native transfer for the same admitted Run
        uses: actions/upload-artifact@v4
        with:
          name: development-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/resume-transfer/ciphertext.json
            ${{ runner.temp }}/resume-transfer/resume.json
          if-no-files-found: error
          retention-days: 3

  developer:
    needs: [claim, restore]
    if: >-
      !cancelled() &&
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.actor == 'github-actions[bot]' &&
      inputs.agent_id == 'dev-cursor-01' &&
      needs.claim.result == 'success' &&
      (inputs.resume_from == '' || needs.restore.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cursor
    steps:
      - name: Checkout trusted main-owned Worker code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact authenticated Run ID from immutable Store receipt
        shell: bash
        run: |
          set -euo pipefail
          # A Worker may start before the trusted Controller's HTTP-200 ACK
          # CAS finishes. Poll READ-ONLY: never claim or mutate the Store here.
          for attempt in {1..12}; do
            if node scripts/lib/agent/orchestration/worker-preflight.mjs \
              verify "$RUNNER_TEMP/development-admission.json"; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::No authenticated Run-bound Store receipt; fail closed"
              exit 1
            fi
            sleep 5
          done
      - name: Derive only the public RSA sealing key in isolated pre-model step
        env:
          CURSOR_RESUME_PRIVATE_KEY_B64: ${{ secrets.CURSOR_RESUME_PRIVATE_KEY_B64 }}
          CONFIGURED_PUBLIC_KEY_B64: ${{ vars.CURSOR_RESUME_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createPrivateKey,createPublicKey} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const source=process.env.CURSOR_RESUME_PRIVATE_KEY_B64;
          if(!source)throw Error('existing cursor Environment native Session key is required');
          const key=createPrivateKey(Buffer.from(source,'base64').toString('utf8'));
          if(key.asymmetricKeyType!=='rsa'||
              (key.asymmetricKeyDetails?.modulusLength??0)<2048)
            throw Error('unsupported native Session private key');
          const pem=createPublicKey(key).export({format:'pem',type:'spki'});
          const encoded=Buffer.from(pem).toString('base64');
          if(process.env.CONFIGURED_PUBLIC_KEY_B64 &&
              process.env.CONFIGURED_PUBLIC_KEY_B64!==encoded)
            throw Error('configured sealing public key differs from cursor Environment');
          appendFileSync(process.env.GITHUB_ENV,'CURSOR_RESUME_PUBLIC_KEY_B64='+encoded+'\n');
          NODE
      - name: Require pinned Cursor Provider and public-only Session sealing key
        env:
          CURSOR_SDK_VERSION: ${{ vars.CURSOR_SDK_VERSION || '1.0.37' }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSOR_API_KEY"
          test -n "$CURSOR_RESUME_PUBLIC_KEY_B64"
          [[ "$CURSOR_SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::Worker requires pinned numeric CURSOR_SDK_VERSION (not latest)"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/development-sdk"
          npm install --prefix "$RUNNER_TEMP/development-sdk" \
            --ignore-scripts --no-audit --no-fund "@cursor/sdk@$CURSOR_SDK_VERSION"
          echo "CURSOR_SDK_ROOT=$RUNNER_TEMP/development-sdk" >> "$GITHUB_ENV"
          echo "CURSOR_SDK_VERSION=$CURSOR_SDK_VERSION" >> "$GITHUB_ENV"
      - name: Download only same-Run trusted encrypted native transfer
        if: inputs.resume_from != ''
        uses: actions/download-artifact@v4
        with:
          name: development-native-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume-transfer
      - name: Restore native bytes and synchronize live Issue before model
        env:
          CURSOR_RESUME_PRIVATE_KEY_B64: ${{ secrets.CURSOR_RESUME_PRIVATE_KEY_B64 }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          CURSOR_MODEL_FAST: ${{ vars.CURSOR_MODEL_FAST || 'true' }}
          GH_TOKEN: ${{ github.token }}
          HAS_RESUME: ${{ inputs.resume_from != '' }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/development-context"
          gh api repos/BestNathan/nession/issues/1997 > "$RUNNER_TEMP/development-context/issue.json"
          gh api 'repos/BestNathan/nession/issues/1997/comments?per_page=100' > "$RUNNER_TEMP/development-context/comments.json"
          if [[ "$HAS_RESUME" == true ]]; then
            node scripts/lib/agent/orchestration/development-resume.mjs open \
              "$RUNNER_TEMP/development-admission.json" "$RUNNER_TEMP/resume-transfer" \
              "$RUNNER_TEMP/development-native"
          else
            mkdir -m 700 "$RUNNER_TEMP/development-native"
          fi
      - name: Stage only the exact authenticated published PR Git tree for Repair
        if: inputs.task == 'repair'
        shell: bash
        env:
          REPAIR_INPUT_ISSUE: ${{ inputs.issue_number }}
          REPAIR_INPUT_ACTION: ${{ inputs.action_id }}
          REPAIR_INPUT_SHA: ${{ inputs.input_sha }}
        run: |
          set -euo pipefail
          test "$REPAIR_INPUT_ISSUE" = '1997'
          case "$REPAIR_INPUT_ACTION" in
            d899dfc9367cdc9d98a6dcbcd7e55ce2d962f1d72e54abf0d61b0dd7e308009d|ed14323e0466b23ec739a712ab63bfc16cbbbe225b1118a4cbeab64e419574a5) ;;
            *) echo "::error::Unrecognized native Repair Action"; exit 1 ;;
          esac
          test "$REPAIR_INPUT_SHA" = '3d8e3807cc01f6082734b8d0ba458217c28f60a4'
          git fetch --quiet --no-tags origin refs/pull/2176/head
          test "$(git rev-parse FETCH_HEAD)" = "$REPAIR_INPUT_SHA"
          git update-ref refs/nession/repair-source "$REPAIR_INPUT_SHA"
          # Only inert Git objects are brought into the disposable clone.
          # Never checkout or execute any PR-head code in this trusted job.
      - name: Build trusted isolated Cursor runtime with ripgrep
        shell: bash
        run: |
          set -euo pipefail
          # Build from main-owned Dockerfile only. No repository or PR sources
          # are in the build context; no secrets are accessible to this step.
          docker build --pull=false --tag nession-cursor-worker-rg:local - \
            < scripts/lib/agent/orchestration/cursor-worker.Dockerfile
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user "$(id -u):$(id -g)" \
            nession-cursor-worker-rg:local rg --version
      - name: Execute real Developer in isolated Docker with no host credentials
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          CURSOR_MODEL_FAST: ${{ vars.CURSOR_MODEL_FAST || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Clone the exact trusted checkout into an unprivileged disposable Git
          # repository. Docker never mounts the runner's .git or credential dir.
          git clone --no-hardlinks --local "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/development-checkout"
          if [[ "${{ inputs.task }}" == repair ]]; then
            git -C "$RUNNER_TEMP/development-checkout" fetch --quiet --no-tags \
              "$GITHUB_WORKSPACE" \
              refs/nession/repair-source:refs/nession/repair-source
            test "$(git -C "$RUNNER_TEMP/development-checkout" rev-parse refs/nession/repair-source)" = \
              '3d8e3807cc01f6082734b8d0ba458217c28f60a4'
          fi
          git -C "$RUNNER_TEMP/development-checkout" remote remove origin
          mkdir -p "$RUNNER_TEMP/development-output"
          chmod 0700 "$RUNNER_TEMP/development-output"
          docker run --rm --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=4g --cpus=2 \
            --network=bridge --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --user "$(id -u):$(id -g)" --workdir /trusted-code \
            -v "$GITHUB_WORKSPACE:/trusted-code:ro" \
            -v "$RUNNER_TEMP/development-checkout:/workspace:rw" \
            -v "$RUNNER_TEMP/development-sdk:/sdk:ro" \
            -v "$RUNNER_TEMP/development-admission.json:/admission.json:ro" \
            -v "$RUNNER_TEMP/development-output:/output:rw" \
            -v "$RUNNER_TEMP/development-native:/resume:ro" \
            -v "$RUNNER_TEMP/development-context:/context:ro" \
            -e NESSION_DEVELOPER_ISOLATED=docker-v1 \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -e GITHUB_REF -e CURSOR_API_KEY -e CURSOR_MODEL \
            -e CURSOR_MODEL_FAST -e CURSOR_RESUME_PUBLIC_KEY_B64 \
            -e CURSOR_SDK_VERSION \
            -e GITHUB_WORKSPACE=/workspace -e RUNNER_TEMP=/tmp \
            -e CURSOR_SDK_ROOT=/sdk -e CURSOR_RIPGREP_PATH=/usr/bin/rg -e HOME=/tmp \
            nession-cursor-worker-rg:local \
            node scripts/lib/agent/orchestration/development-worker.mjs \
              /admission.json /output
      - name: Upload canonical immutable Agent telemetry
        uses: actions/upload-artifact@v4
        with:
          name: agent-telemetry-developer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-output/agent-telemetry.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload only encrypted native Session and bounded sanitized result
        uses: actions/upload-artifact@v4
        with:
          name: development-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/development-output/ciphertext.json
            ${{ runner.temp }}/development-output/proof.json
            ${{ runner.temp }}/development-output/result.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove transient native Session and Issue context
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/development-native" "$RUNNER_TEMP/development-context"

  # The existing claim/Outbox workflow identity is shared; only this
  # provider-specific job runs Claude Code/Qwen. Never grant it Store or
  # Publisher credentials, and never execute code from an untrusted PR SHA.
  qwen-restore:
    needs: claim
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.actor == 'github-actions[bot]' &&
      inputs.agent_id == 'dev-qwen-01' &&
      inputs.resume_from != '' &&
      needs.claim.result == 'success'
    runs-on: ubuntu-24.04
    environment: dev-claude-qwen
    timeout-minutes: 12
    steps:
      - name: Checkout trusted main-only Qwen Restore code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact signed resumed Qwen Worker Store ACK
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node scripts/lib/agent/orchestration/worker-preflight.mjs verify "$RUNNER_TEMP/qwen-restore-admission.json"; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then exit 1; fi
            sleep 5
          done
      - name: Rewrap immutable original native Qwen checkpoint without any writer token
        env:
          STORE_WRITER_PRIVATE_KEY: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          AGENT_STORE_CONTROLLER_REMOTE: https://github.com/BestNathan/nession.git
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
        run: |
          set -euo pipefail
          node scripts/lib/agent/orchestration/qwen-development-resume.mjs prepare \
            "$RUNNER_TEMP/qwen-restore-admission.json" "$RUNNER_TEMP/qwen-transfer"
      - name: Upload only authenticated recipient-bound Qwen ciphertext
        uses: actions/upload-artifact@v4
        with:
          name: development-qwen-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qwen-transfer/ciphertext.json
            ${{ runner.temp }}/qwen-transfer/manifest.json
          if-no-files-found: error
          retention-days: 3

  qwen-developer:
    needs: [claim, qwen-restore]
    if: >-
      !cancelled() &&
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.actor == 'github-actions[bot]' &&
      inputs.agent_id == 'dev-qwen-01' &&
      needs.claim.result == 'success' &&
      (inputs.resume_from == '' || needs.qwen-restore.result == 'success')
    runs-on: ubuntu-24.04
    environment: dev-claude-qwen
    timeout-minutes: 25
    steps:
      - name: Checkout main-owned Qwen model-runner code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact signed Qwen Store ACK before any model or source checkout
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if node scripts/lib/agent/orchestration/worker-preflight.mjs verify "$RUNNER_TEMP/qwen-admission.json"; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::Qwen Worker has no authenticated Store ACK"
              exit 1
            fi
            sleep 5
          done
      - name: Validate pinned Qwen model, endpoint, public Session key and CLI version
        env:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QWEN_RESUME_PUBLIC_KEY_B64: ${{ vars.QWEN_RESUME_PUBLIC_KEY_B64 }}
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createPublicKey} from 'node:crypto';
          import {bindQwenDeveloper} from './scripts/lib/agent/orchestration/qwen-developer-policy.mjs';
          const admission=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/qwen-admission.json'));
          const registry=JSON.parse(fs.readFileSync('automation/agents/registry.json'));
          bindQwenDeveloper(admission,registry,process.env,
            {cliVersion:process.env.CLAUDE_CODE_VERSION});
          const pem=Buffer.from(process.env.QWEN_RESUME_PUBLIC_KEY_B64||'','base64').toString('utf8');
          const key=createPublicKey(pem);
          if(key.asymmetricKeyType!=='rsa'||
              (key.asymmetricKeyDetails?.modulusLength??0)<2048)
            throw Error('Qwen native public key must be RSA >= 2048-bit');
          console.log('Qwen identity and public-only model Session key pinned');
          NODE
      - name: Prepare disposable exact-SHA tracked source without executing it
        run: |
          set -euo pipefail
          SOURCE_SHA="$(jq -er .input_sha "$RUNNER_TEMP/qwen-admission.json")"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git clone --no-hardlinks --local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/qwen-source"
          if ! git -C "$RUNNER_TEMP/qwen-source" cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null; then
            git -C "$RUNNER_TEMP/qwen-source" fetch --quiet --no-tags \
              "https://github.com/$GITHUB_REPOSITORY.git" "$SOURCE_SHA"
          fi
          git -C "$RUNNER_TEMP/qwen-source" checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/qwen-source" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/qwen-source" remote remove origin
          mkdir -m 700 "$RUNNER_TEMP/qwen-context"
      - name: Fetch only bounded read-only Issue context outside model container
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ISSUE="$(jq -er .issue "$RUNNER_TEMP/qwen-admission.json")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > "$RUNNER_TEMP/qwen-context/issue.json"
          jq -e --argjson issue "$ISSUE" '.number == $issue and .state == "open" and (.pull_request == null)' \
            "$RUNNER_TEMP/qwen-context/issue.json" > /dev/null
      - name: Build pinned, source-free isolated Qwen runtime
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
        run: |
          set -euo pipefail
          docker build --pull=false --build-arg "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" \
            --tag nession-qwen-developer:local - \
            < scripts/lib/agent/orchestration/qwen-worker.Dockerfile
      - name: Download only same-Run encrypted Qwen Resume transfer
        if: inputs.resume_from != ''
        uses: actions/download-artifact@v4
        with:
          name: development-qwen-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-transfer
      - name: Open Qwen native Session on trusted host before model Docker
        if: inputs.resume_from != ''
        env:
          QWEN_RESUME_PRIVATE_KEY_B64: ${{ secrets.QWEN_RESUME_PRIVATE_KEY_B64 }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
        run: |
          set -euo pipefail
          node scripts/lib/agent/orchestration/qwen-development-resume.mjs open \
            "$RUNNER_TEMP/qwen-admission.json" "$RUNNER_TEMP/qwen-transfer" \
            "$RUNNER_TEMP/qwen-native"
          mkdir -m 700 "$RUNNER_TEMP/qwen-resume"
          mv "$RUNNER_TEMP/qwen-native" "$RUNNER_TEMP/qwen-resume/native"
          cp "$RUNNER_TEMP/qwen-transfer/manifest.json" "$RUNNER_TEMP/qwen-resume/manifest.json"
      - name: Execute Store-admitted Qwen CLI in unprivileged Docker
        env:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION }}
          QWEN_RESUME_PUBLIC_KEY_B64: ${{ vars.QWEN_RESUME_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qwen-resume" "$RUNNER_TEMP/qwen-output"
          chmod 0700 "$RUNNER_TEMP/qwen-resume" "$RUNNER_TEMP/qwen-output"
          docker run --rm --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=256 --memory=4g --cpus=2 \
            --network=bridge --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --user "$(id -u):$(id -g)" --workdir /trusted-code \
            -v "$GITHUB_WORKSPACE:/trusted-code:ro" \
            -v "$RUNNER_TEMP/qwen-source:/workspace:rw" \
            -v "$RUNNER_TEMP/qwen-admission.json:/admission.json:ro" \
            -v "$RUNNER_TEMP/qwen-context:/context:ro" \
            -v "$RUNNER_TEMP/qwen-resume:/resume:ro" \
            -v "$RUNNER_TEMP/qwen-output:/output:rw" \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_REF \
            -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW -e GITHUB_ACTOR \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA \
            -e ANTHROPIC_MODEL -e ANTHROPIC_BASE_URL \
            -e ANTHROPIC_AUTH_TOKEN -e ANTHROPIC_API_KEY \
            -e CLAUDE_CODE_VERSION -e QWEN_RESUME_PUBLIC_KEY_B64 \
            -e NESSION_DEVELOPER_ISOLATED=docker-v1 \
            -e GITHUB_WORKSPACE=/workspace -e RUNNER_TEMP=/tmp \
            -e HOME=/tmp nession-qwen-developer:local \
            node scripts/lib/agent/orchestration/qwen-development-worker.mjs \
              /admission.json /output
      - name: Upload canonical real Qwen Developer telemetry
        # A failed model attempt is still an Agent invocation and must retain
        # its native-observable failure telemetry; no Store/PR publication.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-telemetry-developer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-output/agent-telemetry.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload only bounded patch and encrypted native Session
        uses: actions/upload-artifact@v4
        with:
          name: development-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qwen-output/result.json
            ${{ runner.temp }}/qwen-output/proof.json
            ${{ runner.temp }}/qwen-output/ciphertext.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove private transient restored Session and Issue data
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/qwen-native" "$RUNNER_TEMP/qwen-resume" \
            "$RUNNER_TEMP/qwen-transfer" "$RUNNER_TEMP/qwen-context"
