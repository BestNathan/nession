name: CI / ACR Acceptance Readback Smoke (temporary)
on:
  push:
    branches: [test/2261-acr-evidence-selftest]
    paths: [.github/workflows/ci-2261-staging-acr-readback-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Negative and positive contract tests
        run: node scripts/acceptance-staging-acr-readback.mjs self-test
      - name: Authenticate historical staging ACR evidence from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {collectStagingAcrEvidence} from './scripts/acceptance-staging-acr-readback.mjs';
          const repo='BestNathan/nession';
          const sha='1790d9fc08ae6f6f97028e53d99f1687e4de40bd';
          const call=async path=>{
            const res=await fetch('https://api.github.com'+path,{
              headers: {Authorization:'Bearer '+process.env.GH_TOKEN,
                Accept:'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28'},
              signal:AbortSignal.timeout(30000)});
            if(!res.ok)throw Error('GitHub evidence fetch HTTP '+res.status+' for '+path);
            return res;
          };
          const out=await collectStagingAcrEvidence({repo,sha,
            get:async path=>(await call(path)).json(),
            getText:async path=>(await call(path)).text()});
          if(out.kind!=='verified_staging_acr_readback'||
             out.current_images.length!==3||
             out.anonymous_registry_tags.length!==6)throw Error('incomplete ACR proof');
          console.log(JSON.stringify({kind:out.kind,source_runs:out.source_runs,
            gitops_commit:out.gitops_commit,deployments:out.current_images,
            anonymous_registry_count:out.anonymous_registry_tags.length}));
          JS
