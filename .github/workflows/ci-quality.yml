name: CI / Quality Gate

# Repository Cargo config enables a local-only rustc wrapper. CI deliberately
# bypasses it and keeps using setup-rust-toolchain / rust-cache. This preserves
# the measured #126 decision: sccache on GHA had a 0–3% hit rate and competed
# for the Actions cache quota.
env:
  RUSTC_WRAPPER: ""


on:
  pull_request:
    branches: [staging, main]
  # Main pushes need their own run. #1853 SC-04 requires the blocking Gates and
  # the acceptance self-test verdicts to be evidenced at the *merged* commit, and
  # an exact-SHA post-merge evaluation can never see a `pull_request` run: those
  # carry the PR head, not the merge SHA. This is deliberate, not a duplicate of
  # the PR run — do not remove it as redundant.
  push:
    branches: [main]

# PR heads may supersede earlier runs, but each main-push SHA must retain
# its own completed Quality Gate for exact-SHA post-merge Acceptance (#1876).
# GitHub run_id is unique per push; a newer main commit must not cancel the
# previous commit's evidence (nor should unrelated branches share a group).
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - name: Verify Rust and Acceptance Gates
        run: ./gates/run --suite quality-rust

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - name: Verify repository tooling Gates
        run: |
          ./gates/run --suite quality-tooling
      - run: cd web && npm ci
      - name: Verify Web and design Gates
        run: ./gates/run design-system-full web-eslint web-typecheck web-test-unit web-test-integration
      - name: Verify negative fixtures and Acceptance harness contracts
        run: ./gates/run design-token-boundary-selftest pre-push-diff-base-selftest acceptance-executor-selftest acceptance-agent-selftest
