name: CI / Quality Gate

# Repository Cargo config enables a local-only rustc wrapper. CI deliberately
# bypasses it and keeps using setup-rust-toolchain / rust-cache. This preserves
# the measured #126 decision: sccache on GHA had a 0–3% hit rate and competed
# for the Actions cache quota.
env:
  RUSTC_WRAPPER: ""


on:
  pull_request:
    branches: [staging, main]
    # Scope PR execution to changes that can affect this validator.
    # Keep push / manual triggers unchanged for exact-SHA evidence.
    paths:
      - '.github/workflows/**'
      - 'crates/**'
      - 'web/**'
      - 'design/**'
      - 'e2e/**'
      - 'gates/**'
      - 'scripts/**'
      - 'automation/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'justfile'
  # Main pushes need their own run. #1853 SC-04 requires the blocking Gates and
  # the acceptance self-test verdicts to be evidenced at the *merged* commit, and
  # an exact-SHA post-merge evaluation can never see a `pull_request` run: those
  # carry the PR head, not the merge SHA. This is deliberate, not a duplicate of
  # the PR run — do not remove it as redundant.
  push:
    branches: [main]

# PR heads may supersede earlier runs, but each main-push SHA must retain
# its own completed Quality Gate for exact-SHA post-merge Acceptance (#1876).
# GitHub run_id is unique per push; a newer main commit must not cancel the
# previous commit's evidence (nor should unrelated branches share a group).
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # PR path selection is intentionally cheap. Main-push always runs both
    # exact-SHA suites for post-merge Acceptance evidence.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
      web: ${{ steps.changed.outputs.web }}
      workflow: ${{ steps.changed.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select impacted checks from the exact PR diff
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo 'workflow=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Use the same merge-base comparison as PR path filtering; fail
          # rather than silently marking a missing/unreadable diff as N/A.
          base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          git diff --name-only -z "$base" "$PR_HEAD_SHA" > "$RUNNER_TEMP/quality-changed-paths"
          mapfile -d '' -t changed < "$RUNNER_TEMP/quality-changed-paths"
          rust=false
          web=false
          workflow=false
          for path in "${changed[@]}"; do
            case "$path" in
              crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|clippy.toml|justfile|gates/*|scripts/*|automation/*|.github/workflows/ci-quality.yml) rust=true ;;
            esac
            case "$path" in
              web/*|design/*|e2e/*|justfile|gates/*|scripts/*|automation/*|.github/workflows/ci-quality.yml) web=true ;;
            esac
            case "$path" in
              .github/workflows/*) workflow=true ;;
            esac
          done
          if [[ "$rust" == false && "$web" == false && "$workflow" == false ]]; then
            echo '::error::PR matched Quality trigger but no applicable checks were found'
            exit 1
          fi
          {
            echo "rust=$rust"
            echo "web=$web"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"
          echo "Rust applicable: $rust; Web applicable: $web; Workflow contracts applicable: $workflow"

  workflow-check:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate workflow taxonomy and references
        run: ./gates/run workflow-conventions
      - name: Validate trusted Controller and Store negative contracts
        run: |
          node scripts/lib/agent/orchestration/controller-dispatch-selftest.mjs
          node scripts/lib/agent/orchestration/dispatch-intent-selftest.mjs
          node scripts/lib/agent/orchestration/worker-preflight-selftest.mjs
  rust-check:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - name: Verify Rust and Acceptance Gates
        run: ./gates/run --suite quality-rust

  web-check:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - name: Verify repository tooling Gates
        run: |
          ./gates/run --suite quality-tooling
      - run: cd web && npm ci
      - name: Verify Web and design Gates
        run: ./gates/run design-system-full web-eslint web-typecheck web-test-unit web-test-integration
      - name: Verify negative fixtures and Acceptance harness contracts
        run: ./gates/run design-token-boundary-selftest pre-push-diff-base-selftest acceptance-executor-selftest acceptance-agent-selftest
      # #1876: The Quality Gate remains independently blocking; a dist artifact
      # is transport only, and is published only for a validated main push.
      - name: Verify Web artifact integrity and negative fixtures
        run: ./gates/run web-build-artifact-selftest
      - name: Build verified main Web dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cd web && npm run build
      - name: Pack exact-SHA Web dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/ci/web-build-artifact.mjs pack --root . --dest "$RUNNER_TEMP/nession-web-dist"
      - name: Publish exact-SHA Web dist transport
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nession-web-dist-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nession-web-dist/
          if-no-files-found: error
          retention-days: 7
