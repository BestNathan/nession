name: CI / Quality Gate

# Repository Cargo config enables a local-only rustc wrapper. CI deliberately
# bypasses it and keeps using setup-rust-toolchain / rust-cache. This preserves
# the measured #126 decision: sccache on GHA had a 0–3% hit rate and competed
# for the Actions cache quota.
env:
  RUSTC_WRAPPER: ""


on:
  pull_request:
    branches: [staging, main]
    # Do not filter the PR event by changed paths: an exact two-parent
    # convergence integration can have an empty net diff but still requires
    # authenticated exact-HEAD checks. Trusted selectors scope actual work.
  # Keep exact main SHA evidence but select impacted gates; the remaining
  # module checks are inapplicable rather than silently green.
  push:
    branches: [main]

# PR heads may supersede earlier runs, but each main-push SHA must retain
# its own completed Quality Gate for exact-SHA post-merge Acceptance (#1876).
# GitHub run_id is unique per push; a newer main commit must not cancel the
# previous commit's evidence (nor should unrelated branches share a group).
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
      web: ${{ steps.changed.outputs.web }}
      tooling: ${{ steps.changed.outputs.tooling }}
      workflow: ${{ steps.changed.outputs.workflow }}
      instruction: ${{ steps.changed.outputs.instruction }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Do not execute the selector from a legacy PR head: the workflow may
      # postdate that head, and the selector is trusted Quality policy.
      - name: Checkout trusted Quality selector
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Classify the exact PR or main-push change
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$(git rev-parse HEAD)" == "$PR_HEAD_SHA" ]] || exit 1
            base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            target="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            target="$(git rev-parse HEAD)"
            [[ "$target" == "$GITHUB_SHA" ]] || exit 1
            base="$(git rev-parse "$target^1")"
          else
            echo "::error::Unsupported Quality source event"
            exit 1
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$target" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git diff --no-renames --name-only -z "$base" "$target" > "$RUNNER_TEMP/quality-changed-paths"
          node trusted/scripts/ci/quality-scope.mjs "$RUNNER_TEMP/quality-changed-paths"
          echo "Full Gate applicability was selected from the exact source diff"

  instruction-check:
    needs: scope
    if: needs.scope.outputs.instruction == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify canonical repository instruction graph
        run: ./gates/run instruction-contract

  workflow-check:
    needs: scope
    if: needs.scope.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate workflow taxonomy and references
        run: ./gates/run workflow-conventions
      - name: Validate changed Actions YAML and expressions with pinned actionlint
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          # The source diff, not an arbitrary user-provided path, selects the
          # affected workflows. Existing unrelated workflow lint debt is not
          # silently turned into a new cross-repository deployment blocker.
          mapfile -d '' -t changed < <(
            git diff --no-renames --diff-filter=ACMR --name-only -z \
              "$BASE_SHA" "$TARGET_SHA" -- '.github/workflows/'
          )
          workflows=()
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/*.yml|.github/workflows/*.yaml) workflows+=("$file") ;;
            esac
          done
          if (( ${#workflows[@]} == 0 )); then
            echo 'No changed workflow YAML files'
            exit 0
          fi
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= "${workflows[@]}"
      - name: Validate trusted Controller and Store negative contracts
        run: |
          node scripts/lib/agent/orchestration/controller-dispatch-selftest.mjs
          node scripts/lib/agent/orchestration/dispatch-intent-selftest.mjs
          node scripts/lib/agent/orchestration/worker-preflight-selftest.mjs
          # #3488: actual command/Artifact/Store negative fixtures must pass
          # on the PR HEAD before activating the trusted main entrypoint.
          node scripts/lib/agent/orchestration/controller-request-selftest.mjs
          node scripts/lib/agent/orchestration/controller-bug-dispatch-selftest.mjs
  rust-check:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
          fallback: none
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - name: Verify Rust and Acceptance Gates
        run: ./gates/run --suite quality-rust

  tooling-check:
    needs: scope
    if: needs.scope.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
          fallback: none
      - name: Verify repository tooling Gates
        run: ./gates/run --suite quality-tooling

  web-tests:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
          fallback: none
      - run: cd web && npm ci
      - name: Verify Web and design Gates
        run: ./gates/run design-system-full web-eslint web-typecheck web-test-unit web-test-integration
      - name: Verify negative fixtures and Acceptance harness contracts
        run: ./gates/run design-token-boundary-selftest pre-push-diff-base-selftest acceptance-executor-selftest acceptance-agent-selftest
      - name: Verify Web artifact integrity and negative fixtures
        run: ./gates/run web-build-artifact-selftest

  # Keep the original required status context, without serializing Tooling and
  # Web execution. A missing/skipped/failed required upstream job is a failure.
  web-check:
    needs: [scope, tooling-check, web-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce applicable Quality results at the stable check name
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          TOOLING_REQUIRED: ${{ needs.scope.outputs.tooling }}
          WEB_REQUIRED: ${{ needs.scope.outputs.web }}
          TOOLING_RESULT: ${{ needs.tooling-check.result }}
          WEB_RESULT: ${{ needs.web-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != 'success' ]]; then exit 1; fi
          if [[ "$TOOLING_REQUIRED" == 'true' && "$TOOLING_RESULT" != 'success' ]]; then exit 1; fi
          if [[ "$WEB_REQUIRED" == 'true' && "$WEB_RESULT" != 'success' ]]; then exit 1; fi
          if [[ "$TOOLING_REQUIRED" != 'true' && "$TOOLING_REQUIRED" != 'false' ]]; then exit 1; fi
          if [[ "$WEB_REQUIRED" != 'true' && "$WEB_REQUIRED" != 'false' ]]; then exit 1; fi
          if [[ "$TOOLING_REQUIRED" == 'false' && "$WEB_REQUIRED" == 'false' ]]; then
            echo 'Not Applicable: no Web or Tooling source changed (scope proven)'
          else
            echo 'Required independent Quality Gate suites passed'
          fi

  # Dist is only transport. The exact-SHA main artifact must not be published
  # until BOTH applicable Web and Tooling Gate families have succeeded.
  web-dist:
    needs: [scope, web-check]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.web == 'true' && needs.web-check.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build verified main Web dist
        run: cd web && npm ci && npm run build
      - name: Pack exact-SHA Web dist
        run: node scripts/ci/web-build-artifact.mjs pack --root . --dest "$RUNNER_TEMP/nession-web-dist"
      - name: Publish exact-SHA Web dist transport
        uses: actions/upload-artifact@v4
        with:
          name: nession-web-dist-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nession-web-dist/
          if-no-files-found: error
          retention-days: 7
