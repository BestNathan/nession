name: Agent / Staging Developer Canary

# #2319: trusted-main synthetic Qwen Developer proof against an exact staging
# SHA. The signed Dispatch Run/artifact and its upstream Admission are both
# independently authenticated before the protected provider Environment is
# entered. NEVER check out/execute staging code. This is not signed Store
# Developer work or an SC Pass.
on:
  workflow_run:
    workflows:
      - Acceptance / Staging Developer Dispatch
    types: [completed]

env:
  NSESSION_AGENT_WORKFLOW_ID: agent-staging-developer-canary

permissions:
  contents: read
  actions: read

jobs:
  verify-source:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'workflow_run' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == 'BestNathan/nession' &&
      github.event.workflow_run.head_repository.full_name == 'BestNathan/nession' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: agent-staging-controller
    timeout-minutes: 5
    outputs:
      staging_sha: ${{ steps.source.outputs.staging_sha }}
      source_main_sha: ${{ steps.source.outputs.source_main_sha }}
      dispatch_id: ${{ steps.source.outputs.dispatch_id }}
      agent_id: ${{ steps.source.outputs.agent_id }}
      environment: ${{ steps.source.outputs.environment }}
      model: ${{ steps.source.outputs.model }}
      cli_version: ${{ steps.source.outputs.cli_version }}
      phase: ${{ steps.source.outputs.phase }}
      default_model: ${{ steps.source.outputs.default_model }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate signed Dispatch, its Admission and artifact digests
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          STAGING_DISPATCH_KEY: ${{ secrets.AGENT_STAGING_DISPATCH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" == 1 ]]
          work="$RUNNER_TEMP/staging-source"
          mkdir -p "$work"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$work/dispatch-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$work/dispatch-artifacts.json"
          artifact_name="staging-developer-dispatch-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          artifact_id="$(jq -er --arg name "$artifact_name" '
            [.artifacts[] | select(.name == $name)] |
            if length == 1 then .[0].id else error("untrusted dispatch artifact cardinality") end
          ' "$work/dispatch-artifacts.json")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$work/staging-dispatch.zip"
          locator="$(node scripts/lib/agent/orchestration/staging-developer-dispatch.mjs locate \
            "$work/dispatch-run.json" "$work/dispatch-artifacts.json" \
            "$work/staging-dispatch.zip")"
          [[ "$locator" =~ ^[1-9][0-9]+[[:space:]]1$ ]]
          read -r admission_run_id admission_run_attempt <<< "$locator"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$admission_run_id" \
            > "$work/admission-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$admission_run_id/artifacts?per_page=100" \
            > "$work/admission-artifacts.json"
          admission_name="staging-development-admission-$admission_run_id-$admission_run_attempt"
          admission_artifact="$(jq -er --arg name "$admission_name" '
            [.artifacts[] | select(.name == $name)] |
            if length == 1 then .[0].id else error("untrusted admission artifact cardinality") end
          ' "$work/admission-artifacts.json")"
          [[ "$admission_artifact" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$admission_artifact/zip" \
            > "$work/staging-admission.zip"
          node scripts/lib/agent/orchestration/staging-developer-dispatch.mjs verify \
            "$work/dispatch-run.json" "$work/dispatch-artifacts.json" \
            "$work/staging-dispatch.zip" "$work/admission-run.json" \
            "$work/admission-artifacts.json" "$work/staging-admission.zip" \
            "$work/verified-staging-dispatch.json"
          if [[ "$(jq -r .phase "$work/verified-staging-dispatch.json")" == "resume" ]]; then
            STAGING_VERIFIED_DISPATCH="$work/verified-staging-dispatch.json" \
              node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import {verifyCommittedCheckpoint}
              from './scripts/lib/agent/store/remote.mjs';
            const v=JSON.parse(fs.readFileSync(process.env.STAGING_VERIFIED_DISPATCH,'utf8'));
            const c=v.checkpoint;
            verifyCommittedCheckpoint({remote:'https://github.com/BestNathan/nession.git',
              identity:{role:'developer',agent_id:'dev-qwen-01',issue:2319},
              commit_sha:c.commit_sha,version:c.version,
              ciphertext_sha256:c.ciphertext_sha256});
            console.log('Verified committed staged checkpoint '+c.version+
              ' at '+c.commit_sha);
          NODE
          fi
          target="$(jq -er .target_sha "$work/verified-staging-dispatch.json")"
          dispatch="$(jq -er .dispatch_id "$work/verified-staging-dispatch.json")"
          for key in source_main_sha dispatch_id agent_id environment model cli_version phase default_model; do
            value="$(jq -er ".$key" "$work/verified-staging-dispatch.json")"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done
          # The job output name is the pre-existing `staging_sha` contract.
          echo "staging_sha=$target" >> "$GITHUB_OUTPUT"
          {
            echo "## Authenticated staging dispatch"
            echo
            echo "- Target SHA: \`$target\`"
            echo "- Dispatch ID: \`$dispatch\`"
            echo "- Signed dispatch and upstream Admission digests verified; no Store claim or SC Pass"
          } >> "$GITHUB_STEP_SUMMARY"

  synthetic-qwen:
    needs: verify-source
    if: needs.verify-source.result == 'success'
    runs-on: ubuntu-24.04
    environment: dev-claude-qwen
    timeout-minutes: 15
    env:
      STAGING_TARGET_SHA: ${{ needs.verify-source.outputs.staging_sha }}
      STAGING_DISPATCH_ID: ${{ needs.verify-source.outputs.dispatch_id }}
      STAGING_DISPATCH_AGENT: ${{ needs.verify-source.outputs.agent_id }}
      STAGING_DISPATCH_ENVIRONMENT: ${{ needs.verify-source.outputs.environment }}
      STAGING_PHASE: ${{ needs.verify-source.outputs.phase }}
      STAGING_DEFAULT_MODEL: ${{ needs.verify-source.outputs.default_model }}
      SOURCE_MAIN_SHA: ${{ needs.verify-source.outputs.source_main_sha }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      # Model and CLI come from the signed dispatch, not from the mutable
      # Environment variable. A later default change cannot alter this task.
      ANTHROPIC_MODEL: ${{ needs.verify-source.outputs.model }}
      CLAUDE_CODE_VERSION: ${{ needs.verify-source.outputs.cli_version }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout trusted main-only Provider implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-source.outputs.source_main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail closed on absent/misconfigured staging dispatch or Gateway
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_MAIN_SHA" ]] ||
            { echo "::error::Staging model Worker did not load authenticated main source"; exit 1; }
          [[ "$STAGING_DISPATCH_AGENT" == "dev-qwen-01" ]] ||
            { echo "::error::Staging dispatch selected an unapproved Agent"; exit 1; }
          [[ "$STAGING_DISPATCH_ENVIRONMENT" == "dev-claude-qwen" ]] ||
            { echo "::error::Staging dispatch selected an unapproved Environment"; exit 1; }
          [[ "$STAGING_DISPATCH_ID" =~ ^[a-f0-9]{64}$ ]] ||
            { echo "::error::Staging dispatch identity is missing"; exit 1; }
          node --input-type=module <<'NODE'
          import {qwenDeveloperModel,qwenGatewayEndpoint}
            from './scripts/lib/agent/orchestration/qwen-developer-policy.mjs';
          qwenDeveloperModel(process.env);
          qwenGatewayEndpoint(process.env);
          if(!/^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/.test(process.env.CLAUDE_CODE_VERSION??''))
            throw Error('Staging Claude Code version must be explicitly pinned');
          console.log('Staging-only Qwen Gateway and native CLI version are pinned');
          NODE
      - name: Install restricted Claude Code for staging-only model call
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --help | grep -q -- '--restricted' ||
            { echo "::error::Claude CLI must support restricted mode"; exit 1; }
      - name: Execute bounded synthetic Qwen Read/Edit only
        run: |
          set -euo pipefail
          node scripts/lib/agent/developer-canary.mjs staging \
            "$RUNNER_TEMP/staging-qwen-telemetry"
      - name: Seal a ciphertext-only native staging Session checkpoint
        if: needs.verify-source.outputs.phase == 'seed'
        env:
          STAGING_CLAUDE_RESUME_PUBLIC_KEY_B64: ${{ vars.STAGING_CLAUDE_RESUME_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          node scripts/lib/agent/providers/claude-resume-fixture.mjs staging-seed \
            "$RUNNER_TEMP/staging-checkpoint"
      - name: Upload canonical staging Agent telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-telemetry-staging-qwen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-qwen-telemetry/agent-telemetry.json
            ${{ runner.temp }}/staging-qwen-telemetry/agent-execution-trace.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload ciphertext-only staging checkpoint
        if: needs.verify-source.outputs.phase == 'seed'
        uses: actions/upload-artifact@v4
        with:
          name: staging-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-checkpoint/ciphertext.json
            ${{ runner.temp }}/staging-checkpoint/proof.json
          if-no-files-found: error
          retention-days: 3

  publish-checkpoint:
    needs: [verify-source, synthetic-qwen]
    if: needs.verify-source.result == 'success' && needs.synthetic-qwen.result == 'success' && needs.verify-source.outputs.phase == 'seed'
    runs-on: ubuntu-24.04
    environment: agent-staging-controller
    timeout-minutes: 10
    env:
      STAGING_TARGET_SHA: ${{ needs.verify-source.outputs.staging_sha }}
      STAGING_DISPATCH_ID: ${{ needs.verify-source.outputs.dispatch_id }}
      ANTHROPIC_MODEL: ${{ needs.verify-source.outputs.model }}
      CLAUDE_CODE_VERSION: ${{ needs.verify-source.outputs.cli_version }}
    steps:
      - name: Checkout trusted main-only Store ingester
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-source.outputs.source_main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download ciphertext-only staging checkpoint
        uses: actions/download-artifact@v4
        with:
          name: staging-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-checkpoint
      - name: Mint scoped Store Writer token
        id: writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RUN_STORE_WRITER_APP_ID }}
          private-key: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
      - name: Publish encrypted checkpoint to the canonical Store
        env:
          STAGING_CLAUDE_RESUME_PRIVATE_KEY_B64: ${{ secrets.STAGING_CLAUDE_RESUME_PRIVATE_KEY_B64 }}
          STAGING_STORE_AES_KEY_B64: ${{ secrets.STAGING_STORE_AES_KEY_B64 }}
          STORE_APP_TOKEN: ${{ steps.writer.outputs.token }}
        run: |
          set -euo pipefail
          export AGENT_STORE_CONTROLLER_REMOTE="https://x-access-token:${STORE_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node scripts/lib/agent/providers/claude-resume-fixture.mjs staging-publish \
            "$RUNNER_TEMP/staging-checkpoint" "$RUNNER_TEMP/staging-checkpoint-receipt.json"
          unset AGENT_STORE_CONTROLLER_REMOTE STORE_APP_TOKEN
      - name: Upload staging checkpoint receipt
        uses: actions/upload-artifact@v4
        with:
          name: staging-checkpoint-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-checkpoint-receipt.json
          if-no-files-found: error
          retention-days: 14
