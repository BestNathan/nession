name: E2E / Full Regression

# Trusted dispatch source identity is visible on REST Workflow Runs. The
# checked 'full' job still independently pins and verifies this exact commit.
run-name: >-
  ${{ inputs.source_comment_id &&
      format('Comment E2E #{0} comment:{1}', inputs.source_pr_number, inputs.source_comment_id) ||
      (github.event_name == 'workflow_dispatch' &&
      format('Convergence Full {0}@{1}', inputs.target_ref,
        inputs.target_sha || (inputs.target_ref == 'main' && github.sha) || 'tip') ||
      format('Full Regression {0}@{1}', github.ref_name, github.sha)) }}

# #3465: periodic Main diagnostics are never merge / release admission.
# Default cadence every 12h via GitHub Vars; manual investigations remain
# available, but Main pushes and convergence PRs do not auto-dispatch Full.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Existing source branch (pin to immutable SHA)
        required: true
        default: main
        type: string
      target_sha:
        description: Optional exact 40-character SHA reachable from branch
        required: false
        type: string
      source_comment_id:
        description: Optional canonical original human PR comment ID for router run identity
        required: false
        type: string
      source_pr_number:
        description: Optional original PR number for router run identity
        required: false
        type: string
  # Cron cannot interpolate vars. Use cheap fixed admissions that read
  # E2E_MAIN_INTERVAL_HOURS, not a mandatory expensive hourly Full suite.
  # GitHub drops scheduled deliveries in this repository, so a second tick
  # halves the miss streak; an in-flight Full is detected from history and
  # reported as FULL_IN_FLIGHT, so the extra tick cannot double-run.
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: e2e-full-regression-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  admit:
    if: github.event_name == 'schedule'
    concurrency:
      group: e2e-full-regression-admission
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
      decision: ${{ steps.decide.outputs.decision }}
      interval_hours: ${{ steps.decide.outputs.interval_hours }}
      last_full_completed_at: ${{ steps.decide.outputs.last_full_completed_at }}
      next_due_at: ${{ steps.decide.outputs.next_due_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate configurable Main Full interval
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_MAIN_INTERVAL_HOURS: ${{ vars.E2E_MAIN_INTERVAL_HOURS }}
          E2E_STAGING_INTERVAL_HOURS: ${{ vars.E2E_STAGING_INTERVAL_HOURS }}
          E2E_STAGING_LANE_INTERVALS_JSON: ${{ vars.E2E_STAGING_LANE_INTERVALS_JSON }}
        run: |
          node scripts/e2e-regression-policy.mjs self-test
          node scripts/e2e-regression-policy.mjs admit-main-history

  full:
    needs: [admit]
    concurrency:
      group: e2e-full-regression-execution
      cancel-in-progress: false
    if: >-
      ${{ always() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'schedule' &&
            needs.admit.result == 'success' &&
            needs.admit.outputs.run == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      RUSTC_WRAPPER: ""
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin trusted read-only failure candidate extractor
        # Copy from trusted Main before the next step detaches to arbitrary
        # historical/test source, so old SHAs need not contain this script.
        run: |
          node scripts/e2e-full-failure-manifest.mjs self-test
          cp scripts/e2e-full-failure-manifest.mjs "$RUNNER_TEMP/e2e-full-failure-manifest.mjs"
      - name: Verify original PR comment and exact HEAD for routed Full
        if: inputs.source_comment_id != '' || inputs.source_pr_number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
          REQUESTED_REF: ${{ inputs.target_ref }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          node scripts/github-comment-source.mjs verify-pr \
            "$SOURCE_PR_NUMBER" "$SOURCE_COMMENT_ID" "$REQUESTED_REF" "$REQUESTED_SHA"
      - name: Resolve immutable branch/SHA target
        id: pin
        env:
          REQUESTED_REF: ${{ inputs.target_ref }}
          # Scheduled Full and default manual Main runs pin the immutable
          # event SHA even if Main advances before the runner starts (#3465).
          # An explicitly supplied SHA stays explicit; manual non-Main refs
          # without SHA still select the live ref tip for investigation.
          REQUESTED_SHA: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target_ref == 'main' && inputs.target_sha == '')) && github.sha || inputs.target_sha }}
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          [[ -n "$ref" ]] || ref=main
          [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,120}$ ]] || exit 1
          [[ "$ref" != *..* && "$ref" != *//* && "$ref" != *.lock ]] || exit 1
          git fetch --no-tags origin "refs/heads/$ref"
          tip="$(git rev-parse FETCH_HEAD)"
          sha="$REQUESTED_SHA"
          [[ -n "$sha" ]] || sha="$tip"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "$sha^{commit}"
          git merge-base --is-ancestor "$sha" "$tip" || {
            echo "::error::Requested SHA is not reachable from the branch"
            exit 1
          }
          git checkout --detach "$sha"
          [[ "$(git rev-parse HEAD)" == "$sha" ]] || exit 1
          echo "target_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Full Regression target: $ref @ $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: "."
          cache-all-crates: "true"
      - uses: extractions/setup-just@v2
      - name: Prepare tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Full regression runs at a pinned exact SHA: cache the matching browser
      # revision only after resolving and checking out that SHA (#2525).
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Build Web and prepare E2E npm runtime
        run: |
          (cd web && npm ci && npm run build)
          (cd e2e && npm ci)
      # One browser environment for every visual comparison. `E2E / Tests`
      # produces the committed baselines and runs the selected suites on this
      # pinned runner image without Playwright's `--with-deps` package set
      # (#2525). Installing that set here made the release verifier render a
      # font-fallback-sensitive transcript one pixel away from the baseline the
      # same SHA produces under `E2E / Tests` (#2596). The image supplies the
      # launch libraries and this probe proves them; do not reintroduce apt.
      - name: Prepare Full Chromium
        id: browser-setup
        run: |
          set -euo pipefail
          cd e2e
          npx playwright install chromium
          node -e 'const { chromium } = require("@playwright/test"); chromium.launch({ timeout: 30000 }).then(browser => browser.close()).catch(error => { console.error(error); process.exitCode = 1; })'
      - name: Build Rust binaries
        run: cargo build -p nession-server -p nession-agent
      - name: Run full canonical Playwright suite at pinned SHA
        env:
          CI: true
          NESSION_TARGET_SHA: ${{ steps.pin.outputs.target_sha }}
          E2E_PLAYWRIGHT_REPORT_FILE: ${{ runner.temp }}/full-regression-playwright.json
          E2E_PLAYWRIGHT_ASSERTIONS_FILE: ${{ runner.temp }}/full-regression-assertions.json
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$NESSION_TARGET_SHA" ]] || exit 1
          ./gates/run e2e-playwright
      - name: Verify complete per-ID assertions
        env:
          TARGET_SHA: ${{ steps.pin.outputs.target_sha }}
        run: |
          node e2e/runner/e2e-full-per-id-receipt.mjs verify \
            "$RUNNER_TEMP/full-regression-playwright.json" \
            "$RUNNER_TEMP/full-regression-assertions.json" "$TARGET_SHA"
      - name: Emit non-authoritative failed-run diagnostic candidate
        if: always() && steps.pin.outputs.target_sha != ''
        env:
          PINNED_SHA: ${{ steps.pin.outputs.target_sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node "$RUNNER_TEMP/e2e-full-failure-manifest.mjs" emit \
            "$RUNNER_TEMP/full-regression-playwright.json" \
            "$RUNNER_TEMP/full-regression-failure-candidate.json" \
            "$PINNED_SHA" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"
      - name: Preserve full regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/full-regression-playwright.json
            ${{ runner.temp }}/full-regression-assertions.json
            ${{ runner.temp }}/full-regression-failure-candidate.json
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14
