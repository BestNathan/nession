name: AI Native Research Pilot T01

on:
  push:
    branches:
      - research/ai-native-a-t01-pilot

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm test -- src/app/__tests__/integration/useVisibilityReconnect.test.ts
      - run: cd web && npm run build
      - run: cd web && npm run lint
