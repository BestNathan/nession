name: Requirement Acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  acceptance-pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Self-test acceptance validator
        run: node scripts/requirement-acceptance.mjs self-test
      - name: Validate closing requirement issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/requirement-acceptance.mjs pr-gate

  acceptance-close-guard:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Self-test acceptance validator
        run: node scripts/requirement-acceptance.mjs self-test
      - name: Guard completed requirement closure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/requirement-acceptance.mjs issue-close-guard
