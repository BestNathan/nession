name: CI/CD

on:
  push:
    branches: ['feat/**', 'fix/**']

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Check — lint + test (fail fast)
  # ═══════════════════════════════════════════════════════════════════
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: just check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - run: cd web && npm ci
      - run: just web-lint
      - run: just web-test

  # ═══════════════════════════════════════════════════════════════════
  # Versions
  # ═══════════════════════════════════════════════════════════════════
  versions:
    needs: [rust-check, web-check]
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.versions.outputs.rust_version }}
      web_version: ${{ steps.versions.outputs.web_version }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: versions
        run: |
          RUST_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          WEB_VER=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "rust_version=${RUST_VER}" >> $GITHUB_OUTPUT
          echo "web_version=${WEB_VER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Rust: ${RUST_VER}, Web: ${WEB_VER}, SHA: ${SHORT_SHA}"

  # ═══════════════════════════════════════════════════════════════════
  # Build web UI
  # ═══════════════════════════════════════════════════════════════════
  build-web:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # amd64 — hash tags only
  # ═══════════════════════════════════════════════════════════════════
  build-amd64:
    needs: [versions, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/web-dist

      - name: Set image refs
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: actions/cache@v4
        id: cache-zig-amd64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-x86_64

      - name: Install zig
        if: steps.cache-zig-amd64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-x86_64-0.14.0 /usr/local/zig-0.14.0

      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig

      - uses: actions/cache@v4
        id: cache-zigbuild-amd64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-x86_64

      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-amd64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        env:
          IMAGE_TAG: ${{ needs.versions.outputs.short_sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/x86_64-unknown-linux-gnu/release/nession-server /tmp/server-bin/
          cp target/x86_64-unknown-linux-gnu/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

      - name: Build & push agent (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

      - name: Build & push UI (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ═══════════════════════════════════════════════════════════════════
  # arm64 — hash tags only
  # ═══════════════════════════════════════════════════════════════════
  build-arm64:
    needs: [versions, build-web]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/web-dist

      - name: Set image refs
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: actions/cache@v4
        id: cache-zig-arm64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-aarch64

      - name: Install zig
        if: steps.cache-zig-arm64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-aarch64-0.14.0 /usr/local/zig-0.14.0

      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig

      - uses: actions/cache@v4
        id: cache-zigbuild-arm64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-aarch64

      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-arm64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        env:
          IMAGE_TAG: ${{ needs.versions.outputs.short_sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/aarch64-unknown-linux-gnu/release/nession-server /tmp/server-bin/
          cp target/aarch64-unknown-linux-gnu/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

      - name: Build & push agent (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

      - name: Build & push UI (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ═══════════════════════════════════════════════════════════════════
  # Merge multi-arch manifests (hash tags only)
  # ═══════════════════════════════════════════════════════════════════
  merge:
    needs: [versions, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch hash manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"

          for prefix in server agent ui; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${SHORT_SHA} \
              ${IMG}:${prefix}-${SHORT_SHA}-amd64 ${IMG}:${prefix}-${SHORT_SHA}-arm64
          done

  # ═══════════════════════════════════════════════════════════════════
  # Update staging kustomize (writes to main branch)
  # ═══════════════════════════════════════════════════════════════════
  update-staging-kustomize:
    needs: [versions, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - run: |
          cd k8s/overlays/staging
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"
          kustomize edit set image \
            ghcr.io/${OWNER_LOWER}/nession-server=ghcr.io/${OWNER_LOWER}/nession:server-${SHORT_SHA} \
            ghcr.io/${OWNER_LOWER}/nession-agent=ghcr.io/${OWNER_LOWER}/nession:agent-${SHORT_SHA} \
            ghcr.io/${OWNER_LOWER}/nession-ui=ghcr.io/${OWNER_LOWER}/nession:ui-${SHORT_SHA}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No change to staging overlay — skipping."
          else
            git commit -m "chore: update staging image tags (sha=${{ needs.versions.outputs.short_sha }}) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep 2
            done
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Cleanup — keep images for the last 5 commits (per component)
  #
  # Each CI run pushes ~9 Docker tags (server/agent/ui × amd64/arm64 ×
  # hash + multi-arch manifests).  All arch variants of one logical
  # version (e.g. server-01989cf-amd64, server-01989cf-arm64, and the
  # multi-arch server-01989cf) count as ONE group — we strip the arch
  # suffix to normalise, keep the 5 newest groups, and delete the rest.
  # Moving tags (server-main, server-latest, etc.) are never touched.
  # ═══════════════════════════════════════════════════════════════════
  cleanup-ghcr:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old package versions (keep last 5 logical versions)
        env:
          KEEP: 5
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PACKAGE="nession"

          echo "Fetching versions for ${OWNER}/${PACKAGE}..."
          # Return {id, created, norm_tag} for every hash-tagged version.
          # norm_tag strips -amd64/-arm64 so arch variants of the same SHA
          # group together.  Versions with null / missing tags are skipped.
          VERSIONS=$(gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
              --paginate \
              -q '.[] | (.metadata.container.tags // []) as $t |
                  [ $t[] | select(test("^(server|agent|ui)-[0-9a-f]{7,}")) ] |
                  if length > 0 then
                    { id: .id,
                      created: .created_at,
                      norm: (.[0] | sub("-amd64$";"") | sub("-arm64$";"")) }
                  else empty end' 2>/dev/null) || true

          if [ -z "$VERSIONS" ]; then
            echo "No hash-tagged versions found — skipping cleanup."
            exit 0
          fi

          # Group by norm_tag, keep the 5 newest groups, delete the rest.
          TO_DELETE=$(echo "$VERSIONS" | jq -s \
            "group_by(.norm) |
             map({ ids: [.[].id] | unique, created: max_by(.created).created }) |
             sort_by(.created) | reverse |
             .[${KEEP}:] | [.[].ids[]]" 2>/dev/null) || true

          if [ "$TO_DELETE" = "[]" ] || [ -z "$TO_DELETE" ]; then
            echo "Nothing to delete (≤ ${KEEP} logical-version groups)."
            exit 0
          fi

          echo "$TO_DELETE" | jq -r '.[]' | while read -r ID; do
            [ -z "$ID" ] && continue
            echo "Deleting version ${ID}"
            gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions/${ID}" \
              -X DELETE --silent 2>/dev/null || echo "  ⚠ Failed"
          done

          DELETED=$(echo "$TO_DELETE" | jq 'length')
          echo "Cleanup complete. Deleted ${DELETED} package versions."
