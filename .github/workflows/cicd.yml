name: CI/CD

on:
  push:
    branches: ['feat/**', 'fix/**']

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Check — lint + test (fail fast)
  # ═══════════════════════════════════════════════════════════════════
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - run: cargo install cargo-llvm-cov 2>/dev/null || true
      - run: just check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - run: cd web && npm ci
      - run: just web-lint
      - run: just web-test

  # ═══════════════════════════════════════════════════════════════════
  # Versions
  # ═══════════════════════════════════════════════════════════════════
  versions:
    needs: [rust-check, web-check]
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.versions.outputs.rust_version }}
      web_version: ${{ steps.versions.outputs.web_version }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: versions
        run: |
          RUST_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          WEB_VER=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "rust_version=${RUST_VER}" >> $GITHUB_OUTPUT
          echo "web_version=${WEB_VER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Rust: ${RUST_VER}, Web: ${WEB_VER}, SHA: ${SHORT_SHA}"

  # ═══════════════════════════════════════════════════════════════════
  # Build web UI
  # ═══════════════════════════════════════════════════════════════════
  build-web:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # amd64 — hash tags only
  # ═══════════════════════════════════════════════════════════════════
  build-amd64:
    needs: [versions, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/web-dist

      - name: Set image refs
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

      - name: Build & push agent (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

      - name: Build & push UI (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            web-dist=/tmp/web-dist

  # ═══════════════════════════════════════════════════════════════════
  # arm64 — hash tags only
  # ═══════════════════════════════════════════════════════════════════
  build-arm64:
    needs: [versions, build-web]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/web-dist

      - name: Set image refs
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }

      - run: cargo build --release --bin nession-server --bin nession-agent
      - run: |
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/release/nession-server /tmp/server-bin/
          cp target/release/nession-agent /tmp/agent-bin/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

      - name: Build & push agent (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

      - name: Build & push UI (hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            web-dist=/tmp/web-dist

  # ═══════════════════════════════════════════════════════════════════
  # Merge multi-arch manifests (hash tags only)
  # ═══════════════════════════════════════════════════════════════════
  merge:
    needs: [versions, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch hash manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"

          for prefix in server agent ui; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${SHORT_SHA} \
              ${IMG}:${prefix}-${SHORT_SHA}-amd64 ${IMG}:${prefix}-${SHORT_SHA}-arm64
          done

  # ═══════════════════════════════════════════════════════════════════
  # Update staging kustomize (writes to main branch)
  # ═══════════════════════════════════════════════════════════════════
  update-staging-kustomize:
    needs: [versions, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - run: |
          cd k8s/overlays/staging
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"
          kustomize edit set image \
            ghcr.io/${OWNER_LOWER}/nession-server=ghcr.io/${OWNER_LOWER}/nession:server-${SHORT_SHA} \
            ghcr.io/${OWNER_LOWER}/nession-agent=ghcr.io/${OWNER_LOWER}/nession:agent-${SHORT_SHA} \
            ghcr.io/${OWNER_LOWER}/nession-ui=ghcr.io/${OWNER_LOWER}/nession:ui-${SHORT_SHA}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No change to staging overlay — skipping."
          else
            git commit -m "chore: update staging image tags (sha=${{ needs.versions.outputs.short_sha }}) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break || sleep 2
            done
          fi

  # ═══════════════════════════════════════════════════════════════════
  # Cleanup — keep last 5 GHCR hash-tagged versions
  # ═══════════════════════════════════════════════════════════════════
  cleanup-ghcr:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old package versions (keep last 5)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PACKAGE="nession"

          echo "Fetching versions for ${OWNER}/${PACKAGE}..."
          VERSIONS=$(gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
            --paginate \
            -q 'sort_by(.created_at) | reverse | .[].id' 2>/dev/null || echo "")

          if [ -z "$VERSIONS" ]; then
            echo "No versions found — skipping cleanup."
            exit 0
          fi

          COUNT=0
          for ID in $VERSIONS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 5 ]; then
              echo "Deleting version ${ID} (position: ${COUNT})"
              gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions/${ID}" \
                -X DELETE --silent 2>/dev/null || echo "  ⚠ Failed to delete version ${ID}"
            else
              echo "Keeping version ${ID} (position: ${COUNT})"
            fi
          done

          echo "Cleanup complete. Deleted $((COUNT > 5 ? COUNT - 5 : 0)) old versions."
