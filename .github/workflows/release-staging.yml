name: Release / Staging Artifacts

# Repository Cargo config enables a local-only rustc wrapper. CI deliberately
# bypasses it and keeps using setup-rust-toolchain / rust-cache. This preserves
# the measured #126 decision: sccache on GHA had a 0–3% hit rate and competed
# for the Actions cache quota.
env:
  RUSTC_WRAPPER: ""
  AGENT_DEBIAN_BASE_IMAGE: "debian:bookworm-20261104-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc"
  AGENT_NODESOURCE_GPG_FINGERPRINT: "6F71F525282841EEDAF851B42F59B5F99B1BE0B4"
  AGENT_NODEJS_VERSION: "22.23.5-1nodesource1"
  AGENT_CLAUDE_CODE_VERSION: "2.1.323"
  AGENT_TMUX_VERSION: "3.6b"
  EROFS_UTILS_VERSION: "1.9.4"
  EROFS_UTILS_SHA256: "7d135aa2550326a5acf20f53c518aea5a8900015ce50700044e40f818c31dd80"


on:
  push:
    branches: ['staging']
    # None of these reach a staging image: staging builds only the .prebuilt
    # Dockerfiles, which copy deploy/*, the zigbuild binary and web/dist.
    #
    # A push mixing these with code still builds — paths-ignore only skips a
    # push whose entire file set is ignored. (Deploys no longer write to main:
    # deploy-staging-gitops pushes a deploy commit to the gitops branch, which
    # this workflow's paths-ignore cannot loop on.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.githooks/**'
      - '.github/**'
      - 'LICENSE'
  # Escape hatch for the case paths-ignore skipped a build you actually want
  # (e.g. a workflow fix that needs to take effect on staging). release-production.yml
  # deliberately has no dispatch: without github.event.before, version-check
  # treats the version as changed and would force a full production release.
  workflow_dispatch:

# Serialize staging runs. deploy-staging-gitops pushes to the gitops branch;
# the gitops-writer concurrency group (shared across workflows) plus the
# rebase-retry loop in scripts/gitops-commit.sh handle cross-workflow races.
# Do not cancel in progress.
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Phase 1 — Check (parallel)
  # ═══════════════════════════════════════════════════════════════════
  rust-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
          fallback: none
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - name: Verify Rust and Acceptance Gates
        run: ./gates/run --suite quality-rust

  web-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
          fallback: none
      - run: cd web && npm ci
      - name: Verify Web lint, types and tests
        run: ./gates/run web-eslint web-typecheck web-test-unit web-test-integration

  # ═══════════════════════════════════════════════════════════════════
  # Phase 2 — Versions (gate for all downstream jobs)
  # ═══════════════════════════════════════════════════════════════════
  versions:
    needs: [rust-check, web-check]
    runs-on: ubuntu-24.04
    outputs:
      rust_version: ${{ steps.versions.outputs.rust_version }}
      web_version: ${{ steps.versions.outputs.web_version }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
      terminal_cols: ${{ steps.terminal.outputs.cols }}
      terminal_web_font_size: ${{ steps.terminal.outputs.web_font_size }}
    env:
      # One GitHub repository Variables source (#2557) for both release lanes.
      # Resolve once; the Web bundle and Server/Agent images consume these outputs.
      RELEASE_TERMINAL_COLS: ${{ vars.NESSION_TERMINAL_COLS || '96' }}
      RELEASE_TERMINAL_WEB_FONT_SIZE: ${{ vars.NESSION_TERMINAL_WEB_FONT_SIZE || '14' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unified release version invariant
        run: ./gates/run release-version-consistency

      - id: versions
        run: |
          RUST_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          WEB_VER=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "rust_version=${RUST_VER}" >> $GITHUB_OUTPUT
          echo "web_version=${WEB_VER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Rust: ${RUST_VER}, Web: ${WEB_VER}, SHA: ${SHORT_SHA}"

      - id: terminal
        run: |
          echo "cols=${RELEASE_TERMINAL_COLS}" >> $GITHUB_OUTPUT
          echo "web_font_size=${RELEASE_TERMINAL_WEB_FONT_SIZE}" >> $GITHUB_OUTPUT
          echo "Terminal: cols=${RELEASE_TERMINAL_COLS}, web_max_font=${RELEASE_TERMINAL_WEB_FONT_SIZE}px"

  # ═══════════════════════════════════════════════════════════════════
  # Phase 3 — Build (3 parallel: web + amd64 zigbuild + arm64 zigbuild)
  # ═══════════════════════════════════════════════════════════════════
  build-web:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
        env:
          VITE_NESSION_TERMINAL_COLS: ${{ needs.versions.outputs.terminal_cols }}
          VITE_NESSION_TERMINAL_WEB_FONT_SIZE: ${{ needs.versions.outputs.terminal_web_font_size }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build-amd64:
    needs: versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: actions/cache@v4
        id: cache-zig-amd64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-x86_64
      - name: Install zig
        if: steps.cache-zig-amd64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-x86_64-0.14.0 /usr/local/zig-0.14.0
      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig
      - uses: actions/cache@v4
        id: cache-zigbuild-amd64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-x86_64
      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-amd64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        env:
          IMAGE_TAG: ${{ needs.versions.outputs.short_sha }}
          # head_commit is absent on workflow_dispatch — fall back to run start.
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent --bin nession-mcp
          mkdir -p /tmp/server-bin /tmp/agent-bin /tmp/mcp-bin
          cp target/x86_64-unknown-linux-gnu/release/nession-server /tmp/server-bin/
          cp target/x86_64-unknown-linux-gnu/release/nession-agent /tmp/agent-bin/
          cp target/x86_64-unknown-linux-gnu/release/nession-mcp /tmp/mcp-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: server-bin-amd64
          path: /tmp/server-bin/nession-server
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bin-amd64
          path: /tmp/agent-bin/nession-agent
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-bin-amd64
          path: /tmp/mcp-bin/nession-mcp
          retention-days: 1

  build-arm64:
    needs: versions
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: actions/cache@v4
        id: cache-zig-arm64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-aarch64
      - name: Install zig
        if: steps.cache-zig-arm64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-aarch64-0.14.0 /usr/local/zig-0.14.0
      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig
      - uses: actions/cache@v4
        id: cache-zigbuild-arm64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-aarch64
      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-arm64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        env:
          IMAGE_TAG: ${{ needs.versions.outputs.short_sha }}
          # head_commit is absent on workflow_dispatch — fall back to run start.
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent --bin nession-mcp
          mkdir -p /tmp/server-bin /tmp/agent-bin /tmp/mcp-bin
          cp target/aarch64-unknown-linux-gnu/release/nession-server /tmp/server-bin/
          cp target/aarch64-unknown-linux-gnu/release/nession-agent /tmp/agent-bin/
          cp target/aarch64-unknown-linux-gnu/release/nession-mcp /tmp/mcp-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: server-bin-arm64
          path: /tmp/server-bin/nession-server
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bin-arm64
          path: /tmp/agent-bin/nession-agent
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-bin-arm64
          path: /tmp/mcp-bin/nession-mcp
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # Phase 4 — Docker (8 parallel: server/agent/mcp/ui × amd64/arm64)
  # ═══════════════════════════════════════════════════════════════════

  # ── amd64 ──────────────────────────────────────────────────────────
  docker-server-amd64:
    needs: [versions, build-web, build-amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: server-bin-amd64, path: /tmp/server-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-server-amd64
          cache-to: type=gha,scope=nession-build-server-amd64,mode=min
          build-args: |
            NESSION_TERMINAL_COLS=${{ needs.versions.outputs.terminal_cols }}
            NESSION_TERMINAL_WEB_FONT_SIZE=${{ needs.versions.outputs.terminal_web_font_size }}
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

  docker-agent-amd64:
    needs: [versions, build-web, build-amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: agent-bin-amd64, path: /tmp/agent-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-agent-amd64
          cache-to: type=gha,scope=nession-build-agent-amd64,mode=min
          build-args: |
            NESSION_TERMINAL_COLS=${{ needs.versions.outputs.terminal_cols }}
            AGENT_DEBIAN_BASE_IMAGE=${{ env.AGENT_DEBIAN_BASE_IMAGE }}
            AGENT_NODESOURCE_GPG_FINGERPRINT=${{ env.AGENT_NODESOURCE_GPG_FINGERPRINT }}
            AGENT_NODEJS_VERSION=${{ env.AGENT_NODEJS_VERSION }}
            AGENT_CLAUDE_CODE_VERSION=${{ env.AGENT_CLAUDE_CODE_VERSION }}
            AGENT_TMUX_VERSION=${{ env.AGENT_TMUX_VERSION }}
            EROFS_UTILS_VERSION=${{ env.EROFS_UTILS_VERSION }}
            EROFS_UTILS_SHA256=${{ env.EROFS_UTILS_SHA256 }}
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

  # Standalone MCP host (#3791). A fourth image role with its own lifecycle;
  # nothing about this job adds the service to Server/Agent GitOps workloads.
  docker-mcp-amd64:
    needs: [versions, build-amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mcp-bin-amd64, path: /tmp/mcp-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:mcp-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-mcp-amd64
          cache-to: type=gha,scope=nession-build-mcp-amd64,mode=min
          build-args: |
            NESSION_SOURCE_REVISION=${{ github.sha }}
          build-contexts: |
            mcp-bin=/tmp/mcp-bin

  docker-ui-amd64:
    needs: [versions, build-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-ui-amd64
          cache-to: type=gha,scope=nession-build-ui-amd64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ── arm64 ──────────────────────────────────────────────────────────
  docker-server-arm64:
    needs: [versions, build-web, build-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: server-bin-arm64, path: /tmp/server-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-server-arm64
          cache-to: type=gha,scope=nession-build-server-arm64,mode=min
          build-args: |
            NESSION_TERMINAL_COLS=${{ needs.versions.outputs.terminal_cols }}
            NESSION_TERMINAL_WEB_FONT_SIZE=${{ needs.versions.outputs.terminal_web_font_size }}
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

  docker-agent-arm64:
    needs: [versions, build-web, build-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: agent-bin-arm64, path: /tmp/agent-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-agent-arm64
          cache-to: type=gha,scope=nession-build-agent-arm64,mode=min
          build-args: |
            NESSION_TERMINAL_COLS=${{ needs.versions.outputs.terminal_cols }}
            AGENT_DEBIAN_BASE_IMAGE=${{ env.AGENT_DEBIAN_BASE_IMAGE }}
            AGENT_NODESOURCE_GPG_FINGERPRINT=${{ env.AGENT_NODESOURCE_GPG_FINGERPRINT }}
            AGENT_NODEJS_VERSION=${{ env.AGENT_NODEJS_VERSION }}
            AGENT_CLAUDE_CODE_VERSION=${{ env.AGENT_CLAUDE_CODE_VERSION }}
            AGENT_TMUX_VERSION=${{ env.AGENT_TMUX_VERSION }}
            EROFS_UTILS_VERSION=${{ env.EROFS_UTILS_VERSION }}
            EROFS_UTILS_SHA256=${{ env.EROFS_UTILS_SHA256 }}
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

  docker-mcp-arm64:
    needs: [versions, build-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mcp-bin-arm64, path: /tmp/mcp-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:mcp-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-mcp-arm64
          cache-to: type=gha,scope=nession-build-mcp-arm64,mode=min
          build-args: |
            NESSION_SOURCE_REVISION=${{ github.sha }}
          build-contexts: |
            mcp-bin=/tmp/mcp-bin

  docker-ui-arm64:
    needs: [versions, build-web]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-ui-arm64
          cache-to: type=gha,scope=nession-build-ui-arm64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ═══════════════════════════════════════════════════════════════════
  # Phase 5 — Merge + deploy + cleanup
  # ═══════════════════════════════════════════════════════════════════
  merge:
    needs:
      [versions,
       docker-server-amd64, docker-agent-amd64, docker-mcp-amd64, docker-ui-amd64,
       docker-server-arm64, docker-agent-arm64, docker-mcp-arm64, docker-ui-arm64]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch hash manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"

          for prefix in server agent mcp ui; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${SHORT_SHA} \
              ${IMG}:${prefix}-${SHORT_SHA}-amd64 ${IMG}:${prefix}-${SHORT_SHA}-arm64
          done


  # GHCR provenance only. ACR is an independent deployment.
  provenance:
    needs: [versions, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
      actions: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Emit GHCR build provenance
        run: |
          set -euo pipefail
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"
          digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1"
          }
          images='{}'
          for role in agent mcp server ui; do
            ghcr_digest="$(digest "${GHCR_IMAGE}:${role}-${SHORT_SHA}")"
            images="$(jq -c --arg role "$role" --arg tag "${role}-${SHORT_SHA}" \
              --arg ghcr "$GHCR_IMAGE" --arg ghcr_digest "$ghcr_digest" \
              '. + {($role): {tag: $tag, digests: {($ghcr): $ghcr_digest}}}' \
              <<< "$images")"
          done
          out="${RUNNER_TEMP}/nession-build-provenance.json"
          jq -n --arg sha "${GITHUB_SHA}" --argjson images "$images" \
            --argjson terminal_cols "${{ needs.versions.outputs.terminal_cols }}" \
            --argjson terminal_web_font_size "${{ needs.versions.outputs.terminal_web_font_size }}" \
            '{schema_version:1,kind:"nession_build_provenance",source_sha:$sha,
              terminal_config:{cols:$terminal_cols,web_max_font_size:$terminal_web_font_size},
              images:$images}' > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nession-build-provenance
          path: ${{ runner.temp }}/nession-build-provenance.json
          retention-days: 90
