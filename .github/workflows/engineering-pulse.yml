name: Engineering Pulse

on:
  schedule:
    # Every four hours keeps README reasonably fresh without running on every
    # main commit and materially inflating the Workflow Runs metric it reports.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: engineering-pulse
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify generator
        run: node scripts/generate-engineering-pulse.mjs --self-test

      - name: Generate metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          METRICS_OUTPUT_DIR: ${{ runner.temp }}/engineering-pulse
        run: node scripts/generate-engineering-pulse.mjs

      - name: Publish orphan metrics branch
        env:
          OUT_DIR: ${{ runner.temp }}/engineering-pulse
        run: |
          set -euo pipefail

          for file in metrics.json project-pulse-light.svg project-pulse-dark.svg; do
            if [[ ! -s "${OUT_DIR}/${file}" ]]; then
              echo "✗ generated metric artifact is missing or empty: ${file}"
              echo "  Fix: inspect the Generate metrics step and re-run this workflow."
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated state gets one fresh root commit each time. main never
          # receives counter-only commits, and the metrics branch never grows.
          git switch --orphan metrics
          git rm -rf . >/dev/null 2>&1 || true

          cp "${OUT_DIR}/metrics.json" .
          cp "${OUT_DIR}/project-pulse-light.svg" .
          cp "${OUT_DIR}/project-pulse-dark.svg" .

          git add metrics.json project-pulse-light.svg project-pulse-dark.svg
          git commit -m "metrics: update engineering pulse"
          git push --force origin HEAD:metrics
