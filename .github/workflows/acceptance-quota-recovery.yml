name: Acceptance / Quota Recovery

# Reconcile failures stranded after a temporary GitHub API rate limit.
# Bounded historical discovery; never fabricates an Acceptance verdict.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  recover:
    if: github.repository == 'BestNathan/nession' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: acceptance-pr-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify quota, replay, burst and forged-evidence negatives
        run: node scripts/acceptance-quota-recovery.mjs self-test
      - name: Bounded authenticated failed-job reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/acceptance-quota-recovery.mjs run
