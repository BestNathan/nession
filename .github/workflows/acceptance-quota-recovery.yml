name: Acceptance / Quota Recovery

# Reconcile failures stranded after a temporary GitHub API rate limit.
# Bounded historical discovery; never fabricates an Acceptance verdict.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["CI / Quality Gate"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  recover:
    if: >-
      ${{ github.repository == 'BestNathan/nession' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: acceptance-quota-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify quota, replay, burst and forged-evidence negatives
        run: node scripts/acceptance-quota-recovery.mjs self-test
      - name: Bounded authenticated failed-job reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/acceptance-quota-recovery.mjs run
