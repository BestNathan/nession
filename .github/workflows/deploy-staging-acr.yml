name: Deploy / Staging ACR
# #3674: ACR mirroring is independent and never controls GitOps deployment (#4032).
on:
  push:
    branches: ['staging']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.githooks/**'
      - '.github/**'
      - 'LICENSE'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-staging-acr-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify-source:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    outputs:
      short_sha: ${{ steps.source.outputs.short_sha }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate successful exact-SHA GHCR publishing run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-staging-ghcr-source.mjs wait "$GITHUB_SHA"

  # Mirror published multi-arch GHCR images to ACR, without rebuilding.
  # Copy failures remain truthful ACR-only failures, with no GitOps side effect.
  mirror-acr:
    needs: verify-source
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: [server, agent, mcp, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      GODEBUG: http2client=0
      ACR_REGISTRY: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com
      ACR_IMAGE: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com/n_public/nession
    steps:
      - uses: actions/checkout@v4
      - name: Check ACR credentials
        id: credentials
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          if [[ -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
            echo "::error::ACR staging mirror requires ALIYUN_ACR_USERNAME and ALIYUN_ACR_PASSWORD"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.credentials.outputs.configured == 'true'
        with:
          # imagetools create performs the registry copy inside buildkitd. The
          # job-level/script GODEBUG only reaches the runner and buildx CLI;
          # pass it into the builder so its registry client uses HTTP/1.1 on
          # the cross-border ACR upload path.
          driver-opts: |
            env.GODEBUG=http2client=0
      - uses: docker/login-action@v3
        if: steps.credentials.outputs.configured == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Aliyun dockerauth intermittently resets/TLS-times-out from hosted runners.
      # The bounded script retries transport only and redacts raw auth URLs.
      - name: Log in to ACR with bounded transport retries
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: bash scripts/ci/acr-registry-login.sh "$ACR_REGISTRY"
      - uses: ./.github/actions/install-regctl
        if: steps.credentials.outputs.configured == 'true'
      - name: Mirror and verify multi-arch ${{ matrix.image }} image
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          bash scripts/mirror-container-images.sh "$GHCR_IMAGE" "$ACR_IMAGE" "${{ needs.verify-source.outputs.short_sha }}" "${{ needs.verify-source.outputs.short_sha }}" "${{ matrix.image }}"

  # Bind the exact source SHA to the immutable digest of every registry this
  # build was copied to. ACR provenance is retained for readback/diagnostics;
  # GitOps and deployment identity use GHCR publication independently.
  provenance:
    needs: [verify-source, mirror-acr]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
      actions: write
    env:
      ACR_REGISTRY: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com
      ACR_IMAGE: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com/n_public/nession
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Read authenticated GHCR release provenance
        uses: actions/download-artifact@v4
        with:
          name: nession-build-provenance
          run-id: ${{ needs.verify-source.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-ghcr-provenance
      - name: Emit per-registry build provenance
        run: |
          set -euo pipefail
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          SHORT_SHA="${{ needs.verify-source.outputs.short_sha }}"
          SOURCE="$RUNNER_TEMP/source-ghcr-provenance/nession-build-provenance.json"
          [[ -s "$SOURCE" ]] || { echo "::error::missing authenticated GHCR provenance"; exit 1; }
          jq -e --arg sha "$GITHUB_SHA" --arg ghcr "$GHCR_IMAGE" --arg short "$SHORT_SHA" '
            .schema_version == 1 and .kind == "nession_build_provenance" and
            .source_sha == $sha and
            (.terminal_config.cols | type == "number") and
            (.terminal_config.web_max_font_size | type == "number") and
            (.images | keys == ["agent","mcp","server","ui"]) and
            (. as $doc | all(["agent","mcp","server","ui"][];
              . as $role |
              ($doc.images[$role].tag == ($role+"-"+$short)) and
              ($doc.images[$role].digests[$ghcr] | test("^sha256:[a-f0-9]{64}$"))
            ))
          ' "$SOURCE" >/dev/null || {
            echo "::error::GHCR release artifact is not consistent with original source SHA";
            exit 1;
          }
          digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1"
          }
          images='{}'
          for role in agent mcp server ui; do
            ghcr_digest="$(digest "${GHCR_IMAGE}:${role}-${SHORT_SHA}")"
            acr_digest="$(digest "${ACR_IMAGE}:${role}-${SHORT_SHA}")"
            expected_ghcr="$(jq -r --arg role "$role" --arg ghcr "$GHCR_IMAGE" '.images[$role].digests[$ghcr]' "$SOURCE")"
            [[ "$ghcr_digest" == "$expected_ghcr" ]] || {
              echo "::error::live GHCR tag digest differs from authenticated source artifact";
              exit 1;
            }
            images="$(jq -c --arg role "$role" --arg tag "${role}-${SHORT_SHA}" \
              --arg ghcr "$GHCR_IMAGE" --arg ghcr_digest "$ghcr_digest" \
              --arg acr "$ACR_IMAGE" --arg acr_digest "$acr_digest" \
              '. + {($role): {tag: $tag, digests: {($ghcr): $ghcr_digest, ($acr): $acr_digest}}}' \
              <<< "$images")"
          done
          out="${RUNNER_TEMP}/nession-build-provenance.json"
          jq -n --arg sha "${GITHUB_SHA}" --argjson images "$images" \
            --argjson terminal_config "$(jq -c '.terminal_config' "$SOURCE")" \
            '{schema_version:1,kind:"nession_build_provenance",source_sha:$sha,
              terminal_config:$terminal_config,images:$images}' > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nession-build-provenance
          path: ${{ runner.temp }}/nession-build-provenance.json
          retention-days: 90

