name: Staging

on:
  push:
    branches: ['staging']
    # Docs and agent-instruction files produce identical images, so building
    # them wastes a full 12-job multi-arch run AND writes a kustomize commit
    # to main, leaving main permanently ahead of staging. A push mixing docs
    # with code still runs — paths-ignore only skips docs-only pushes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.githooks/**'
      - 'LICENSE'

# Serialize staging runs. update-staging-kustomize rebase-merges a PR into
# main; two concurrent runs would race there. Do not cancel in progress —
# a cancelled run can leave a pushed chore/** branch and an open PR behind.
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Phase 1 — Check (parallel)
  # ═══════════════════════════════════════════════════════════════════
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: just check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - run: cd web && npm ci
      - run: just web-lint
      - run: just web-test

  # ═══════════════════════════════════════════════════════════════════
  # Phase 2 — Versions (gate for all downstream jobs)
  # ═══════════════════════════════════════════════════════════════════
  versions:
    needs: [rust-check, web-check]
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.versions.outputs.rust_version }}
      web_version: ${{ steps.versions.outputs.web_version }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: versions
        run: |
          RUST_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          WEB_VER=$(grep '"version"' web/package.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "rust_version=${RUST_VER}" >> $GITHUB_OUTPUT
          echo "web_version=${WEB_VER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Rust: ${RUST_VER}, Web: ${WEB_VER}, SHA: ${SHORT_SHA}"

  # ═══════════════════════════════════════════════════════════════════
  # Phase 3 — Build (3 parallel: web + amd64 zigbuild + arm64 zigbuild)
  # ═══════════════════════════════════════════════════════════════════
  build-web:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build-amd64:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: actions/cache@v4
        id: cache-zig-amd64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-x86_64
      - name: Install zig
        if: steps.cache-zig-amd64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-x86_64-0.14.0 /usr/local/zig-0.14.0
      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig
      - uses: actions/cache@v4
        id: cache-zigbuild-amd64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-x86_64
      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-amd64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        env:
          IMAGE_TAG: ${{ needs.versions.outputs.short_sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/x86_64-unknown-linux-gnu/release/nession-server /tmp/server-bin/
          cp target/x86_64-unknown-linux-gnu/release/nession-agent /tmp/agent-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: server-bin-amd64
          path: /tmp/server-bin/nession-server
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bin-amd64
          path: /tmp/agent-bin/nession-agent
          retention-days: 1

  build-arm64:
    needs: versions
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: actions/cache@v4
        id: cache-zig-arm64
        with:
          path: /usr/local/zig-0.14.0
          key: zig-0.14.0-aarch64
      - name: Install zig
        if: steps.cache-zig-arm64.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz | sudo tar xJ -C /usr/local
          sudo mv /usr/local/zig-linux-aarch64-0.14.0 /usr/local/zig-0.14.0
      - name: Link zig
        run: sudo ln -sf /usr/local/zig-0.14.0/zig /usr/local/bin/zig
      - uses: actions/cache@v4
        id: cache-zigbuild-arm64
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.8-aarch64
      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild-arm64.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked

      - name: cargo zigbuild (release)
        env:
          IMAGE_TAG: ${{ needs.versions.outputs.short_sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31 --bin nession-server --bin nession-agent
          mkdir -p /tmp/server-bin /tmp/agent-bin
          cp target/aarch64-unknown-linux-gnu/release/nession-server /tmp/server-bin/
          cp target/aarch64-unknown-linux-gnu/release/nession-agent /tmp/agent-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: server-bin-arm64
          path: /tmp/server-bin/nession-server
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bin-arm64
          path: /tmp/agent-bin/nession-agent
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════
  # Phase 4 — Docker (6 parallel: server/agent/ui × amd64/arm64)
  # ═══════════════════════════════════════════════════════════════════

  # ── amd64 ──────────────────────────────────────────────────────────
  docker-server-amd64:
    needs: [versions, build-web, build-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: server-bin-amd64, path: /tmp/server-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

  docker-agent-amd64:
    needs: [versions, build-web, build-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: agent-bin-amd64, path: /tmp/agent-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

  docker-ui-amd64:
    needs: [versions, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-amd64
          cache-from: type=gha,scope=nession-build-amd64
          cache-to: type=gha,scope=nession-build-amd64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ── arm64 ──────────────────────────────────────────────────────────
  docker-server-arm64:
    needs: [versions, build-web, build-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: server-bin-arm64, path: /tmp/server-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:server-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            server-bin=/tmp/server-bin
            web-dist=/tmp/web-dist

  docker-agent-arm64:
    needs: [versions, build-web, build-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - uses: actions/download-artifact@v4
        with: { name: agent-bin-arm64, path: /tmp/agent-bin }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:agent-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            agent-bin=/tmp/agent-bin
            web-dist=/tmp/web-dist

  docker-ui-arm64:
    needs: [versions, build-web]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: /tmp/web-dist }
      - run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ needs.versions.outputs.short_sha }}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMG }}:ui-${{ env.SHORT_SHA }}-arm64
          cache-from: type=gha,scope=nession-build-arm64
          cache-to: type=gha,scope=nession-build-arm64,mode=min
          build-contexts: |
            web-dist=/tmp/web-dist

  # ═══════════════════════════════════════════════════════════════════
  # Phase 5 — Merge + deploy + cleanup
  # ═══════════════════════════════════════════════════════════════════
  merge:
    needs:
      [versions,
       docker-server-amd64, docker-agent-amd64, docker-ui-amd64,
       docker-server-arm64, docker-agent-arm64, docker-ui-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch hash manifests
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nession"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"

          for prefix in server agent ui; do
            docker buildx imagetools create -t ${IMG}:${prefix}-${SHORT_SHA} \
              ${IMG}:${prefix}-${SHORT_SHA}-amd64 ${IMG}:${prefix}-${SHORT_SHA}-arm64
          done

  update-staging-kustomize:
    needs: [versions, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - run: |
          cd k8s/overlays/staging
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${{ needs.versions.outputs.short_sha }}"
          kustomize edit set image \
            ghcr.io/${OWNER_LOWER}/nession-server=ghcr.io/${OWNER_LOWER}/nession:server-${SHORT_SHA} \
            ghcr.io/${OWNER_LOWER}/nession-agent=ghcr.io/${OWNER_LOWER}/nession:agent-${SHORT_SHA} \
            ghcr.io/${OWNER_LOWER}/nession-ui=ghcr.io/${OWNER_LOWER}/nession:ui-${SHORT_SHA}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a branch for the kustomize update
          BRANCH_NAME="chore/update-staging-kustomize-${{ needs.versions.outputs.short_sha }}"
          git checkout -b "$BRANCH_NAME"

          git add k8s/overlays/staging/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No change to staging overlay — skipping."
          else
            git commit -m "chore: update staging image tags (sha=${{ needs.versions.outputs.short_sha }}) [skip ci]"
            git push -u origin "$BRANCH_NAME"

            # Create PR with auto-merge
            gh pr create \
              --title "chore: update staging image tags (sha=${{ needs.versions.outputs.short_sha }})" \
              --body "Automated staging kustomize update from CI workflow." \
              --base main \
              --head "$BRANCH_NAME"

            # Merge directly. These chore/** PRs trigger no CI, so GitHub
            # reports them CLEAN immediately and REJECTS auto-merge with
            # "Pull request is in clean status (enablePullRequestAutoMerge)".
            # Whether --auto happens to succeed is a race against GitHub
            # computing mergeStateStatus, so never rely on it here.
            # --rebase, not --squash: preserves the [skip ci] commit message
            # verbatim so this merge cannot re-trigger the workflow.
            PR_NUMBER=$(gh pr view "$BRANCH_NAME" --json number --jq .number)
            gh pr merge "$PR_NUMBER" --rebase
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-ghcr:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old package versions (keep last 5 logical versions)
        env:
          KEEP: 5
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          PACKAGE="nession"

          echo "Fetching versions for ${OWNER}/${PACKAGE}..."
          if ! RAW=$(gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions" --paginate 2>&1); then
            echo "::warning::Cannot list GHCR versions for ${OWNER}/${PACKAGE} — cleanup skipped."
            echo "::warning::The default GITHUB_TOKEN cannot read user-scoped packages;"
            echo "::warning::this step needs a PAT with read:packages + delete:packages."
            echo "$RAW" | head -5
            exit 0
          fi

          # --paginate emits one JSON array per page; -s merges the stream and
          # flatten(1) turns [[page],[page]] into a single array.
          # Bind the version object to $v before filtering tags — after the
          # array construction `.` is the tag list, not the version.
          VERSIONS=$(printf '%s' "$RAW" | jq -c -s 'flatten(1) | .[]
              | . as $v
              | [ (($v.metadata.container.tags // [])[])
                  | select(test("^(server|agent|ui)-[0-9a-f]{7,}")) ] as $hash
              | if ($hash | length) > 0 then
                  { id: $v.id,
                    created: $v.created_at,
                    norm: ($hash[0] | sub("-amd64$";"") | sub("-arm64$";"")) }
                else empty end')

          if [ -z "$VERSIONS" ]; then
            echo "No hash-tagged versions found — skipping cleanup."
            exit 0
          fi

          TO_DELETE=$(echo "$VERSIONS" | jq -s \
            "group_by(.norm) |
             map({ ids: [.[].id] | unique, created: max_by(.created).created }) |
             sort_by(.created) | reverse |
             .[${KEEP}:] | [.[].ids[]]")

          if [ "$TO_DELETE" = "[]" ] || [ -z "$TO_DELETE" ]; then
            echo "Nothing to delete (≤ ${KEEP} logical-version groups)."
            exit 0
          fi

          DELETED=0
          for ID in $(echo "$TO_DELETE" | jq -r '.[]'); do
            [ -z "$ID" ] && continue
            echo "Deleting version ${ID}"
            if gh api "/users/${OWNER}/packages/container/${PACKAGE}/versions/${ID}" -X DELETE --silent; then
              DELETED=$((DELETED + 1))
            else
              echo "::warning::Failed to delete version ${ID}"
            fi
          done

          echo "Cleanup complete. Deleted ${DELETED} package versions."
