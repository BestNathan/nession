name: Metrics / Agent Telemetry Ingest

on:
  # A cancelled pending workflow_run is not retried by GitHub automatically.
  # A bounded main-owned scan recovers missing canonical Agent telemetry.
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Agent / SC Acceptance
      - Acceptance / Orchestrator
      - Agent / Issue Audit
      - Agent / Provider Smoke
    types: [completed]
permissions:
  actions: read
  contents: write

concurrency:
  group: metrics-writer
  cancel-in-progress: false

jobs:
  ingest:
    # Ignore unrelated Orchestrator workflow_run/repository_dispatch wakes.
    # Those are not canonical Agent telemetry producer events and otherwise
    # create repeated privileged runs that fail the source provenance contract.
    if: >-
      github.repository == 'BestNathan/nession' &&
      (
        (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
          (
            (github.event.workflow_run.name == 'Agent / Provider Smoke' &&
             (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
            (github.event.workflow_run.name == 'Agent / SC Acceptance' &&
             github.event.workflow_run.event == 'workflow_dispatch') ||
            (github.event.workflow_run.name == 'Agent / Issue Audit' &&
             (github.event.workflow_run.event == 'issues' || github.event.workflow_run.event == 'workflow_dispatch')) ||
            (github.event.workflow_run.name == 'Acceptance / Orchestrator' &&
             (github.event.workflow_run.event == 'pull_request_target' ||
              github.event.workflow_run.event == 'issues' ||
              github.event.workflow_run.event == 'push'))
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted telemetry tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify telemetry tooling
        working-directory: trusted
        run: |
          ./gates/run agent-workflow-telemetry

      # The same existing writer owns event and scheduled recovery. No user-
      # controlled workflow_dispatch or source-ref-selected privileged code.
      - name: Checkout metrics history
        uses: actions/checkout@v4
        with:
          ref: metrics
          path: metrics-store
          fetch-depth: 0
          persist-credentials: false

      # Read-only preflight: when an authenticated producer emitted no
      # telemetry, reuse this already-running trusted Metrics writer to
      # recover the oldest missed run instead of awaiting GitHub cron.
      # If it did emit telemetry, preserve the original event delivery.
      - name: Detect empty source telemetry
        if: github.event_name == 'workflow_run'
        id: event_artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "${EVENT_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "${EVENT_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}/artifacts?per_page=100" \
            > "${RUNNER_TEMP}/event-source-artifacts.json"
          count="$(node trusted/scripts/agent-telemetry-reconcile.mjs artifact-count \
            "${RUNNER_TEMP}/event-source-artifacts.json" "${EVENT_RUN_ID}" "${EVENT_RUN_ATTEMPT}")"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Select missed trusted Agent telemetry source
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_run' && steps.event_artifacts.outputs.count == '0')
        id: reconcile
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_EMPTY_SOURCE_COUNT: ${{ steps.event_artifacts.outputs.count }}
        run: |
          set -euo pipefail
          node scripts/agent-telemetry-reconcile.mjs select \
            "${GITHUB_WORKSPACE}/metrics-store" > "${RUNNER_TEMP}/reconcile.json"
          run_id="$(jq -r '.run_id // empty' "${RUNNER_TEMP}/reconcile.json")"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${run_id}" ]]; then
            echo "Recovered an authenticated missing source run (id=${run_id})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "No missing authenticated Agent telemetry in bounded recovery window" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Resolve source run
        if: github.event_name == 'workflow_run' || steps.reconcile.outputs.run_id != ''
        id: source
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_RUN_ID: ${{ steps.reconcile.outputs.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Opportunistic recovery may supersede only a source with zero
          # telemetry artifacts; an actual producer with artifacts is never
          # displaced or silently discarded.
          run_id="${RECOVERY_RUN_ID:-${EVENT_RUN_ID:-}}"
          if ! [[ "${run_id}" =~ ^[0-9]+$ ]] || [[ "${run_id}" -le 0 ]]; then
            echo "Invalid workflow run id: ${run_id}" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "${RUNNER_TEMP}/telemetry-source-run.json"
          # GitHub metadata, not Issue text or a scheduled run ID, determines
          # source identity. Validate origin and completion before artifacts.
          jq -e --arg repo "${GITHUB_REPOSITORY}" '
            .repository.full_name == $repo and
            .head_repository.full_name == $repo and
            .status == "completed" and
            (.conclusion == "success" or .conclusion == "failure") and
            (.head_sha | test("^[a-f0-9]{40}$")) and
            (.run_attempt | type == "number" and . > 0)' \
            "${RUNNER_TEMP}/telemetry-source-run.json" > /dev/null
          provenance="$(node trusted/scripts/agent-workflow-telemetry-contract.mjs provenance "${RUNNER_TEMP}/telemetry-source-run.json")"

          run_attempt="$(jq -r '.github_run_attempt' <<<"${provenance}")"
          source_path="$(jq -r '.path' <<<"${provenance}")"
          source_event="$(jq -r '.event' <<<"${provenance}")"
          expected_workflow_id="$(jq -r '.workflow_id' <<<"${provenance}")"

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "run_attempt=${run_attempt}" >> "${GITHUB_OUTPUT}"
          echo "source_path=${source_path}" >> "${GITHUB_OUTPUT}"
          echo "source_event=${source_event}" >> "${GITHUB_OUTPUT}"
          echo "expected_workflow_id=${expected_workflow_id}" >> "${GITHUB_OUTPUT}"

      - name: Discover Agent telemetry artifacts
        if: steps.source.outputs.run_id != ''
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > "${RUNNER_TEMP}/source-artifacts.json"
          count="$(node trusted/scripts/agent-telemetry-reconcile.mjs artifact-count \
            "${RUNNER_TEMP}/source-artifacts.json" "${RUN_ID}" "${RUN_ATTEMPT}")"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          if [[ "${count}" -eq 0 ]]; then
            {
              echo "## Metrics Ingest"
              echo
              echo "- Source run: ${RUN_ID}"
              echo "- Agent telemetry artifacts: 0"
              echo "- Action: nothing to persist"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Download Agent telemetry artifacts
        if: steps.artifacts.outputs.count != '' && steps.artifacts.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agent-telemetry"
          # GitHub lists artifacts from all attempts. A rerun cannot mix
          # older summaries/traces with the newly authenticated attempt.
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "agent-telemetry-*-${RUN_ID}-${RUN_ATTEMPT}" \
            --dir "${RUNNER_TEMP}/agent-telemetry"

      - name: Validate and append immutable telemetry
        if: steps.artifacts.outputs.count != '' && steps.artifacts.outputs.count != '0'
        id: persist
        working-directory: trusted
        env:
          SOURCE_DIR: ${{ runner.temp }}/agent-telemetry
          METRICS_DIR: ${{ github.workspace }}/metrics-store
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          EXPECTED_WORKFLOW_ID: ${{ steps.source.outputs.expected_workflow_id }}
        run: |
          set -euo pipefail
          # Source-run provenance was checked against GitHub API and the
          # trusted allowlist before downloading these untrusted artifacts.
          result="$(node scripts/agent-telemetry-ingest.mjs stage \
            "$SOURCE_DIR" "$METRICS_DIR" "$SOURCE_RUN_ID" \
            "$SOURCE_RUN_ATTEMPT" "$EXPECTED_WORKFLOW_ID" "$GITHUB_REPOSITORY")"
          changed="$(jq -er '.changed' <<<"$result")"
          found="$(jq -er '.found' <<<"$result")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "## Metrics Ingest"
            echo
            echo "- Source run: ${SOURCE_RUN_ID} attempt ${SOURCE_RUN_ATTEMPT}"
            echo "- Canonical workflow ID: ${EXPECTED_WORKFLOW_ID}"
            echo "- Valid telemetry records: ${found}"
            echo "- New immutable records: ${changed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate rolling Agent metrics
        if: steps.artifacts.outputs.count != '' && steps.artifacts.outputs.count != '0' && steps.persist.outputs.changed != '0'
        working-directory: trusted
        run: |
          set -euo pipefail
          node scripts/agent-workflow-telemetry.mjs aggregate             "${GITHUB_WORKSPACE}/metrics-store/raw/workflows"             "${RUNNER_TEMP}/agent-metrics"
          cp "${RUNNER_TEMP}/agent-metrics/agent-metrics.json" "${GITHUB_WORKSPACE}/metrics-store/"
          cp "${RUNNER_TEMP}/agent-metrics/agent-metrics-light.svg" "${GITHUB_WORKSPACE}/metrics-store/"
          cp "${RUNNER_TEMP}/agent-metrics/agent-metrics-dark.svg" "${GITHUB_WORKSPACE}/metrics-store/"

      - name: Mint scoped App token for orphan Run Store updates
        if: vars.RUN_STORE_WRITER_MODE == 'app' && steps.persist.outputs.changed != '' && steps.persist.outputs.changed != '0'
        id: store_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RUN_STORE_WRITER_APP_ID }}
          private-key: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write
      - name: Reject unrecognized writer mode or unavailable App token
        if: steps.persist.outputs.changed != '' && steps.persist.outputs.changed != '0'
        env:
          WRITER_MODE: ${{ vars.RUN_STORE_WRITER_MODE }}
          APP_TOKEN: ${{ steps.store_app.outputs.token }}
        run: |
          set -euo pipefail
          case "$WRITER_MODE" in
            ''|legacy) ;;
            app) [[ -n "$APP_TOKEN" ]] || { echo "::error::No App token; refuse legacy fallback" >&2; exit 1; } ;;
            *) echo "::error::Unsupported RUN_STORE_WRITER_MODE" >&2; exit 1 ;;
          esac

      - name: Commit metrics history
        if: steps.artifacts.outputs.count != '' && steps.artifacts.outputs.count != '0' && steps.persist.outputs.changed != '0'
        working-directory: metrics-store
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          STORE_PUSH_TOKEN: ${{ vars.RUN_STORE_WRITER_MODE == 'app' && steps.store_app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw agent-metrics.json agent-metrics-light.svg agent-metrics-dark.svg
          # Shared immutable Run Store policy: never rewrite or delete old data.
          node "${GITHUB_WORKSPACE}/trusted/scripts/run-store-integrity.mjs" \
            staged metrics "${GITHUB_WORKSPACE}/metrics-store"
          git commit -m "metrics: ingest agent telemetry from run ${SOURCE_RUN_ID}"
          git remote set-url origin "https://x-access-token:${STORE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:metrics
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # A wake-up, not an Acceptance verdict; never loop on Acceptance telemetry.
      - name: Notify Acceptance of durable Provider evidence
        if: >-
          steps.artifacts.outputs.count != '' && steps.artifacts.outputs.count != '0' &&
          steps.persist.outputs.changed != '0' &&
          steps.source.outputs.expected_workflow_id == 'agent-provider-smoke'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          set -euo pipefail
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/agent-provider-smoke.yml" and
            .name == "Agent / Provider Smoke" and
            .event == "push" and .head_branch == "main" and
            .status == "completed" and .conclusion == "success" and
            (.head_sha | test("^[a-f0-9]{40}$"))' \
            "$RUNNER_TEMP/telemetry-source-run.json" > /dev/null
          source_sha="$(jq -er .head_sha "$RUNNER_TEMP/telemetry-source-run.json")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=nession-agent-telemetry-ingested \
            -F "client_payload[source_run_id]=$SOURCE_RUN_ID" \
            -F "client_payload[source_run_attempt]=$SOURCE_RUN_ATTEMPT" \
            -f "client_payload[target_sha]=$source_sha"
          echo "Notified Acceptance: durable Provider telemetry for $source_sha" >> "$GITHUB_STEP_SUMMARY"
