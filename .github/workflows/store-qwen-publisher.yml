name: Store / Qwen Publisher

# #2274: a verified successful *main-owned Store Ingest* is the only wake.
# The original model has no GitHub/Store/Publisher writer credentials.
# The Publisher re-authenticates both original Worker ZIPs, signed Outbox,
# immutable encrypted native Store checkpoint, and exact SHA source bytes.
on:
  workflow_run:
    workflows: ["Store / Agent Development Ingest"]
    branches: [main]
    types: [completed]
  # Only the main-owned Store Ingest may request this after a bot-dispatched
  # Worker suppressed the natural workflow_run chain.
  # Only one exact Owner recovery of an already published, independently
  # authenticated Qwen PR. Not a second PR creation or model Run.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_ingest_run_id:
        description: "Original authenticated Qwen Store Ingest Run, bot/main only"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: trusted-qwen-publisher-${{ github.event.workflow_run.id || inputs.source_ingest_run_id }}-${{ github.event.workflow_run.run_attempt || '1' }}
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.action == 'completed' &&
         (github.event.workflow_run.event == 'workflow_run' ||
          github.event.workflow_run.event == 'issue_comment') &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.run_attempt == 1 &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.path == '.github/workflows/store-agent-development-ingest.yml' &&
         github.event.workflow_run.repository.full_name == 'BestNathan/nession' &&
         github.event.workflow_run.head_repository.full_name == 'BestNathan/nession') ||
        (github.event_name == 'workflow_dispatch' &&
         github.actor == 'github-actions[bot]' &&
         github.run_attempt == 1 &&
         inputs.source_ingest_run_id != '')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      qwen: ${{ steps.select.outputs.qwen }}
      source_artifact: ${{ steps.select.outputs.source_artifact }}
    steps:
      - name: Check the exact independently fetched completed Ingest Run and artifacts
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_INGEST_RUN: ${{ github.event.workflow_run.id || inputs.source_ingest_run_id }}
          SOURCE_INGEST_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "qwen=false" >> "$GITHUB_OUTPUT"
          [[ "$SOURCE_INGEST_RUN" =~ ^[1-9][0-9]{0,14}$ ]]
          for n in $(seq 1 30); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_INGEST_RUN" \
              > "$RUNNER_TEMP/ingest-run.json"
            [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]] && break
            if jq -e '.status == "completed"' "$RUNNER_TEMP/ingest-run.json" >/dev/null; then
              break
            fi
            sleep 3
          done
          jq -e --argjson id "$SOURCE_INGEST_RUN" --arg sha "$SOURCE_INGEST_SHA" '
            .id == $id and ($sha == "" or .head_sha == $sha) and
            .run_attempt == 1 and .status == "completed" and
            .conclusion == "success" and
            (.event == "workflow_run" or .event == "issue_comment" or
              ($sha == "" and .event == "workflow_dispatch" and
               .actor.login == "github-actions[bot]")) and
            .path == ".github/workflows/store-agent-development-ingest.yml" and
            .head_branch == "main" and
            .repository.full_name == "BestNathan/nession" and
            .head_repository.full_name == "BestNathan/nession"
          ' "$RUNNER_TEMP/ingest-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_INGEST_RUN/artifacts?per_page=100" \
            > "$RUNNER_TEMP/ingest-artifacts.json"
          jq -e '.total_count == (.artifacts | length) and .total_count <= 100' \
            "$RUNNER_TEMP/ingest-artifacts.json" >/dev/null
          name="development-qwen-ingest-${SOURCE_INGEST_RUN}-1"
          count="$(jq -r --arg name "$name" '[.artifacts[] | select(.name == $name)] | length' \
            "$RUNNER_TEMP/ingest-artifacts.json")"
          [[ "$count" =~ ^[0-9]+$ ]] && (( count <= 1 ))
          if (( count == 0 )); then
            # Cursor/other Ingest success is intentionally Not Applicable.
            exit 0
          fi
          id="$(jq -er --arg name "$name" '
            [.artifacts[] | select(.name == $name and .expired == false and
              (.digest | test("^sha256:[a-f0-9]{64}$")) and
              (.size_in_bytes > 0 and .size_in_bytes < 32768))] |
            if length == 1 then .[0].id else empty end
          ' "$RUNNER_TEMP/ingest-artifacts.json")"
          [[ "$id" =~ ^[1-9][0-9]*$ ]]
          echo "source_artifact=$id" >> "$GITHUB_OUTPUT"
          echo "qwen=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.qwen == 'true'
    runs-on: ubuntu-24.04
    environment: cursor
    timeout-minutes: 22
    outputs:
      reviewer_issue: ${{ steps.publisher_proof.outputs.reviewer_issue }}
      reviewer_action_id: ${{ steps.publisher_proof.outputs.reviewer_action_id }}
    steps:
      - name: Checkout exact main-owned Publisher script only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate signed Qwen/Store/Publisher negative contracts before secrets
        run: |
          set -euo pipefail
          node scripts/lib/agent/publisher/qwen-trusted-publisher-selftest.mjs
          node scripts/lib/agent/publisher/patch-preflight-selftest.mjs
          node scripts/lib/agent/orchestration/worker-reconcile-selftest.mjs
          ./gates/run run-store-integrity

      - name: Fetch exact trusted Ingest receipt and original Worker ZIPs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ github.event.workflow_run.id || inputs.source_ingest_run_id }}
          RECEIPT_ARTIFACT: ${{ needs.detect.outputs.source_artifact }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPSTREAM" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECEIPT_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM" \
            > "$RUNNER_TEMP/qwen-ingest.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM/artifacts?per_page=100" \
            > "$RUNNER_TEMP/qwen-ingest-artifacts.json"
          name="development-qwen-ingest-${UPSTREAM}-1"
          # The source Artifact is uploaded by Run UPSTREAM (not Artifact ID).
          digest="$(jq -er --arg name "$name" --argjson id "$RECEIPT_ARTIFACT" \
            --argjson run "$UPSTREAM" '
            [.artifacts[] | select(.name == $name and .id == $id and
              .expired == false and .workflow_run.id == $run)] |
            if length == 1 then .[0].digest else empty end
          ' "$RUNNER_TEMP/qwen-ingest-artifacts.json")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT/zip" \
            > "$RUNNER_TEMP/qwen-ingest-receipt.zip"
          actual="$(sha256sum "$RUNNER_TEMP/qwen-ingest-receipt.zip" | cut -d' ' -f1)"
          test "sha256:$actual" = "$digest"
          test "$(unzip -Z1 "$RUNNER_TEMP/qwen-ingest-receipt.zip")" = "development-ingest-receipt.json"
          unzip -p "$RUNNER_TEMP/qwen-ingest-receipt.zip" development-ingest-receipt.json \
            > "$RUNNER_TEMP/qwen-ingest-receipt.json"
          test "$(stat -c '%s' "$RUNNER_TEMP/qwen-ingest-receipt.json")" -le 8192
          worker="$(jq -er .run_id "$RUNNER_TEMP/qwen-ingest-receipt.json")"
          [[ "$worker" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$worker" \
            > "$RUNNER_TEMP/qwen-worker.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$worker/artifacts?per_page=100" \
            > "$RUNNER_TEMP/qwen-worker-artifacts.json"
          for artifact in development-worker-claim development-worker; do
            name="${artifact}-${worker}-1"
            id="$(jq -er --arg name "$name" '
              [.artifacts[] | select(.name == $name and .expired == false)] |
              if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/qwen-worker-artifacts.json")"
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/$artifact.zip"
          done
          node scripts/lib/agent/publisher/qwen-trusted-publisher.mjs source \
            "$RUNNER_TEMP/qwen-worker.json" \
            "$RUNNER_TEMP/qwen-worker-artifacts.json" \
            "$RUNNER_TEMP/development-worker-claim.zip" \
            > "$RUNNER_TEMP/qwen-source.json"
          source_sha="$(jq -er .source_sha "$RUNNER_TEMP/qwen-source.json")"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          task="$(jq -er .task "$RUNNER_TEMP/qwen-source.json")"
          [[ "$task" == implement || "$task" == repair ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "task=$task" >> "$GITHUB_OUTPUT"

      # This checkout is Git data ONLY. No npm install, Bash, hooks, package
      # scripts, source execution or checkout credentials are allowed here.
      # An initial publication applies its patch to the current main base; a
      # Repair applies it to the exact reviewed PR HEAD (the claim input SHA).
      - name: Checkout inert publication source strictly as Git data
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.task == 'repair' && steps.source.outputs.sha || github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Mint repository-scoped Store Writer App token outside model jobs
        id: writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RUN_STORE_WRITER_APP_ID }}
          private-key: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write

      # GITHUB_TOKEN-created PRs do not trigger downstream PR CI; only a
      # distinct installed GitHub App may create the candidate PR.
      - name: Mint separate Publisher GitHub App token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write
          permission-pull-requests: write

      - name: Authenticate original Qwen and publish/reconcile one real PR
        id: publisher_proof
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          STORE_APP_TOKEN: ${{ steps.writer.outputs.token }}
          STORE_WRITER_PRIVATE_KEY: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          PUBLISHER_GITHUB_TOKEN: ${{ steps.publisher.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STORE_APP_TOKEN" && test -n "$PUBLISHER_GITHUB_TOKEN"
          test "$STORE_APP_TOKEN" != "$PUBLISHER_GITHUB_TOKEN"
          export AGENT_STORE_CONTROLLER_REMOTE="https://x-access-token:${STORE_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node scripts/lib/agent/publisher/qwen-trusted-publisher.mjs publish \
            "$RUNNER_TEMP/qwen-ingest.json" \
            "$RUNNER_TEMP/qwen-ingest-receipt.json" \
            "$RUNNER_TEMP/qwen-worker.json" \
            "$RUNNER_TEMP/qwen-worker-artifacts.json" \
            "$RUNNER_TEMP/development-worker-claim.zip" \
            "$RUNNER_TEMP/development-worker.zip" \
            "$GITHUB_WORKSPACE/source" \
            > "$RUNNER_TEMP/qwen-publisher-result.json"
          jq -e '
            .schema_version == 1 and .kind == "trusted_qwen_publisher_handoff" and
            (.status == "reviewer_pending" or .status == "replayed") and
            .issue > 0 and .pull_request > 0 and
            (.pr_head_sha | test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/qwen-publisher-result.json" >/dev/null
          {
            echo "## Signed Qwen Developer → Store CAS → Publisher PR → Reviewer"
            echo "- Worker Run: $(jq -r .developer_run_id "$RUNNER_TEMP/qwen-publisher-result.json")"
            echo "- Published PR: $(jq -r .pull_request "$RUNNER_TEMP/qwen-publisher-result.json")"
            echo "- Result: $(jq -r .status "$RUNNER_TEMP/qwen-publisher-result.json")"
            echo "- Reviewer Action: $(jq -r .reviewer_action_id "$RUNNER_TEMP/qwen-publisher-result.json")"
            echo "- No model code or native plaintext was executed by this job."
          } >> "$GITHUB_STEP_SUMMARY"

          # A model-free job may only request Controller dispatch of the
          # immutable Reviewer Outbox emitted by this authenticated Publisher.
          reviewer_action="$(jq -r '.reviewer_action_id // ""' "$RUNNER_TEMP/qwen-publisher-result.json")"
          if [[ "$reviewer_action" =~ ^[a-f0-9]{64}$ ]]; then
            echo "reviewer_action_id=$reviewer_action" >> "$GITHUB_OUTPUT"
            echo "reviewer_issue=$(jq -er .issue "$RUNNER_TEMP/qwen-publisher-result.json")" >> "$GITHUB_OUTPUT"
          fi

          # This proof is minted only by the previously trusted main-only
          # Publisher. A repair or replay must not forge a fresh Store writer
          # receipt. The original immutable artifact remains the authority.
          if jq -e '
            (.producer_result_path // "" |
              test("^workflows/issues/[1-9][0-9]*/producer-results-v2/[1-9][0-9]*-[1-9][0-9]*-[a-f0-9]{64}\\.json$")) and
            (.producer_result_sha256 // "" | test("^[a-f0-9]{64}$")) and
            (.store_commit_sha // "" | test("^[a-f0-9]{40}$")) and
            .publisher_run_id == (env.GITHUB_RUN_ID | tonumber)
          ' "$RUNNER_TEMP/qwen-publisher-result.json" >/dev/null; then
            echo "source_v2=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_v2=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish bounded Developer v2 producer and Store writer receipt
        if: steps.publisher_proof.outputs.source_v2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qwen-developer-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-publisher-result.json
          retention-days: 90
          if-no-files-found: error

  # #3550: the Publisher job never gets an Actions writer. Only this separate,
  # credential-free job asks the existing main-owned Controller to authenticate
  # and CAS-dispatch the exact Reviewer Outbox. GitHub suppresses recursive
  # workflow_run delivery for GITHUB_TOKEN-started workflows.
  wake-reviewer:
    needs: publish
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.reviewer_action_id != '' &&
      needs.publish.outputs.reviewer_issue != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request existing signed Controller dispatch, no Store or model credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_ISSUE: ${{ needs.publish.outputs.reviewer_issue }}
          REVIEWER_ACTION: ${{ needs.publish.outputs.reviewer_action_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$REVIEWER_ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEWER_ACTION" =~ ^[a-f0-9]{64}$ ]]
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/agent-controller-dispatch.yml/dispatches" \
            -f ref=main \
            -f "inputs[issue_number]=$REVIEWER_ISSUE" \
            -f "inputs[action_id]=$REVIEWER_ACTION" \
            -f "inputs[source_publisher_run_id]=$GITHUB_RUN_ID"

  # #3885: one-shot Owner/main Issue command to reconcile original Publisher
  # Run #44281178406 and already-existing PR #3919 via GET-only PR readback.
  # The original signed Worker, checkpoint and immutable Store Intent are
  # independently verified again before the Store CAS can create a Reviewer.
  reconcile-original:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event_name == 'issue_comment' &&
      github.actor == 'BestNathan' &&
      github.event.action == 'created' &&
      github.event.issue.number == 3784 &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'BestNathan' &&
      github.event.comment.body == '/nession reconcile-qwen-pr issue=3784 publisher_run=44281178406 pr=3919'
    runs-on: ubuntu-24.04
    environment: cursor
    timeout-minutes: 18
    steps:
      - name: Checkout authenticated main recovery code, never PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove GET-only recovery and original Publisher trust negatives before secrets
        run: |
          set -euo pipefail
          node scripts/lib/agent/publisher/qwen-trusted-publisher-selftest.mjs
          node scripts/lib/agent/publisher/qwen-github-publish-selftest.mjs
          ./gates/run run-store-integrity

      - name: Fetch immutable original Publisher, Ingest and Worker proof as inert data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44281178406" \
            > "$RUNNER_TEMP/qwen-original-publisher.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44281178406/jobs?per_page=100" \
            > "$RUNNER_TEMP/qwen-original-publisher-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44281068067" \
            > "$RUNNER_TEMP/qwen-original-ingest.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44281068067/artifacts?per_page=100" \
            > "$RUNNER_TEMP/qwen-original-ingest-artifacts.json"
          # Only one authenticated exact-name receipt. Verify ZIP SHA256 before
          # extracting this single bounded JSON member.
          receipt_id="$(jq -er '
            [.artifacts[] | select(
              .name == "development-qwen-ingest-44281068067-1" and
              .expired == false and
              (.digest | test("^sha256:[a-f0-9]{64}$")) and
              .size_in_bytes > 0 and .size_in_bytes < 32768 and
              .workflow_run.id == 44281068067)] |
            if length == 1 then .[0].id else empty end
          ' "$RUNNER_TEMP/qwen-original-ingest-artifacts.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$receipt_id/zip" \
            > "$RUNNER_TEMP/qwen-original-receipt.zip"
          receipt_digest="$(jq -er --argjson id "$receipt_id" \
            '.artifacts[] | select(.id == $id) | .digest' \
            "$RUNNER_TEMP/qwen-original-ingest-artifacts.json")"
          test "sha256:$(sha256sum "$RUNNER_TEMP/qwen-original-receipt.zip" | cut -d' ' -f1)" = "$receipt_digest"
          test "$(unzip -Z1 "$RUNNER_TEMP/qwen-original-receipt.zip")" = "development-ingest-receipt.json"
          unzip -p "$RUNNER_TEMP/qwen-original-receipt.zip" development-ingest-receipt.json \
            > "$RUNNER_TEMP/qwen-original-receipt.json"
          test "$(stat -c '%s' "$RUNNER_TEMP/qwen-original-receipt.json")" -le 8192
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44259490499" \
            > "$RUNNER_TEMP/qwen-original-worker.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44259490499/artifacts?per_page=100" \
            > "$RUNNER_TEMP/qwen-original-worker-artifacts.json"
          for kind in development-worker-claim development-worker; do
            name="$kind-44259490499-1"
            artifact_id="$(jq -er --arg name "$name" '
              [.artifacts[] | select(.name == $name and .expired == false and
                (.digest | test("^sha256:[a-f0-9]{64}$")) and
                .size_in_bytes > 0 and .workflow_run.id == 44259490499)] |
              if length == 1 then .[0].id else empty end
            ' "$RUNNER_TEMP/qwen-original-worker-artifacts.json")"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$RUNNER_TEMP/$kind.zip"
          done
      # This is read-only inert Git data, pinned to the ORIGINAL Publisher's
      # trusted target main SHA. No model, npm, build, or source execution.
      - name: Checkout only the original published PR base as inert source
        uses: actions/checkout@v4
        with:
          ref: ec2984381bda57491d764a9ba3e1123a63b89861
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Mint only the existing Store Writer App token (no Publisher write token)
        id: store_writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RUN_STORE_WRITER_APP_ID }}
          private-key: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
          repositories: nession
          permission-contents: write

      - name: Re-read original PR via GET only and CAS handoff to Reviewer
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          STORE_APP_TOKEN: ${{ steps.store_writer.outputs.token }}
          STORE_WRITER_PRIVATE_KEY: ${{ secrets.RUN_STORE_WRITER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$STORE_APP_TOKEN"
          export AGENT_STORE_CONTROLLER_REMOTE="https://x-access-token:$STORE_APP_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          node scripts/lib/agent/publisher/qwen-publisher-reconcile.mjs recover \
            "$RUNNER_TEMP/qwen-original-publisher.json" \
            "$RUNNER_TEMP/qwen-original-publisher-jobs.json" \
            "$RUNNER_TEMP/qwen-original-ingest.json" \
            "$RUNNER_TEMP/qwen-original-receipt.json" \
            "$RUNNER_TEMP/qwen-original-worker.json" \
            "$RUNNER_TEMP/qwen-original-worker-artifacts.json" \
            "$RUNNER_TEMP/development-worker-claim.zip" \
            "$RUNNER_TEMP/development-worker.zip" \
            "$GITHUB_WORKSPACE/source" \
            > "$RUNNER_TEMP/qwen-pr-get-only-handoff.json"
          jq -e '
            .schema_version == 1 and .kind == "trusted_qwen_get_only_recovery" and
            (.status == "reviewer_pending" or .status == "replayed") and
            .issue == 3784 and .pr == 3919 and
            .original_publisher_run_id == 44281178406 and
            (.pr_head_sha == "5d7e9118b7e954e760cc680fff7d43b4f9e17612")
          ' "$RUNNER_TEMP/qwen-pr-get-only-handoff.json" >/dev/null
          {
