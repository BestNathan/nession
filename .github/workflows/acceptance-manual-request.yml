name: Acceptance / Manual Request
run-name: >-
  ${{ format('Comment Accept #{0} comment:{1}', inputs.issue_number, inputs.source_comment_id) }}

# Exact owner/collaborator /accept recovery. Only the trusted projector may
# mark SC Pass: this comment is a recovery request, not a verdict.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing open native Issue
        required: true
        type: string
      source_comment_id:
        description: Original authorized /accept comment ID
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

concurrency:
  group: acceptance-manual-request-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.repository == 'BestNathan/nession' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted Acceptance implementation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify comment source and canonical Acceptance policy
        run: |
          node scripts/github-comment-source.mjs self-test
          ./gates/run requirement-acceptance-selftest
      - name: Reconcile or dispatch existing stage-qualified Agent Acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/github-comment-source.mjs materialize accept \
            '${{ inputs.issue_number }}' '${{ inputs.source_comment_id }}' \
            "$RUNNER_TEMP/original-comment.json"
          node scripts/issue-lifecycle-reconcile.mjs manual "$RUNNER_TEMP/original-comment.json"
