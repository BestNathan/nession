name: Quality Gate

# Repository Cargo config enables a local-only rustc wrapper. CI deliberately
# bypasses it and keeps using setup-rust-toolchain / rust-cache. This preserves
# the measured #126 decision: sccache on GHA had a 0–3% hit rate and competed
# for the Actions cache quota.
env:
  RUSTC_WRAPPER: ""


on:
  pull_request:
    branches: [staging, main]

# One gate run per PR. Superseded runs are useless, so cancel them.
concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: just check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - name: Verify instruction contract
        run: ./gates/run instruction-contract
      - name: Verify repository tooling
        run: |
          ./gates/run gate-runtime-contract
          ./gates/run agent-workflow-telemetry
          node scripts/requirement-acceptance.mjs self-test
          node scripts/acceptance-case-ingest.mjs self-test
          node scripts/acceptance-ci-evidence.mjs self-test
          node scripts/trusted-case-discovery-selftest.mjs
          node scripts/e2e-run-ingest.mjs self-test
          node scripts/e2e-run-ingest-negative-selftest.mjs
          node scripts/collect-repo-health.mjs --self-test
          node scripts/generate-repo-metrics.mjs --self-test
          node scripts/protocol-gate.mjs --json >/dev/null
          node scripts/issue-contract.mjs self-test
          node e2e/runner/drivers/browser-report.mjs self-test
          node e2e/runner/runtime/full-stack.js self-test
          node e2e/runner/cli-selftest.mjs
          node e2e/scenarios/terminal-attach-resume/reproduce.cjs --self-test
          ./e2e/run --list
          ./e2e/run --validate
          node scripts/issue-audit-agent.mjs self-test
          node scripts/issue-audit-cursor.mjs self-test
      - run: cd web && npm ci
      - run: just design-check full
      - run: just web-lint
      - run: just web-test
