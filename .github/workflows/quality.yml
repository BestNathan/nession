name: Quality Gate

on:
  pull_request:
    branches: [staging]

# One gate run per PR. Superseded runs are useless, so cancel them.
concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { cache-workspaces: ".", cache-all-crates: "true" }
      - uses: extractions/setup-just@v2
      - run: jq --version
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-v1
      - run: which cargo-llvm-cov || cargo install cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - run: just check

  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - run: cd web && npm ci
      - run: just web-lint
      - run: just web-test
