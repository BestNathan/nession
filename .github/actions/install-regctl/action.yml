# Single owner of the pinned regctl install recipe (#4593).
# scripts/mirror-container-images.sh fails closed without regctl on PATH when
# the bounded buildx copy hits its transfer deadline and the chunked OCI
# fallback takes over. Every workflow that invokes that script must consume
# this action before the mirror step, under the same credentials condition.
# Aliyun dockerauth intermittently resets/TLS-times-out from hosted runners;
# the chunked fallback with shrinking chunks and content-addressed blob resume
# is the transport-recovery path, and it requires this exact pinned binary.
name: Install pinned regctl chunked-OCI fallback
description: SHA256-pinned regclient regctl for the mirror script's chunked ACR fallback.
runs:
  using: composite
  steps:
    - name: Install pinned regctl chunked-OCI fallback
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 --max-time 60 \
          -o "$RUNNER_TEMP/regctl" \
          https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
        echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  $RUNNER_TEMP/regctl" |
          sha256sum -c -
        chmod 755 "$RUNNER_TEMP/regctl"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"