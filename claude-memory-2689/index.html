<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Nession · Claude Code Memory Markdown reader · #2689 / #2742</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app" class="app" data-page="terminal">
  <header class="top">
    <button id="sessions-open" class="top-icon" type="button" aria-label="打开 Sessions" title="Sessions">☰</button>
    <div class="brand"><span class="brand-symbol">n</span><strong>nession</strong></div>
    <span class="top-divider"></span>
    <span id="session-heading" class="session-heading"></span>
    <span class="top-right"><span class="mock-label">PROTOTYPE · MOCK DATA</span><button id="reset" type="button" class="text-button">重置</button></span>
  </header>
  <div class="work-region">
    <aside class="web-rail" aria-label="收起的导航">
      <button id="rail-expand" class="rail-expand" type="button" aria-label="展开 Sessions">☰</button>
      <div class="rail-stat" title="7 Sessions"><span>▤</span><small>7</small></div>
      <div class="rail-stat" title="3 Agents · 2 online"><span>◇</span><small>3</small></div>
    </aside>
    <section id="terminal" class="terminal" aria-label="Terminal">
      <div id="terminal-lines" class="terminal-lines"></div>
      <div id="terminal-dock" class="terminal-dock">
        <div id="context-surface" class="context-surface" hidden></div>
        <div class="dock-pair">
          <div class="conversation-capsule">
            <button id="context-trigger" type="button" class="plus" aria-label="打开能力列表" aria-expanded="false">+</button>
            <input id="intent-input" aria-label="Ask Nession" placeholder="Ask Nession…" autocomplete="off">
            <button id="intent-send" class="send" aria-label="发送意图" type="button">↑</button>
          </div>
          <button id="to-workspace" class="circle-nav" type="button" aria-label="打开 Workspace" title="Workspace">▦</button>
        </div>
      </div>
    </section>
    <section id="workspace" class="workspace" aria-label="Workspace" hidden>
      <div id="workspace-inner" class="workspace-inner"></div>
      <div class="workspace-dock">
        <button id="to-terminal" class="circle-nav" type="button" title="Terminal" aria-label="返回 Terminal">⌘</button>
        <nav id="capability-dock" class="capability-dock" aria-label="Workspace 能力"></nav>
      </div>
    </section>
    <section id="sessions-layer" class="sessions-layer" aria-label="Sessions" hidden>
      <div class="sessions-header">
        <h1>Sessions</h1>
        <button id="sessions-close" type="button" class="text-button">返回工作</button>
      </div>
      <p class="sessions-sub">选择正在进行的工作，不需要先选择 Agent 或 Repository。</p>
      <div id="session-list" class="session-list"></div>
    </section>
  </div>
  <footer class="prototype-meta">
    <span>交互原型 · Markdown 阅读与文件导航使用模拟数据</span>
    <span class="prototype-links"><a href="https://github.com/BestNathan/nession/issues/2742" target="_blank" rel="noopener noreferrer">Reader #2742</a> · <a href="https://github.com/BestNathan/nession/issues/2689" target="_blank" rel="noopener noreferrer">Context #2689</a> · <a href="https://github.com/BestNathan/nession/tree/prototype/claude-memory-2689" target="_blank" rel="noopener noreferrer">View source</a></span>
  </footer>
</div>
<script src="./app.js"></script>
</body>
</html>
