[workspace]
members = [
    "crates/nession-common",
    "crates/nession-server",
    "crates/nession-agent",
    "crates/nession-cli",
]
resolver = "2"

[workspace.package]
version = "0.13.4"
edition = "2021"

[profile.dev]
debug = "line-tables-only"         # keep line numbers for panic location, drop full DWARF
incremental = true

[profile.test]
debug = 0                          # test binaries: zero debug info, fastest compile
opt-level = 0

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
rustls = "0.22"
rustls-pemfile = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
futures-util = "0.3"
tokio-rustls = "0.25"
rand = "0.8"
base64 = "0.21"
portable-pty = "0.8"
async-trait = "0.1"
mime_guess = "2.0"
if-addrs = "0.13"
hostname = "0.4"

# ── Workspace Lints (based on openai/codex codex-rs) ────────────────────
[workspace.lints]
rust = {}

[workspace.lints.clippy]
# Redundant / needless patterns → use idiomatic replacements
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

# Error handling
unwrap_used = "deny"
expect_used = "deny"

# Async safety
await_holding_invalid_type = "deny"
await_holding_lock = "deny"

# Additional quality rules
dbg_macro = "deny"
todo = "deny"
wildcard_imports = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
indexing_slicing = "deny"
