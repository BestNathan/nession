# Per-environment NFS PV/PVC pairs — no subPath anywhere.
# Directories must exist on the NFS server before first sync (bootstrap checklist).
# preprod starts empty: fresh /mnt/share/k8s/preprod{,/claude-home}.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: preprod-data
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    server: 192.168.2.105
    path: /mnt/share/k8s/preprod
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: preprod-data
spec:
  accessModes:
    - ReadWriteMany
  volumeName: preprod-data
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: preprod-claude-home
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    server: 192.168.2.105
    path: /mnt/share/k8s/preprod/claude-home
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: preprod-claude-home
spec:
  accessModes:
    - ReadWriteMany
  volumeName: preprod-claude-home
  resources:
    requests:
      storage: 10Gi
