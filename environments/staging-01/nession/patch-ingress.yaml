# Ingress hosts for staging-01. Backend names carry no suffix — each
# environment runs in its own namespace with base names.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-server
  annotations:
    higress.io/domain: "staging-01.nession.nhome.local staging-01.nession.bestnathan.top"
spec:
  rules:
    - host: staging-01.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-server
                port:
                  number: 10080
    - host: staging-01.nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-server
                port:
                  number: 10080
---
apiVersion: networking.k8s.io/v1
