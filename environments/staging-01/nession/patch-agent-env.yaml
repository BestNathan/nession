# Plain-string service references are not rewritten by kustomize nameReference,
# so the suffixed in-namespace service is stated explicitly.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nession-agent
spec:
  template:
    spec:
      containers:
        - name: nession-agent
          env:
            - name: AGENT_SERVER_URL
              value: "ws://nession-server-staging-01:18080"
            - name: AGENT_CONNECT_URL
              value: "ws://staging-01.agent.nession.nhome.local/ws"
