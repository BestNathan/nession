apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# staging-01 — on-demand SHA-deploy target (deploy.yml).
# Owner model: one shared `nession` namespace; environments are distinguished
# by nameSuffix (staging uses -staging, this lane uses -staging-01). Mirrors the
# staging overlay's shape: the env-agnostic base plus this lane's own PV/PVC
# pairs. Storage reuses the lane's existing NFS dirs so the move keeps data.
namespace: nession

nameSuffix: -staging-01

commonLabels:
  env: staging-01

resources:
- ../../../base/nession
- pv-pvc.yaml

images:
- name: ghcr.io/bestnathan/nession-agent
  newName: ghcr.io/bestnathan/nession
  newTag: agent-ea22b03
- name: ghcr.io/bestnathan/nession-server
  newName: ghcr.io/bestnathan/nession
  newTag: server-ea22b03
- name: ghcr.io/bestnathan/nession-ui
  newName: ghcr.io/bestnathan/nession
  newTag: ui-ea22b03

patchesStrategicMerge:
- patch-imagepullsecrets.yaml
- patch-claims.yaml

patches:
- path: patch-ingress.yaml
- path: patch-agent-env.yaml
