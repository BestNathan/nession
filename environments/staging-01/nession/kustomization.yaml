apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# staging-01 — on-demand SHA-deploy target (deploy.yml): own namespace, own
# NFS dirs, starts empty. Not driven by the staging-branch flow.
namespace: nession-staging-01

commonLabels:
  env: staging-01

resources:
- ../../../base/nession
- pv-pvc.yaml

images:
- name: ghcr.io/bestnathan/nession-agent
  newName: ghcr.io/bestnathan/nession
  newTag: agent-cfb4cc9
- name: ghcr.io/bestnathan/nession-server
  newName: ghcr.io/bestnathan/nession
  newTag: server-cfb4cc9
- name: ghcr.io/bestnathan/nession-ui
  newName: ghcr.io/bestnathan/nession
  newTag: ui-cfb4cc9

patchesStrategicMerge:
- patch-imagepullsecrets.yaml
- patch-claims.yaml

patches:
- path: patch-ingress.yaml
- path: patch-agent-env.yaml
