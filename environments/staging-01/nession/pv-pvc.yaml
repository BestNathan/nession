# Per-environment NFS PV/PVC pairs — no subPath anywhere.
# The paths are the lane's existing dirs from the former per-namespace
# deployment, so moving into namespace nession keeps the data. kustomize
# nameSuffix appends -staging-01 to every PV/PVC name and to the claimName /
# volumeName references.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nession-data
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    server: 192.168.2.105
    path: /mnt/share/k8s/staging-01
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nession-server-data
spec:
  accessModes:
    - ReadWriteMany
  volumeName: nession-data
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nession-claude-home
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    server: 192.168.2.105
    path: /mnt/share/k8s/staging-01/claude-home
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nession-claude-home
spec:
  accessModes:
    - ReadWriteMany
  volumeName: nession-claude-home
  resources:
    requests:
      storage: 10Gi
