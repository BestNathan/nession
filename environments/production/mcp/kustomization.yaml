apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# #4529 pilot: initial CI-published staging candidate, not a production release.
# Production inbound sealing and manifest checks passed; internal-only activation.
# Enroll ingress.yaml only after operator-managed TLS/origin routing is verified.
namespace: nession
commonLabels:
  app: nession
  env: production
resources:
- sealed-inbound.json
- deployment.yaml
- service.yaml
configMapGenerator:
- files:
  - mcp.toml
  name: nession-mcp-production-settings
images:
- name: ghcr.io/bestnathan/nession-mcp
  newName: ghcr.io/bestnathan/nession
  newTag: mcp-1.1.0
