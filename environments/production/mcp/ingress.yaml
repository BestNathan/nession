# #4529 production pilot: TLS terminates at existing operator-managed origin.
# Do not expose this internal HTTP route directly to the public internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-mcp-production
  labels:
    app: nession
    component: mcp
    env: production
  annotations:
    higress.io/domain: "mcp-nession.bestnathan.top"
    higress.io/upstream-read-timeout: "86400"
spec:
  ingressClassName: higress
  rules:
    - host: mcp-nession.bestnathan.top
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: nession-mcp-production
                port:
                  number: 9090
