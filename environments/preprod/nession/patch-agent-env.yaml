# Plain-string service references are not rewritten by kustomize nameReference,
# so the suffixed in-namespace service is stated explicitly.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nession-agent
spec:
  template:
    spec:
      containers:
        - name: nession-agent
          env:
            - name: AGENT_SERVER_URL
              value: "ws://nession-server-preprod:18080"
            - name: AGENT_CONNECT_URL
              value: "ws://preprod.agent.nession.nhome.local/ws"
            # #4588: canonical single-label WSS endpoint advertised alongside the
            # preserved nhome.local connect_url (overrides the base value).
            - name: AGENT_ADVERTISE_URLS
              value: "wss://preprod-agent-nession.bestnathan.top/ws"
