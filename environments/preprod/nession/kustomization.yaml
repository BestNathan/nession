apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# preprod — dormant (owner scope 2026-09-05): reserved, dispatch-ready via
# deploy.yml, not part of the release flow.
# Owner model: one shared nession namespace; environments are distinguished by
# nameSuffix (staging -staging, staging-01 -staging-01, preprod -preprod).
# This lane keeps its existing NFS dirs so the namespace move keeps data.
namespace: nession

nameSuffix: -preprod

commonLabels:
  env: preprod

resources:
  - ../../../base/nession
  - pv-pvc.yaml

images:
- name: ghcr.io/bestnathan/nession-agent
  newName: ghcr.io/bestnathan/nession
  newTag: agent-0.35.0
- name: ghcr.io/bestnathan/nession-server
  newName: ghcr.io/bestnathan/nession
  newTag: server-0.35.0
- name: ghcr.io/bestnathan/nession-ui
  newName: ghcr.io/bestnathan/nession
  newTag: ui-0.35.0

patchesStrategicMerge:
- patch-imagepullsecrets.yaml
- patch-claims.yaml

patches:
- path: patch-ingress.yaml
- path: patch-agent-env.yaml
