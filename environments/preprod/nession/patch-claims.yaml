# Point the agent's claude-home volume at this lane's own claim. The server and
# agent data volumes keep the base claim (kustomize nameReference rewrites both
# the base claimName and this patched one to the suffixed PVC names).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nession-agent
spec:
  template:
    spec:
      volumes:
        - name: claude-home
          persistentVolumeClaim:
            claimName: nession-claude-home
        - name: data
          persistentVolumeClaim:
            claimName: nession-server-data
