# Ingress hosts for preprod. Backends are written with the base service names;
# nameSuffix (-preprod) rewrites them to the suffixed services in the shared
# nession namespace.
# #4588: canonical single-label hosts added; nested bestnathan.top names retained
# as LAN compatibility during migration; nhome.local preserved verbatim. TLS for
# bestnathan.top terminates at the nitops-owned SLB. This lane is dormant and has
# no MCP service.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-server
  annotations:
    higress.io/domain: "preprod.nession.nhome.local preprod.nession.bestnathan.top preprod-nession.bestnathan.top"
spec:
  rules:
    - host: preprod.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-server
                port:
                  number: 10080
    - host: preprod.nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-server
                port:
                  number: 10080
    - host: preprod-nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-server
                port:
                  number: 10080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-agent
  annotations:
    higress.io/domain: "preprod.agent.nession.nhome.local preprod.agent.nession.bestnathan.top preprod-agent-nession.bestnathan.top"
spec:
  rules:
    - host: preprod.agent.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-agent
                port:
                  number: 10080
    - host: preprod.agent.nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-agent
                port:
                  number: 10080
    - host: preprod-agent-nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-agent
                port:
                  number: 10080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-ui
  annotations:
    higress.io/domain: "preprod.ui.nession.nhome.local preprod.ui.nession.bestnathan.top preprod-ui-nession.bestnathan.top"
spec:
  rules:
    - host: preprod.ui.nession.nhome.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-ui
                port:
                  number: 80
    - host: preprod.ui.nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-ui
                port:
                  number: 80
    - host: preprod-ui-nession.bestnathan.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nession-ui
                port:
                  number: 80
