# Per-environment NFS PV/PVC pairs — no subPath anywhere.
# The paths are the lane's existing dirs, so moving into namespace nession
# keeps the data. kustomize nameSuffix appends -preprod to every PV/PVC name
# and to the claimName / volumeName references.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nession-data
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    server: 192.168.2.105
    path: /mnt/share/k8s/preprod
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nession-server-data
spec:
  accessModes:
    - ReadWriteMany
  volumeName: nession-data
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nession-claude-home
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 10Gi
  nfs:
    server: 192.168.2.105
    path: /mnt/share/k8s/preprod/claude-home
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nession-claude-home
spec:
  accessModes:
    - ReadWriteMany
  volumeName: nession-claude-home
  resources:
    requests:
      storage: 10Gi
