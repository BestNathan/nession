# #3914 temporary one-time, non-service credential preflight.
# Remove this Job and its NetworkPolicy from GitOps after verified readback.
# No Kubernetes API token, egress, mounted data, or Secret content in logs.
apiVersion: batch/v1
kind: Job
metadata:
  name: nession-mcp-secret-preflight-3914
  namespace: nession
  labels:
    app: nession
    env: staging
    component: mcp-secret-preflight
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 14400
  template:
    metadata:
      labels:
        app: nession
        env: staging
        component: mcp-secret-preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com/n_public/nession:server-4774f3e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              # Never enable shell tracing: only fixed exit codes/status are evidence.
              [ -n "$MCP_INBOUND" ] || exit 21
              [ -n "$MCP_BACKEND" ] || exit 22
              [ -n "$SERVER_AUTH" ] || exit 23
              [ "$MCP_INBOUND" != "$MCP_BACKEND" ] || exit 24
              [ "$MCP_BACKEND" = "$SERVER_AUTH" ] || exit 25
              printf '%s\n' 'MCP_SECRET_PREFLIGHT_V1 status=pass'
          env:
            - name: MCP_INBOUND
              valueFrom:
                secretKeyRef:
                  name: nession-mcp-inbound-staging
                  key: token
                  optional: false
            - name: MCP_BACKEND
              valueFrom:
                secretKeyRef:
                  name: nession-mcp-backend-server-staging
                  key: token
                  optional: false
            - name: SERVER_AUTH
              valueFrom:
                secretKeyRef:
                  name: nession-secret-staging
                  key: auth-token
                  optional: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
