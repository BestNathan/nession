# #3914 temporary: deny ingress/egress for only the exact preflight Job Pod.
# The probe performs local string comparisons; the kubelet resolves Secret refs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nession-mcp-secret-preflight-deny-all-3914
  namespace: nession
spec:
  podSelector:
    matchLabels:
      app: nession
      env: staging
      component: mcp-secret-preflight
  policyTypes:
    - Ingress
    - Egress
