# Staging-only MCP endpoint (#3902, #3945, #4588). This overlay is enrolled in the
# Kustomization and active.
#
# Live topology (measured 2026-11-28, BestNathan/nitops#2 / nession#4588):
#  - LAN clients terminate TLS at the nitops SLB (cert-manager wildcard
#    slb/bestnathan-top-tls), which proxies to Higress over the trusted plaintext
#    hop. The ingress-level ssl-redirect is therefore NOT used: Higress ignores
#    X-Forwarded-Proto (use_remote_address, zero trusted hops), so keeping the
#    annotation made one-hop LAN requests loop 308.
#  - Public clients terminate TLS at Cloudflare, whose origin for this record is
#    port-forwarded directly to the Higress gateway TLS listener (nodePort 32077).
#    That listener binds this host only while this `tls` block exists, so the
#    legacy Cloudflare Origin CA material below is still required for the public
#    path and its retirement is deferred until the record points at the nitops
#    router (192.168.2.106), which already serves the cert-manager wildcard and
#    proxies to the SLB with verification.
#
# The backend accepts only authenticated exact /mcp requests; root is 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-mcp-staging
  labels:
    app: nession
    component: mcp
    env: staging
  annotations:
    higress.io/domain: "staging-mcp-nession.bestnathan.top"
    # Long-running MCP HTTP streaming may otherwise be cut by a short proxy
    # timeout. Keep the established Nession Higress timeout convention.
    higress.io/upstream-read-timeout: "86400"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - staging-mcp-nession.bestnathan.top
      secretName: nession-mcp-staging-tls
  rules:
    - host: staging-mcp-nession.bestnathan.top
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: nession-mcp-staging
                port:
                  number: 9090
