# Staging-only MCP endpoint (#3902, #3945, #4588). Enrolled and active.
#
# Measured 2026-11-28 (#4588 cutover attempt, reverted by this file): the Cloudflare
# origin for this host reaches the Higress gateway TLS listener WITHOUT SNI
# (gateway access log: requested_server_name "-", response_flags NR,
# route_not_found). The no-SNI filter chain that used to answer it is only created
# while BOTH this `tls` block and `higress.io/ssl-redirect` are present, so removing
# either broke the public path with 404. The ingress-level redirect also cannot be
# dropped while the nitops SLB proxies a plaintext hop, because Higress runs
# `use_remote_address` with zero trusted hops and ignores `X-Forwarded-Proto`.
#
# Retirement of the Cloudflare Origin CA material therefore requires, in order:
# (1) Higress trusts exactly one forwarded hop; (2) the SLB bestnathan hop is
# plaintext with `X-Forwarded-Proto https`; (3) the Cloudflare record is repointed
# to the nitops router (192.168.2.106) which already serves the cert-manager
# wildcard and proxies to the SLB with verification; (4) only then remove the
# `tls` block + `ssl-redirect` and retire sealed-tls.json.
# The backend accepts only authenticated /mcp requests; do not expose root.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-mcp-staging
  labels:
    app: nession
    component: mcp
    env: staging
  annotations:
    higress.io/domain: "staging-mcp-nession.bestnathan.top"
    # Higress supports SSL redirects; public bearer tokens must never flow
    # over cleartext HTTP, including requests for MCP initialize/tools.
    higress.io/ssl-redirect: "true"
    # Long-running MCP HTTP streaming may otherwise be cut by a short proxy
    # timeout. Keep the established Nession Higress timeout convention.
    higress.io/upstream-read-timeout: "86400"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - staging-mcp-nession.bestnathan.top
      secretName: nession-mcp-staging-tls
  rules:
    - host: staging-mcp-nession.bestnathan.top
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: nession-mcp-staging
                port:
                  number: 9090
