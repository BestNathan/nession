# Staging-only MCP endpoint (#3902, #3945). Manifest is deliberately
# excluded from Kustomization until new DNS, SAN, Host allowlist, TLS trust
# and Cloudflare Edge/Origin TLS have been verified after credential rotation.
# The backend accepts only authenticated /mcp requests; do not expose root.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nession-mcp-staging
  labels:
    app: nession
    component: mcp
    env: staging
  annotations:
    higress.io/domain: "staging-mcp-nession.bestnathan.top"
    # Higress supports SSL redirects; public bearer tokens must never flow
    # over cleartext HTTP, including requests for MCP initialize/tools.
    higress.io/ssl-redirect: "true"
    # Long-running MCP HTTP streaming may otherwise be cut by a short proxy
    # timeout. Keep the established Nession Higress timeout convention.
    higress.io/upstream-read-timeout: "86400"
spec:
  ingressClassName: higress
  tls:
    - hosts:
        - staging-mcp-nession.bestnathan.top
      secretName: nession-mcp-staging-tls
  rules:
    - host: staging-mcp-nession.bestnathan.top
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: nession-mcp-staging
                port:
                  number: 9090
