apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Independent MCP staging workload. This overlay is updated in the SAME GitOps
# commit as environments/staging/nession by scripts/gitops-commit.sh (#3902).
# Do not add to base/nession or production.
namespace: nession

commonLabels:
  app: nession
  env: staging

resources:
- sealed-backend-server.json
- sealed-inbound.json
# NOTE #4588: the Cloudflare origin for the public MCP record is port-forwarded
# straight to the Higress gateway TLS listener (nodePort 32077), which binds this
# host only while an Ingress `tls` block exists. Retirement of sealed-tls.json is
# deferred until that record points at the nitops router (which terminates TLS
# with the cert-manager wildcard and proxies to the SLB). Verified live
# 2026-11-28: dropping this broke the public path (404) while the LAN path through
# the SLB stayed healthy (401).
- sealed-tls.json
- sealed-secret.json
- deployment.yaml
- service.yaml
- ingress.yaml

# Non-secret standalone MCP config lives only in this GitOps source file.
# Keep the default Kustomize content hash so config edits roll the MCP Pod.
configMapGenerator:
- files:
  - mcp.toml
  name: nession-mcp-settings

images:
- name: ghcr.io/bestnathan/nession-mcp
  newName: ghcr.io/bestnathan/nession
  newTag: mcp-05eab8e
