apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Independent MCP staging workload. This overlay is updated in the SAME GitOps
# commit as environments/staging/nession by scripts/gitops-commit.sh (#3902).
# Do not add to base/nession or production.
namespace: nession

commonLabels:
  app: nession
  env: staging

resources:
- sealed-tls.json
- sealed-secret.json
- deployment.yaml
- service.yaml
  # Staging MCP public Ingress intentionally staged but inactive during
  # the hostname/TLS/Host-allowlist rotation (#3945). Re-enable ingress.yaml
  # by separate reviewed PR only after both Secrets, DNS, Edge/Origin TLS
  # and HTTPS/auth preflight for staging-mcp-nession.bestnathan.top pass.

images:
- name: ghcr.io/bestnathan/nession-mcp
  newName: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com/n_public/nession
  newTag: mcp-4aa667c
