apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Independent MCP staging workload. This overlay is updated in the SAME GitOps
# commit as environments/staging/nession by scripts/gitops-commit.sh (#3902).
# Do not add to base/nession or production.
namespace: nession

commonLabels:
  app: nession
  env: staging

resources:
- sealed-tls.json
# Legacy configuration Secret retained during the staged migration/rollback.
# Remove after ConfigMap + inbound token have been verified live.
- sealed-secret.json
- deployment.yaml
- service.yaml
- ingress.yaml

# Non-secret standalone MCP config lives only in this GitOps source file.
# Keep the default Kustomize content hash so config edits roll the MCP Pod.
configMapGenerator:
- name: nession-mcp-settings
  files:
  - mcp.toml

images:
- name: ghcr.io/bestnathan/nession-mcp
  newName: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com/n_public/nession
  newTag: mcp-4774f3e
