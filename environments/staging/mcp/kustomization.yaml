apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Independent MCP staging workload. This overlay is updated in the SAME GitOps
# commit as environments/staging/nession by scripts/gitops-commit.sh (#3902).
# Do not add to base/nession or production.
namespace: nession

commonLabels:
  app: nession
  env: staging

resources:
  - sealed-tls.json
  - sealed-secret.json
  - deployment.yaml
  - service.yaml
  # Public ingress is intentionally NOT activated before a trusted TLS
  # Secret, DNS and HTTPS redirect are independently verified. The ingress
  # definition is kept in ingress.yaml for that explicit activation PR.

images:
  - name: ghcr.io/bestnathan/nession-mcp
    newName: crpi-ck06yio90i1ttwlz.cn-beijing.personal.cr.aliyuncs.com/n_public/nession
    newTag: mcp-73e9859
