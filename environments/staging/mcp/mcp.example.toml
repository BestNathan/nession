# Copy to a private file, fill BOTH credentials and provision a Kubernetes
# Secret named nession-mcp-config-staging in namespace nession. Do not commit
# the filled configuration. The inbound MCP bearer must differ from the Server
# backend credential.
[mcp]
listen_address = "0.0.0.0:9090"
auth_token = ""
path = "/mcp"
# The NEW public Host must be allowed explicitly; remove the old multi-label
# hostname from the GitHub Environment MCP_CONFIG_TOML, then reseal the config.
# Edge TLS, Origin TLS and internal Service hosts are separate identities.
# Keep a narrow list rather than turning off Host validation.
allowed_hosts = [
  "staging-mcp-nession.bestnathan.top",
  "nession-mcp-staging",
  "nession-mcp-staging.nession.svc",
  "nession-mcp-staging.nession.svc.cluster.local",
  "localhost",
  "127.0.0.1"
]
# Optional, disabled by default in the runtime. Once the deployed MCP image
# includes standalone query authentication and ALL gateway access logs redact
# query parameters, enable this explicit opt-in in the protected MCP_CONFIG_TOML
# and reseal it with Deploy / Seal GitOps Secret. Do not put credentials here.
# allow_query_token = true
# No browser origins by default. Native MCP clients omit Origin.
allowed_origins = []

[backend.server]
# The existing staging Server's internal WebSocket listener.
endpoint = "ws://nession-server-staging:18080"
auth_token = ""
