[package]
name = "nession-github"
version.workspace = true
edition.workspace = true
description = "Read-only GitHub hosting context for the Git capability (#1290)"

[dependencies]
nession-common = { path = "../nession-common" }
nession-protocol = { path = "../nession-protocol" }
nession-git = { path = "../nession-git" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Codegen only — see nession-protocol/Cargo.toml.
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true, features = ["derive"] }

[features]
codegen = ["dep:ts-rs", "dep:schemars", "nession-protocol/codegen"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
