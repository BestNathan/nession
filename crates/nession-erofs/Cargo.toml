[package]
name = "nession-erofs"
version.workspace = true
edition.workspace = true

[features]
# The default composition is the Server's: deterministic build, blob store and
# Manifest catalog. Consumers that need mechanics only disable defaults.
default = ["build", "store", "catalog", "registry"]
store = []
build = ["store", "dep:tempfile"]
cache = ["dep:futures-util", "dep:reqwest", "dep:tokio", "dep:libc"]
mount = []
# Server image catalog (#3496): schema/metadata logic over the Server's own
# SQLite connection. It never opens a second database.
catalog = ["store", "dep:sea-orm", "dep:tokio"]
# External OCI Distribution pull/push (#3498). The Agent's feature set
# (`cache`, `mount`) deliberately does not enable this module: credentials stay
# in the Server-owned provider and never reach an Agent build.
registry = [
    "store",
    "catalog",
    "dep:reqwest",
    "dep:tokio",
    "dep:futures-util",
    "dep:base64",
    "dep:thiserror",
]

[dependencies]
anyhow.workspace = true
base64 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
futures-util = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
sea-orm = { workspace = true, optional = true }
sha2.workspace = true
tempfile = { version = "3.8", optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
httptest = "0.16"
tempfile = "3.8"
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
