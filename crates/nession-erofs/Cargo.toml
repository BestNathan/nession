[package]
name = "nession-erofs"
version.workspace = true
edition.workspace = true

[features]
# Server composition: build, CAS, catalog and source adapters. Mechanics-only
# consumers disable defaults.
default = ["build", "store", "catalog", "sources"]
store = []
build = ["store", "dep:tempfile"]
cache = ["dep:futures-util", "dep:reqwest", "dep:tokio", "dep:libc"]
mount = []
# Server image catalog (#3496): schema/metadata logic over the Server's own
# SQLite connection. It never opens a second database.
catalog = ["store", "dep:sea-orm", "dep:tokio"]
# Source adapters (#3497): checksum-verified archive/HTTPS inputs, raw EROFS
# import and an external OCI-to-EROFS converter boundary.
sources = ["build", "catalog", "dep:tar", "dep:flate2", "dep:reqwest"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"], optional = true }
sea-orm = { workspace = true, optional = true }
sha2.workspace = true
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tempfile = { version = "3.8", optional = true }
tokio = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
httptest = "0.16"
tempfile = "3.8"
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
