[package]
name = "nession-protocol"
version.workspace = true
edition.workspace = true
description = "The Nession Protocol Kernel: identity, envelope, descriptors, manifest and resolution"

# The dependency list is the ownership rule made mechanical.
#
# This crate must never depend on nession-common, nession-agent,
# nession-server, nession-git, nession-claude-code, MCP or the Web client. A
# Protocol Unit depends on the Kernel; the Kernel knows about no concrete unit,
# and no concrete provider. Anything that would need one of those crates in
# this list is a sign the code belongs somewhere else — see
# docs/architecture/protocol.md.
[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
