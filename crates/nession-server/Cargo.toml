[package]
name = "nession-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nession-server"
path = "src/main.rs"

[dependencies]
nession-common = { path = "../nession-common" }
# The Protocol Kernel. The relay holds a peer's manifest without knowing any
# concrete provider — see docs/architecture/protocol.md.
nession-protocol = { path = "../nession-protocol" }
# The execution primitives this Server's connections share with the agent's
# (#961-F). A runtime's, not a provider's — see that crate's Cargo.toml.
nession-runtime = { path = "../nession-runtime" }
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
futures-util.workspace = true
tokio-rustls.workspace = true
rand.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile = "3.8"
nession-agent = { path = "../nession-agent" }

[lints]
workspace = true
